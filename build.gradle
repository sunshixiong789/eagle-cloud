plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '4.0.3' apply false
    id 'org.graalvm.buildtools.native' version '0.11.5' apply false
    id 'org.hibernate.orm' version '7.2.6.Final'
    id 'com.github.ben-manes.versions' version '0.53.0'
}

allprojects {
    group = 'com.eagle'
    version = '1.0.0'

    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
}

// BOM 模块单独配置（java-platform 与 java/java-library 插件冲突，需排除）
configure(subprojects.findAll { it.name != 'eagle-bom' }) {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'org.graalvm.buildtools.native'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // 聚合模块和 starter 模块不应该是可执行应用
    if (project.name in ['eagle-services', 'eagle-starter'] ||
            project.path.contains(':eagle-starter:')) {
        bootJar {
            enabled = false
        }
        jar {
            enabled = true
        }
    }

    // 禁用 AOT 相关任务（避免 Gradle 9.x 并发问题和测试扫描问题）
    tasks.matching { it.name in ['processAot', 'processTestAot'] }.configureEach {
        enabled = false
    }

    hibernate {
        enhancement {
            enableAssociationManagement = true
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
        // mockito-core 单独作为 JVM Agent 加载，避免 JDK 21+ 动态 Agent 加载警告
        mockitoAgent
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                groupId = 'com.eagle'
                version = '1.0.0-SNAPSHOT'
            }
        }
    }

    tasks.named('compileJava') {
        options.compilerArgs += [
                '-Amapstruct.defaultComponentModel=spring',
                '-Amapstruct.unmappedTargetPolicy=IGNORE',
                '-Xlint:all,-processing'
        ]
    }

    tasks.named('test') {
        useJUnitPlatform()
        // 将 mockito-core 作为 JVM Agent 显式加载，修复 JDK 21+ 动态 Agent 加载警告
        jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
        // javaagent 会向 bootstrap classpath 追加内容，关闭 CDS 以消除 "Sharing is only supported..." 警告
        jvmArgs "-Xshare:off"
        // 设置测试超时时间，防止测试卡住（5分钟）
        timeout.set(java.time.Duration.ofMinutes(5))
        // 显示测试执行信息
        testLogging {
            events "passed", "skipped", "failed"
            showStandardStreams = true
        }
    }

    tasks.withType(JavaExec).configureEach {
        jvmArgs += [
                "-XX:+AllowRedefinitionToAddDeleteMethods"
        ]
    }

    // Aliyun SMS SDK 等第三方库的传递依赖可能含重复 JAR
    tasks.withType(Jar).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    // 禁用 GraalVM collectReachabilityMetadata，避免 Gradle 9.x 并发配置解析 bug
    tasks.matching { it.name == 'collectReachabilityMetadata' }.configureEach {
        enabled = false
    }

    dependencies {
        // 统一通过 BOM 管理依赖版本，子模块使用无版本写法即可
        implementation platform(project(':eagle-bom'))
        annotationProcessor platform(project(':eagle-bom'))
        testImplementation platform(project(':eagle-bom'))
        testAnnotationProcessor platform(project(':eagle-bom'))

        implementation 'org.springframework.boot:spring-boot-starter'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        compileOnly 'org.mapstruct:mapstruct'
        annotationProcessor 'org.mapstruct:mapstruct-processor'
        annotationProcessor 'org.projectlombok:lombok-mapstruct-binding'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        // transitive = false：只取 mockito-core jar 本身，不引入传递依赖
        mockitoAgent('org.mockito:mockito-core') { transitive = false }
    }

    graalvmNative {
        binaries {
            main {
                javaLauncher = javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(25)
                    vendor = JvmVendorSpec.GRAAL_VM
                }
            }
        }
    }
}
