plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '4.0.3' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.graalvm.buildtools.native' version '0.11.5' apply false
    id 'org.hibernate.orm' version '7.2.6.Final'
}

ext {
    // Spring/spring cloud 版本
    set('springBootVersion', '4.0.3')
    set('springCloudVersion', '2025.1.1')
    set('springCloudAlibabaVersion', '2025.1.0.0')
    set('springDependencyManagementVersion', '1.1.7')

    set('springModulithVersion', "2.0.3")

    // 数据库驱动版本
    set('mysqlConnectorVersion', '9.6.0')
    set('postgresqlVersion', '42.7.10')

    // 连接池版本
    set('druidVersion', '1.2.28')

    // Redis 版本
    set('redissonVersion', '4.3.0')

    // 工具类版本
    set('hutoolVersion', '5.8.43')
    set('guavaVersion', '33.5.0-jre')
    set('commonsLang3Version', '3.20.0')
    set('commonsCollections4Version', '4.5.0')
    set('commonsIoVersion', '2.21.0')
    set('uuidCreator', '6.1.1')

    // API 文档版本
    set('springdocVersion', '3.0.2')

    set('mapstructVersion', '1.6.3')
    set('lombokMapstructVersion', '0.2.0')

}

allprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.graalvm.buildtools.native'

    java {
        sourceCompatibility = '25'
        targetCompatibility = '25'
    }

    group = 'com.eagle'
    version = '1.0.0'

    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }

    hibernate {
        enhancement {
            enableAssociationManagement = true
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                groupId = 'com.eagle'
                version = '1.0.0-SNAPSHOT'
            }
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    tasks.named('processAot') {
    }
}
subprojects {

    dependencyManagement {
        imports {
            mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:${springCloudAlibabaVersion}"
        }
        dependencies {
            // 数据库驱动
            dependency "com.mysql:mysql-connector-j:${mysqlConnectorVersion}"
            dependency "org.postgresql:postgresql:${postgresqlVersion}"

            // 连接池
            dependency "com.alibaba:druid-spring-boot-3-starter:${druidVersion}"

            // Redis
            dependency "org.redisson:redisson-spring-boot-starter:${redissonVersion}"

            // 工具类
            dependency "cn.hutool:hutool-all:${hutoolVersion}"
            dependency "com.google.guava:guava:${guavaVersion}"
            dependency "org.apache.commons:commons-lang3:${commonsLang3Version}"
            dependency "org.apache.commons:commons-collections4:${commonsCollections4Version}"
            dependency "commons-io:commons-io:${commonsIoVersion}"
            dependency "com.github.f4b6a3:uuid-creator:${uuidCreator}"

            // API 文档
            dependency "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

            // mapstruct
            dependency "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructVersion}"
            dependency "org.mapstruct:mapstruct:${mapstructVersion}"
            dependency "org.mapstruct:mapstruct-processor:${mapstructVersion}"
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

}
