plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.graalvm.buildtools.native' version '0.11.5' apply false
}

ext {
    // Spring 版本
    set('springBootVersion', '4.0.3')
    set('springCloudVersion', '2025.1.1')
    set('springDependencyManagementVersion', '1.1.7')

    // 数据库驱动版本
    set('mysqlConnectorVersion', '9.1.0')
    set('postgresqlVersion', '42.7.4')
    set('h2Version', '2.3.232')

    // 持久层框架版本
    set('mybatisPlusVersion', '3.5.9')
    set('mybatisSpringBootVersion', '3.0.4')

    // 连接池版本
    set('druidVersion', '1.2.24')
    set('hikariVersion', '6.2.1')

    // Redis 版本
    set('redissonVersion', '3.40.2')

    // 工具类版本
    set('lombokVersion', '1.18.36')
    set('hutoolVersion', '5.8.34')
    set('guavaVersion', '33.4.0-jre')
    set('commonsLang3Version', '3.17.0')
    set('commonsCollections4Version', '4.5.0-M2')
    set('commonsIoVersion', '2.18.0')

    // JSON 处理版本
    set('jacksonVersion', '2.18.2')
    set('gsonVersion', '2.11.0')
    set('fastjsonVersion', '2.0.54')

    // API 文档版本
    set('springdocVersion', '2.7.0')
    set('swaggerVersion', '2.2.27')
    set('knifej4Version', '4.5.0')

    // 安全框架版本
    set('jjwtVersion', '0.12.6')
    set('saTokenVersion', '1.40.0')

    // 日志版本
    set('logbackVersion', '1.5.15')
    set('slf4jVersion', '2.0.16')

    // 测试框架版本
    set('junitVersion', '5.11.4')
    set('mockitoVersion', '5.15.2')

    // 其他常用依赖版本
    set('validationApiVersion', '3.1.0')
    set('servletApiVersion', '6.1.0')
    set('aspectjVersion', '1.9.24')
    set('caffeineVersion', '3.1.8')
    set('mapstructVersion', '1.6.3')

    // GraalVM 版本
    set('graalvmVersion', '0.11.5')
}

allprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = '25'
        targetCompatibility = '25'
    }

    group = 'com.eleganteer'
    version = '1.0.0'

    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
}
subprojects {

    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.graalvm.buildtools.native'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
        dependencies {
            // 数据库驱动
            dependency "com.mysql:mysql-connector-j:${mysqlConnectorVersion}"
            dependency "org.postgresql:postgresql:${postgresqlVersion}"
            dependency "com.h2database:h2:${h2Version}"

            // 连接池
            dependency "com.alibaba:druid-spring-boot-3-starter:${druidVersion}"

            // Redis
            dependency "org.redisson:redisson-spring-boot-starter:${redissonVersion}"

            // 工具类
            dependency "cn.hutool:hutool-all:${hutoolVersion}"
            dependency "com.google.guava:guava:${guavaVersion}"
            dependency "org.apache.commons:commons-lang3:${commonsLang3Version}"
            dependency "org.apache.commons:commons-collections4:${commonsCollections4Version}"
            dependency "commons-io:commons-io:${commonsIoVersion}"

            // API 文档
            dependency "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
            dependency "io.swagger.core.v3:swagger-annotations:${swaggerVersion}"
            dependency "com.github.xiaoymin:knife4j-openapi3-jakarta-spring-boot-starter:${knifej4Version}"

            // mapstruct
            dependency "org.mapstruct:mapstruct:${mapstructVersion}"
            dependency "org.mapstruct:mapstruct-processor:${mapstructVersion}"
        }
    }

    dependencies {
        implementation 'org.projectlombok:lombok'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        annotationProcessor 'org.projectlombok:lombok'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

}
