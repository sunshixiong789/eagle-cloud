import java.time.Duration

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'org.graalvm.buildtools.native' version '0.11.5' apply false
    id 'org.hibernate.orm' version '7.4.1.Final'
    id 'com.github.ben-manes.versions' version '0.53.0'
}

allprojects {
    group = 'com.eagle'
    version = '1.9.0-SNAPSHOT'

    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
}

// Nexus 配置读取：-P 参数 > ~/.gradle/gradle.properties > 环境变量
// 配置模板见项目根 gradle.properties.example
ext.nexusConfig = { String propKey, String envKey ->
    findProperty(propKey)?.toString() ?: System.getenv(envKey) ?: ''
}

// 所有子模块（含 BOM）共享 Nexus 发布仓库配置
configure(subprojects) {
    apply plugin: 'maven-publish'

    publishing {
        repositories {
            maven {
                name = 'nexus'
                def isSnapshot = project.version.toString().endsWith('SNAPSHOT')
                def targetUrl = isSnapshot
                        ? rootProject.nexusConfig('nexusSnapshotUrl', 'NEXUS_SNAPSHOT_URL')
                        : rootProject.nexusConfig('nexusReleaseUrl', 'NEXUS_RELEASE_URL')
                if (targetUrl) {
                    url = targetUrl
                    // 内网 Nexus 常见为 http
                    allowInsecureProtocol = targetUrl.startsWith('http://')
                }
                credentials {
                    username = rootProject.nexusConfig('nexusUsername', 'NEXUS_USERNAME')
                    password = rootProject.nexusConfig('nexusPassword', 'NEXUS_PASSWORD')
                }
            }
        }
    }
}

// BOM 模块单独配置（java-platform 与 java/java-library 插件冲突，需排除）
configure(subprojects.findAll { it.name != 'eagle-bom' }) {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    apply plugin: 'maven-publish'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'org.graalvm.buildtools.native'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        // 生成 sources.jar 和 javadoc.jar
        // withSourcesJar()
        // withJavadocJar()
    }

    jacoco {
        toolVersion = '0.8.13'
    }

    // 覆盖率门禁（棘轮式：阈值略低于当前水位，只防倒退，不逼着立刻补测试）
    // 实测基线(system-service)：整体指令 52.8%；domain.model 分支 77%~100%
    // 覆盖率提升后请同步上调阈值。
    //
    // 跑法：gradle :module:test :module:jacocoTestCoverageVerification
    // ⚠️ 必须跑【完整】test 任务。若加了 --tests 过滤，jacoco 只统计那次过滤执行的覆盖，
    //    结果会是 0.00 并误报门禁失败 —— 这不是覆盖率退化，是用法问题。
    tasks.named('jacocoTestCoverageVerification') {
        violationRules {
            rule {
                element = 'BUNDLE'
                limit { counter = 'INSTRUCTION'; minimum = 0.45 }
            }
            // 只卡聚合根/实体所在的 domain.model —— 领域逻辑是核心资产。
            // 不卡 *.enums / *.repository：纯枚举与接口没有有意义的分支，卡了只会逼出假测试。
            rule {
                element = 'PACKAGE'
                includes = ['*.domain.model']
                limit { counter = 'BRANCH'; minimum = 0.60 }
            }
        }
    }

    // 聚合模块和 starter 模块不应该是可执行应用
    if (project.name in ['eagle-services', 'eagle-starter'] ||
            project.path.contains(':eagle-starter:')) {
        bootJar {
            enabled = false
        }
        jar {
            enabled = true
        }
    }

    // ── AOT 任务按需触发：只有显式跑 native* 任务时才执行 ────────────────────────
    // apply 'org.graalvm.buildtools.native' 后，Spring Boot 的 NativeImagePluginAction 会把
    // processAot / processTestAot 挂进 classes / testClasses —— nativeCompile 本身不在 build
    // 里，但这两个前置任务每次 gradle build 都要跑。processAot 真的启动一次 Spring 上下文，
    // processTestAot 还要启动全部测试上下文，代价很高（姊妹仓库 ease-mind-servers 实测
    // 单服务约 19s），且本仓库还撞上过 Gradle 9.x 的并发与测试扫描问题 —— 这正是它们原先
    // 被**无条件**禁用的原因。
    //
    // 无条件禁用的副作用是 nativeCompile 也一并残废：拿不到 AOT 产物的 native image 基本
    // build 不出来。改成按本次调用的任务名判定，两边都不牺牲：
    //   gradle build / test / bootJar         → 禁用，与此前行为完全一致（build 不会变慢）
    //   gradle nativeCompile / nativeRun / …  → 启用，native image 该有的一步不少
    //
    // 带路径的 :eagle-services:eagle-auth-service:nativeCompile 同样识别；直接点名
    // processAot / processTestAot 也视为请求，免得手动跑这两个任务反被自己禁掉。
    //
    // ⚠️ 上面那个 Gradle 9.x 并发 / 测试扫描问题并未修复，只是挪到了 native 构建时才会碰上。
    //    首次跑 nativeCompile 若复现，就地排查，不要退回无条件禁用（那等于放弃 native）。
    def nativeRequested = gradle.startParameter.taskNames.any {
        def name = it.tokenize(':').last().toLowerCase()
        name.startsWith('native') || name.contains('aot')
    }
    if (!nativeRequested) {
        tasks.matching {
            it.name in ['processAot', 'processTestAot', 'collectReachabilityMetadata']
        }.configureEach { enabled = false }
    }

    hibernate {
        enhancement {
            enableAssociationManagement = true
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
        // mockito-core 单独作为 JVM Agent 加载，避免 JDK 21+ 动态 Agent 加载警告
        mockitoAgent
    }

    publishing {
        publications {
            // 用 register 替代 mavenJava(MavenPublication) {} 命名块语法，让 IDEA 识别签名
            register('mavenJava', MavenPublication) {
                from components.java
                groupId = 'com.eagle'
            }
        }
    }

    tasks.named('compileJava') {
        options.compilerArgs += [
                '-Xlint:all,-processing'
        ]
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
        options.docEncoding = 'UTF-8'
        // 中文注释 + 大量历史代码不规范，关闭 doclint 严格校验避免发布失败
        options.addStringOption('Xdoclint:none', '-quiet')
        failOnError = false
    }

    tasks.named('test') {
        useJUnitPlatform()
        // 将 mockito-core 作为 JVM Agent 显式加载，修复 JDK 21+ 动态 Agent 加载警告
        jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
        // javaagent 会向 bootstrap classpath 追加内容，关闭 CDS 以消除 "Sharing is only supported..." 警告
        jvmArgs "-Xshare:off"
        // 设置测试超时时间，防止测试卡住（5分钟）
        timeout.set(Duration.ofMinutes(5))
        // 显示测试执行信息
        testLogging {
            events "passed", "skipped", "failed"
            showStandardStreams = true
        }
        finalizedBy tasks.named('jacocoTestReport')
    }

    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')
        reports {
            xml.required = true
            html.required = true
            csv.required = false
        }
    }

    tasks.withType(JavaExec).configureEach {
        jvmArgs += [
                "-XX:+AllowRedefinitionToAddDeleteMethods"
        ]
    }

    // Aliyun SMS SDK 等第三方库的传递依赖可能含重复 JAR
    tasks.withType(Jar).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    // 禁用 GraalVM collectReachabilityMetadata，避免 Gradle 9.x 并发配置解析 bug
    tasks.matching { it.name == 'collectReachabilityMetadata' }.configureEach {
        enabled = false
    }

    // 统一向所有可声明依赖的 configuration 注入 BOM platform，避免逐个添加
    // （developmentOnly / mockitoAgent 等不继承 implementation，必须显式注入）
    def bomTargets = ['implementation', 'compileOnly', 'runtimeOnly', 'annotationProcessor',
                      'developmentOnly', 'testImplementation', 'testCompileOnly',
                      'testRuntimeOnly', 'testAnnotationProcessor', 'mockitoAgent']
    configurations.configureEach { conf ->
        if (conf.name in bomTargets) {
            project.dependencies.add(conf.name, project.dependencies.platform(project(':eagle-bom')))
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        developmentOnly 'org.springframework.boot:spring-boot-devtools'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        // transitive = false：只取 mockito-core jar 本身，不引入传递依赖
        mockitoAgent('org.mockito:mockito-core') { transitive = false }
    }

    graalvmNative {
        binaries.named('main') {
            javaLauncher.set(javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(25)
                vendor = JvmVendorSpec.GRAAL_VM
            })
        }
    }
}

// ── 三个可执行服务的生产运行时依赖瘦身 + 分层 jar ────────────────────────────
//
// 作用域刻意限定在 eagle-services/* ，**不动 eagle-starter**：
// eagle-data-jpa-starter 有意 runtimeOnly 声明 MySQL / PostgreSQL / H2 三种驱动，
// 那是框架对外承诺的多库支持，不能在 starter 层砍。但这三个服务的 jdbc url 全是
// postgresql（已核对 application*.yml），所以在服务层排掉另外两个是安全的。
//
// 每条 exclude 都做过静态验证，复核方式：
//   gradle :eagle-services:<svc>:dependencies --configuration runtimeClasspath
configure(subprojects.findAll { it.parent?.name == 'eagle-services' }) {

    configurations.named('runtimeClasspath') {
        // 32.6 MB。broker 端 RocksDB 存储引擎，经 eagle-rocketmq-starter → rocketmq-tools
        // → rocketmq-common 传递进来。已验证 rocketmq-{common,tools,client,remoting,srvutil}
        // 全部 class 无一处引用 org/rocksdb —— topic-admin(DefaultMQAdminExt) 路径不加载它。
        exclude group: 'org.apache.rocketmq', module: 'rocketmq-rocksdb'
        // 11.6 MB。netty-all 聚合带进来的 QUIC 库：原生库有 linux/osx/windows 5 个平台分类器，
        // 其中 4 个在 Linux 容器里永远用不上。已验证全链路无 QUIC 引用。
        // gateway 虽不依赖 rocketmq，但同样经 reactor-netty 吃到这几个包，故一并排除。
        exclude group: 'io.netty', module: 'netty-codec-native-quic'
        exclude group: 'io.netty', module: 'netty-codec-classes-quic'
        // 2.5 + 2.6 MB。eagle-data-jpa-starter 传递的 MySQL 驱动与 H2 内存库；
        // 三服务运行时都只连 PostgreSQL。测试若需 H2，用 testRuntimeOnly 单独声明
        // （runtimeClasspath 的 exclude 不会传播到 testRuntimeClasspath）。
        exclude group: 'com.mysql', module: 'mysql-connector-j'
        exclude group: 'com.h2database', module: 'h2'
    }

    // 注：这里原本有一段自定义 bootJar `layered {}` 配置（把 com.eagle:* 与 *-SNAPSHOT
    // 改判到 snapshot-dependencies 层），唯一消费方是三个服务 Dockerfile 里
    // `java -Djarmode=tools ... extract --layers` 那个 stage。镜像已简化为单阶段直接跑
    // fat jar，分层信息不再有人读，故删除。若日后改用 Cloud Native Buildpacks 或重新
    // 引入分层 COPY，从 git 历史里取回即可。
}
