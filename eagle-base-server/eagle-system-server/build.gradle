dependencies {
    implementation project(':eagle-starter:eagle-data-jpa-starter')
    implementation project(':eagle-starter:eagle-resource-server-starter')
    implementation project(':eagle-starter:eagle-data-permission-starter')
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Nacos 服务注册与发现
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'

    // 微信/第三方 SDK
    implementation "com.github.binarywang:weixin-java-miniapp"
    implementation "com.aliyun:dysmsapi20170525"

    implementation "com.github.ben-manes.caffeine:caffeine"
    implementation "org.apache.poi:poi-ooxml"


    // Spring Modulith
    // compileOnly：仅编译期可见，@Modulithic/@ApplicationModule/@NamedInterface 注解使用
    compileOnly 'org.springframework.modulith:spring-modulith-core'
    // spring-modulith-starter-test 提供 ApplicationModules、Documenter 等测试工具
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
}
