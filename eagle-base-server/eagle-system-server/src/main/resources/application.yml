# ===========================================
# Eagle 应用基础配置
# ===========================================

# 服务器配置
server:
  port: 80  # 应用监听端口

# Spring 基础配置
spring:
  application:
    name: eagle-system-server  # 应用名称
  profiles:
    active: local  # 激活的配置文件（local/dev/prod）
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
# ===========================================
# Eagle 自定义配置
# ===========================================
eagle:
  # JWT 签名密钥配置
  jwt:
    keystore-location: ${EAGLE_JWT_KEYSTORE_LOCATION:classpath:jwt-keystore.p12}
    keystore-password: ${EAGLE_JWT_KEYSTORE_PASSWORD:eagle-jwt-dev-2026}
    key-alias: eagle-jwt
  # 初始管理员账户配置
  # 注意：生产环境务必通过环境变量 EAGLE_ADMIN_PASSWORD 设置强密码
  admin:
    username: admin  # 管理员用户名
    password: ${EAGLE_ADMIN_PASSWORD}  # 管理员密码，必须通过环境变量设置
    name: 系统管理员  # 显示名称
    email: admin@eagle.com  # 邮箱地址
  # OAuth2 认证配置
  # 用于配置默认的 OAuth2 客户端，支持多种登录方式
  oauth:
    default-client:
      enabled: true  # 是否启用默认客户端
      client-id: eagleWeb  # 客户端 ID，前端应用使用此 ID 进行认证
      client-name: Eagle Web 前端应用  # 客户端显示名称
      client-authentication-methods: none  # 客户端认证方法（none 表示公开客户端）
      # 支持的授权类型：
      # - authorization_code: 授权码模式（PKCE）
      # - refresh_token: 刷新令牌
      # - wechat_mini_program: 微信小程序登录
      # - sms_code: 短信验证码登录
      authorization-grant-types: authorization_code,refresh_token,wechat_mini_program,sms_code
      # 回调地址，多个用逗号分隔
      # Swagger UI 发送的 redirect_uri 是绝对 URL（如 http://host/swagger-ui/oauth2-redirect.html），
      # Spring Authorization Server 做精确字符串匹配，相对路径永远不匹配，因此必须注册绝对 URL。
      # 同时注册系统服务直连地址和网关地址，支持两种访问方式的 Swagger OAuth2 流程。
      redirect-uris: >
        http://localhost:8080/auth/oauth2/callback,
        ${SYSTEM_SERVER_URL:http://localhost:80}/swagger-ui/oauth2-redirect.html,
        ${GATEWAY_URL:http://localhost:8080}/swagger-ui/oauth2-redirect.html
      # 权限范围
      scopes: openid,profile,email,address,phone
      require-proof-key: true  # 启用 PKCE（公开客户端必须启用）
      require-authorization-consent: false  # 是否需要用户授权确认
      access-token-ttl-seconds: 3600  # 访问令牌有效期（秒），默认 1 小时
      refresh-token-ttl-seconds: 2592000  # 刷新令牌有效期（秒），默认 30 天
  # 微信集成配置
  # 支持微信小程序、PC 扫码、H5 三种登录方式
  wechat:
    # 微信小程序配置
    # 获取方式：登录微信公众平台 → 开发管理 → 开发设置
    mini-program:
      app-id: ${WECHAT_MINI_APP_ID:}  # 微信小程序 AppID
      app-secret: ${WECHAT_MINI_APP_SECRET:}  # 微信小程序 AppSecret
    # 微信网页应用配置
    web:
      # PC 扫码登录配置
      # 获取方式：登录微信开放平台 → 管理中心 → 网站应用
      pc:
        app-id: ${WECHAT_WEB_APP_ID:}  # 微信开放平台 AppID
        app-secret: ${WECHAT_WEB_APP_SECRET:}  # 微信开放平台 AppSecret
        redirect-uri: ${WECHAT_WEB_REDIRECT_URI:http://localhost/login/wechat/pc/callback}  # 扫码登录回调地址
      # H5 登录配置（微信公众号）
      # 获取方式：登录微信公众平台 → 开发管理 → 开发设置
      h5:
        app-id: ${WECHAT_MP_APP_ID:}  # 微信公众号 AppID
        app-secret: ${WECHAT_MP_APP_SECRET:}  # 微信公众号 AppSecret
        redirect-uri: ${WECHAT_MP_REDIRECT_URI:http://localhost/login/wechat/h5/callback}  # H5 登录回调地址
  # 审计日志配置
  log:
    cleanup:
      enabled: true  # 是否启用自动清理
      retention-days: 90  # 日志保留天数
      cron: "0 0 2 * * ?"  # 定时任务表达式，每天凌晨 2 点执行清理
  # 短信服务配置（阿里云）
  # 获取方式：登录阿里云控制台 → 短信服务
  sms:
    aliyun:
      access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}  # 阿里云 AccessKey ID
      access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}  # 阿里云 AccessKey Secret
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}  # 短信签名
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}  # 验证码模板代码
# ===========================================
# Swagger/OpenAPI 文档配置
# ===========================================
# ===========================================
# Spring Boot Actuator 监控端点配置
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
  info:
    env:
      enabled: true
# ===========================================
# Swagger/OpenAPI 文档配置
# ===========================================
springdoc:
  show-oauth2-endpoints: true  # 显示 OAuth2 相关端点
  swagger-ui:
    oauth:
      app-name: Eagle  # OAuth2 应用名称
      client-id: eagleWeb  # OAuth2 客户端 ID
      use-pkce-with-authorization-code-grant: true  # 启用 PKCE
      scopes:  # 默认请求的权限范围
        - "openid"
        - "profile"
    csrf:
      enabled: true  # 启用 CSRF 保护
    doc-expansion: none  # 文档展开方式（none: 全部收起 / list: 展开接口 / full: 全部展开）
    persist-authorization: true  # 持久化授权信息，刷新页面后保持登录状态