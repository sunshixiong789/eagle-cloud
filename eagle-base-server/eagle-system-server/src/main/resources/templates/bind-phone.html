<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绑定手机号</title>
    <style>
        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Base ── */
        :root {
            --primary: #4782da;
            --primary-dark: #1e3a5f;
            --primary-gradient: linear-gradient(160deg, #4782da 0%, #1e3a5f 100%);
            --error: #ef4444;
            --success: #059669;
            --wechat: #07c160;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #c4cdd8;
            --border-light: #e2e8f0;
            --bg-page: #eef2f7;
            --radius-input: 10px;
            --radius-card: 20px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                         'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        /* ── Card ── */
        .bind-card {
            display: flex;
            width: 740px;
            max-width: 100%;
            border-radius: var(--radius-card);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
            animation: popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.94) translateY(8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ── Brand Panel ── */
        .brand {
            width: 260px;
            flex-shrink: 0;
            background: var(--primary-gradient);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .brand::before {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(circle at 75% 15%, rgba(255,255,255,0.09) 0%, transparent 55%),
                radial-gradient(circle at 20% 85%, rgba(255,255,255,0.06) 0%, transparent 45%);
        }

        .brand-dots {
            position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.13) 1px, transparent 1px);
            background-size: 18px 18px;
        }

        .brand-icon {
            position: relative;
            width: 64px; height: 64px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
        }

        .brand-icon svg {
            width: 30px; height: 30px;
            stroke: white; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        .brand-title {
            position: relative;
            font-size: 1.2rem; font-weight: 700;
            color: white; margin-bottom: 8px;
        }

        .brand-sub {
            position: relative;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
        }

        /* ── Form Panel ── */
        .form-panel {
            flex: 1;
            background: white;
            padding: 36px 36px 32px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .form-title {
            font-size: 1.2rem; font-weight: 700;
            color: var(--text-main); margin-bottom: 4px;
        }

        .form-sub {
            font-size: 0.8rem; color: var(--text-sub);
            margin-bottom: 20px;
        }

        /* ── Wechat Badge ── */
        .wechat-badge {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .wechat-badge svg {
            width: 24px; height: 24px;
            color: var(--wechat); flex-shrink: 0;
        }

        .wechat-badge-text {
            font-size: 0.82rem; color: #15803d;
        }

        .wechat-badge-text strong { font-weight: 600; }

        /* ── Alert Banner ── */
        .alert {
            display: flex; align-items: center; gap: 8px;
            border-radius: 8px; padding: 10px 14px;
            font-size: 0.8rem; margin-bottom: 16px;
        }

        .alert-error {
            background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
        }

        .alert-success {
            background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d;
        }

        .alert svg { width: 15px; height: 15px; flex-shrink: 0; }

        /* ── MUI Outlined Input ── */
        .mui-field { position: relative; margin-bottom: 8px; }

        .mui-field input {
            width: 100%;
            height: 52px;
            padding: 0 40px 0 44px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-input);
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--text-main);
            background: white;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .mui-field input::placeholder { color: transparent; }

        .mui-field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(71, 130, 218, 0.12);
        }

        .mui-field input.is-error { border-color: var(--error); }
        .mui-field input.is-error:focus { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1); }

        .mui-field label {
            position: absolute;
            left: 44px; top: 50%; transform: translateY(-50%);
            font-size: 0.88rem; color: #94a3b8;
            pointer-events: none;
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            background: white; padding: 0 4px; line-height: 1;
        }

        .mui-field input:focus + label,
        .mui-field input:not(:placeholder-shown) + label {
            top: 0;
            font-size: 0.72rem;
            color: var(--primary);
        }

        .mui-field input.is-error + label,
        .mui-field input.is-error:focus + label { color: var(--error); }

        .mui-field input:not(:placeholder-shown):not(:focus) + label { color: var(--text-sub); }

        .field-prefix {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; display: flex; align-items: center; pointer-events: none;
            transition: color 0.2s;
        }

        .field-prefix svg { width: 18px; height: 18px; }

        .mui-field input:focus ~ .field-prefix { color: var(--primary); }
        .mui-field input.is-error ~ .field-prefix { color: var(--error); }

        .field-helper {
            display: flex; align-items: center; gap: 4px;
            font-size: 0.72rem; color: var(--error);
            padding: 3px 4px 8px;
            min-height: 20px;
        }

        .field-helper svg { width: 12px; height: 12px; flex-shrink: 0; }
        .field-helper:empty { padding: 0; min-height: 0; }

        /* ── Code Input Row ── */
        .code-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .code-row .mui-field { flex: 1; margin-bottom: 0; }

        .btn-send-code {
            flex-shrink: 0;
            width: 120px;
            height: 52px;
            border: 1.5px solid var(--primary);
            border-radius: var(--radius-input);
            background: white;
            color: var(--primary);
            font-size: 0.82rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s, opacity 0.2s;
        }

        .btn-send-code:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }

        .btn-send-code:disabled {
            border-color: var(--border);
            color: var(--text-sub);
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* ── Primary Button ── */
        .btn-primary {
            width: 100%; height: 46px;
            border: none; border-radius: var(--radius-input);
            background: var(--primary-gradient);
            color: white; font-size: 0.9rem; font-weight: 600;
            letter-spacing: 0.5px; cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(71, 130, 218, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(71, 130, 218, 0.45);
        }

        .btn-primary:active { transform: translateY(0); }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ── Success Panel ── */
        .success-panel { display: none; animation: fadeSlide 0.3s ease; }
        .success-panel.active { display: block; }
        .form-content { animation: fadeSlide 0.3s ease; }
        .form-content.hidden { display: none; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: #f0fdf4;
            display: flex; align-items: center; justify-content: center;
            margin: 16px auto 20px;
        }

        .success-icon svg { width: 32px; height: 32px; color: var(--success); }

        .success-text {
            text-align: center;
            font-size: 1rem; font-weight: 600;
            color: var(--text-main); margin-bottom: 8px;
        }

        .success-hint {
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-sub); margin-bottom: 24px;
        }

        /* ── Skip Link ── */
        .skip-link {
            text-align: center; margin-top: 18px;
            font-size: 0.8rem;
        }

        .skip-link a {
            color: var(--text-sub);
            text-decoration: none; transition: color 0.2s;
        }

        .skip-link a:hover { color: var(--primary); }

        /* ── Mobile ── */
        @media (max-width: 640px) {
            body { align-items: flex-start; padding: 0; background: white; }

            .bind-card {
                width: 100%; min-height: 100vh; border-radius: 0;
                flex-direction: column; box-shadow: none; animation: none;
            }

            .brand {
                width: 100%; padding: 36px 24px 52px;
                border-radius: 0 0 40% 40% / 0 0 36px 36px;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.14);
            }

            .brand-icon { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 14px; }
            .brand-icon svg { width: 26px; height: 26px; }
            .brand-title { font-size: 1.1rem; }
            .brand-sub { font-size: 0.75rem; }

            .form-panel {
                flex: 1; margin: 28px 20px 32px; padding: 28px 20px 24px;
                border-radius: 16px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            }

            .form-title { font-size: 1.05rem; text-align: center; }
            .form-sub { text-align: center; margin-bottom: 16px; }

            .mui-field input { height: 48px; font-size: 0.88rem; }
            .btn-primary { height: 44px; font-size: 0.88rem; }
            .btn-send-code { width: 100px; height: 48px; font-size: 0.78rem; }
        }

        @media (min-width: 641px) and (max-width: 800px) {
            .bind-card { width: 100%; }
            .brand { width: 220px; }
            .form-panel { padding: 32px 28px 28px; }
        }
    </style>
</head>
<body>

<div class="bind-card">
    <!-- Brand Panel -->
    <div class="brand">
        <div class="brand-dots"></div>
        <div class="brand-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>
        <div class="brand-title">认证中心</div>
        <div class="brand-sub">绑定手机号</div>
    </div>

    <!-- Form Panel -->
    <div class="form-panel">
        <div class="form-title">绑定手机号</div>
        <div class="form-sub">绑定手机号后可使用短信登录和找回密码</div>

        <!-- WeChat Badge -->
        <div class="wechat-badge">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 01.213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 00.167-.054l1.903-1.114a.864.864 0 01.717-.098 10.16 10.16 0 002.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178A1.17 1.17 0 014.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178 1.17 1.17 0 01-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 01.598.082l1.584.926a.272.272 0 00.14.045.247.247 0 00.242-.245c0-.06-.024-.12-.04-.178l-.325-1.233a.492.492 0 01.177-.554C23.028 18.554 24 16.773 24 14.845c0-3.109-2.745-5.835-7.062-5.987zm-2.139 2.478c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.982.969-.982z"/>
            </svg>
            <div class="wechat-badge-text">
                微信登录成功，绑定手机号以获得更完整的账号体验
            </div>
        </div>

        <!-- Global Error Alert -->
        <div class="alert alert-error" id="global-error" style="display:none;">
            <svg viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/>
            </svg>
            <span id="global-error-msg"></span>
        </div>

        <!-- Form Content -->
        <div class="form-content" id="form-content">
            <!-- Phone -->
            <div class="mui-field">
                <input type="tel" id="bind-phone" placeholder=" " autocomplete="tel" maxlength="11">
                <label for="bind-phone">手机号</label>
                <span class="field-prefix">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path d="M7 2a2 2 0 00-2 2v12a2 2 0 002 2h6a2 2 0 002-2V4a2 2 0 00-2-2H7zm3 14a1 1 0 100-2 1 1 0 000 2z"/>
                    </svg>
                </span>
            </div>
            <div class="field-helper" id="bind-phone-error"></div>

            <!-- Code + Send Button -->
            <div class="code-row">
                <div class="mui-field">
                    <input type="text" id="bind-code" placeholder=" " autocomplete="one-time-code"
                           maxlength="6" inputmode="numeric">
                    <label for="bind-code">验证码</label>
                    <span class="field-prefix">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"/>
                        </svg>
                    </span>
                </div>
                <button type="button" class="btn-send-code" id="bind-send-btn">获取验证码</button>
            </div>
            <div class="field-helper" id="bind-code-error"></div>

            <button type="button" class="btn-primary" id="btn-bind" style="margin-top: 10px;">绑定手机号</button>
        </div>

        <!-- Success Panel -->
        <div class="success-panel" id="success-panel">
            <div class="success-icon">
                <svg viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                </svg>
            </div>
            <div class="success-text">手机号绑定成功</div>
            <div class="success-hint">现在可以使用手机号登录和找回密码</div>
            <a id="success-redirect" href="/" class="btn-primary" style="display:block;text-align:center;text-decoration:none;line-height:46px;">继续</a>
        </div>

        <div class="skip-link">
            <a id="skip-link" href="/">暂时跳过，稍后绑定 &rarr;</a>
        </div>
    </div>
</div>

<script th:inline="javascript">
(function () {
    var accountId = /*[[${accountId}]]*/ 0;
    var redirectUrl = /*[[${redirectUrl}]]*/ '/';

    /* ── 设置跳过和成功后的重定向地址 ── */
    document.getElementById('skip-link').href = redirectUrl;
    document.getElementById('success-redirect').href = redirectUrl;

    var phoneInput = document.getElementById('bind-phone');
    var codeInput = document.getElementById('bind-code');
    var phoneError = document.getElementById('bind-phone-error');
    var codeError = document.getElementById('bind-code-error');
    var sendBtn = document.getElementById('bind-send-btn');
    var btnBind = document.getElementById('btn-bind');
    var globalError = document.getElementById('global-error');
    var globalErrorMsg = document.getElementById('global-error-msg');

    var phoneRegex = /^1[3-9]\d{9}$/;
    var errorSvg = '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/></svg>';

    function setError(input, helperEl, msg) {
        input.classList.add('is-error');
        helperEl.innerHTML = msg ? errorSvg + msg : '';
    }

    function clearError(input, helperEl) {
        input.classList.remove('is-error');
        helperEl.innerHTML = '';
    }

    function showGlobalError(msg) {
        globalErrorMsg.textContent = msg;
        globalError.style.display = 'flex';
    }

    function hideGlobalError() {
        globalError.style.display = 'none';
    }

    /* ── Phone Input ── */
    phoneInput.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 11);
        if (phoneRegex.test(this.value)) clearError(this, phoneError);
    });

    codeInput.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 6);
        if (this.value.length > 0) clearError(this, codeError);
    });

    /* ── Send Code with Countdown ── */
    var countdown = 0;
    var countdownTimer = null;

    function startCountdown() {
        countdown = 60;
        sendBtn.disabled = true;
        sendBtn.textContent = countdown + 's';
        countdownTimer = setInterval(function () {
            countdown--;
            if (countdown <= 0) {
                clearInterval(countdownTimer);
                sendBtn.disabled = false;
                sendBtn.textContent = '获取验证码';
            } else {
                sendBtn.textContent = countdown + 's';
            }
        }, 1000);
    }

    sendBtn.addEventListener('click', function () {
        var phone = phoneInput.value.trim();
        if (!phoneRegex.test(phone)) {
            setError(phoneInput, phoneError, '请输入正确的手机号');
            return;
        }
        clearError(phoneInput, phoneError);
        hideGlobalError();
        sendBtn.disabled = true;
        sendBtn.textContent = '发送中...';

        fetch('/sms/code?phone=' + encodeURIComponent(phone), { method: 'POST' })
            .then(function (resp) {
                if (resp.ok) {
                    startCountdown();
                } else {
                    return resp.json().then(function (data) {
                        throw new Error(data.message || '发送失败');
                    });
                }
            })
            .catch(function (err) {
                showGlobalError(err.message || '发送失败，请稍后重试');
                sendBtn.disabled = false;
                sendBtn.textContent = '获取验证码';
            });
    });

    /* ── Bind Phone ── */
    btnBind.addEventListener('click', function () {
        hideGlobalError();
        var valid = true;
        if (!phoneRegex.test(phoneInput.value.trim())) {
            setError(phoneInput, phoneError, '请输入正确的手机号');
            valid = false;
        }
        if (!codeInput.value.trim()) {
            setError(codeInput, codeError, '请输入验证码');
            valid = false;
        }
        if (!valid) return;

        btnBind.disabled = true;
        btnBind.textContent = '绑定中...';

        fetch('/accounts/' + accountId + '/phone', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                phone: phoneInput.value.trim(),
                code: codeInput.value.trim()
            })
        })
        .then(function (resp) {
            if (resp.ok || resp.status === 204) {
                document.getElementById('form-content').classList.add('hidden');
                document.getElementById('success-panel').classList.add('active');
            } else {
                return resp.json().then(function (data) {
                    throw new Error(data.message || '绑定失败');
                });
            }
        })
        .catch(function (err) {
            showGlobalError(err.message || '绑定失败，请稍后重试');
            btnBind.disabled = false;
            btnBind.textContent = '绑定手机号';
        });
    });
}());
</script>
</body>
</html>
