spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:D:/matchmaking-sites/eagle
    hikari:
      # 连接池配置
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true
  jpa:
    database: h2
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update