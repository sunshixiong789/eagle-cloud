# ===========================================
# 本地开发环境配置
# 使用 H2 文件数据库 + Caffeine 本地缓存
# 适用于：本地开发、调试
# ===========================================

spring:
  # Flyway 数据库迁移
  flyway:
    enabled: true
    baseline-on-migrate: true  # 兼容已有数据库，首次运行自动 baseline
  # 数据源配置 - H2 数据库
  datasource:
    driver-class-name: org.h2.Driver  # H2 数据库驱动
    url: jdbc:h2:file:${H2_DB_PATH:./db/eagle}  # H2 文件数据库路径，支持环境变量覆盖
    username: ${H2_DB_USERNAME:root}  # 数据库用户名
    password: ${H2_DB_PASSWORD:123456}  # 数据库密码
    hikari:
      # HikariCP 连接池配置
      connection-timeout: 30000  # 连接超时时间（毫秒）
      maximum-pool-size: 20  # 最大连接数
      minimum-idle: 5  # 最小空闲连接数
      idle-timeout: 300000  # 空闲连接超时时间（毫秒），5 分钟
      max-lifetime: 1200000  # 连接最大存活时间（毫秒），20 分钟
      auto-commit: true  # 自动提交
  # JPA 配置
  jpa:
    database: h2  # 数据库类型
    database-platform: org.hibernate.dialect.H2Dialect  # H2 方言
    show-sql: true  # 显示 SQL 语句，便于调试
    hibernate:
      ddl-auto: update  # 自动更新数据库结构（开发环境适用）
    # 自动配置排除（本地无 Redis/Nacos，排除避免启动报错）
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  cloud:
    nacos:
      discovery:
        enabled: false
  # 缓存配置 - Caffeine 本地缓存
  cache:
    type: caffeine  # 使用 Caffeine 缓存
    caffeine:
      spec: "maximumSize=2000,expireAfterWrite=600s"  # 最大 2000 条，写入后 10 分钟过期
# Actuator 健康检查配置
management:
  health:
    redis:
      enabled: false  # 禁用 Redis 健康检查（本地环境无 Redis）
# ===========================================
# 第三方服务配置（本地开发可选）
# 以下配置可通过环境变量覆盖，本地开发时可为空
# ===========================================
eagle:
  admin:
    password: ${EAGLE_ADMIN_PASSWORD:localDev@2026}  # 本地开发默认密码
  # 微信小程序配置（可选）
  wechat:
    mini-program:
      app-id: ${WECHAT_MINI_APP_ID:}  # 微信小程序 AppID
      app-secret: ${WECHAT_MINI_APP_SECRET:}  # 微信小程序 AppSecret
  # 阿里云短信配置（可选）
  sms:
    aliyun:
      access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}  # 阿里云 AccessKey ID
      access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}  # 阿里云 AccessKey Secret
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}  # 短信签名
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}  # 验证码模板代码