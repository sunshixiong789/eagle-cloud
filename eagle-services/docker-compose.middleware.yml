# -------- 自托管中间件：Redis + Consul + RabbitMQ（正式环境，独立 16G 机器）----------
#
# 用途：在 prod 独立中间件机器（约 16G 内存）上，用 docker 跑 Redis + Consul + RabbitMQ，
#       仅 PostgreSQL 走托管（资金类数据本体优先用 RDS：PITR + 多副本 + 自动备份）。
#       应用层（docker-compose.prod.yml）在另外的机器，通过本机内网地址连这些中间件。
#
# ── 资源规划（独占 16G，预留约 2g 给 OS / pagecache）──
#   consul     limit 512m  （单节点 dev-friendly server，无需大堆）
#   rabbitmq   limit 1g    （Erlang VM，无需单独设 JVM 堆）
#   redis      limit 3g    / maxmemory 2g
#   合计 ≈ 4.5g（比 Nacos+RocketMQ+Sentinel 集群省下 10g+，可视负载上调 redis/rabbitmq limit）
#   ⚠️ 改内存时务必「mem_limit 和 JVM 堆 / maxmemory 一起改」，只改一个没用。
#
# ── 跨机连接（应用在别的机器）──
#   端口已绑 0.0.0.0 对外暴露，应用机的 .env.prod.prod 里把 host 填本机内网 IP：
#     REDIS_HOST=<中间件机内网IP>
#     CONSUL_HOST=<中间件机内网IP>
#     RABBITMQ_HOST=<中间件机内网IP>
#   ⚠️ 这些端口绝不能暴露公网，务必用安全组 / 防火墙只放行应用机内网 IP。
#
# ── 启动 ──
#   docker compose -f docker-compose.middleware.yml --env-file .env.prod.prod up -d
#
# ⚠️ 持久化：
#   - Consul 单节点无 Raft 多数派保护，卷丢=服务目录全丢；生产建议 ≥3 节点集群或定期快照。
#   - RabbitMQ 数据在本地卷，磁盘坏=消息丢；定期备份卷 + 消费端幂等（项目规则已要求）。

networks:
  eagle-network:
    name: eagle-network
    driver: bridge

volumes:
  redis-data:
  consul-data:
  rabbitmq-data:

services:
  # ─────────────────────────────── Redis ───────────────────────────────
  redis:
    image: redis:8.6.1
    container_name: eagle-redis
    restart: always
    ports:
      # 跨机：应用机走 <本机内网IP>:6379。务必防火墙只放行应用机
      - "6379:6379"
    networks:
      - eagle-network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123456}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - redis-data:/data
    # maxmemory 2g + LRU；mem_limit 留出 AOF rewrite / fork COW 头部空间
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123456} --maxmemory ${REDIS_MAXMEMORY:-2gb} --maxmemory-policy allkeys-lru
    mem_limit: 3072m
    mem_reservation: 1024m
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123456}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────── Consul ───────────────────────────────
  consul:
    image: hashicorp/consul:1.20
    container_name: eagle-consul
    restart: always
    ports:
      - "8500:8500"       # HTTP API + Web UI
      - "8600:8600/udp"   # DNS
    networks:
      - eagle-network
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # ACL 开启。本文件头部已写明「这些端口绝不能暴露公网」，但 8500 实际可从公网访问
      # （139.155.104.132:8500），不开 ACL 等于把服务目录和 KV（含全部生产凭据）
      # 匿名开放读写。default_policy=deny 后：
      #   · 6 个服务必须带 token（spring.cloud.consul.{discovery,config}.acl-token）
      #   · Web UI 也要在右上角 "Log in" 填 token 才看得到数据
      #   · consul agent 自身也需要 agent token（bootstrap 后由脚本 PUT /v1/agent/token/agent 设置）
      # down_policy=extend-cache：与 server 失联时沿用缓存的 ACL 结果，避免抖动导致全量 deny。
      # enable_token_persistence：agent token 落盘到 /consul/data，重启不丢。
      # 首次启用后需 bootstrap 生成 token，详见 docs/consul-config.md。
      # ⚠️ ACL 与网络收口是两件事，都要做：仍应在安全组把 8500/8600 限制为仅应用机内网可达。
      - 'CONSUL_LOCAL_CONFIG={"acl":{"enabled":true,"default_policy":"deny","down_policy":"extend-cache","enable_token_persistence":true}}'
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -data-dir=/consul/data
    mem_limit: 512m
    mem_reservation: 256m
    volumes:
      - consul-data:/consul/data
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8500/v1/status/leader" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ──────────────────────────────── RabbitMQ ────────────────────────────────
  # management 插件自带可视化控制台（15672），单容器承载 broker + 管理界面。
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: eagle-rabbitmq
    restart: always
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management 控制台
    networks:
      - eagle-network
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 1024m
    mem_reservation: 512m
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
