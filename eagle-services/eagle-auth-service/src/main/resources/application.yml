# ===========================================
# Eagle Auth Service · 基线配置（Servlet + JPA + PostgreSQL）
# 设计原则：
#   - application.yml 承载完整配置；profile 文件仅声明"开发/线上不一样"的差异
#   - 环境变量仅暴露外部接入字段：数据源/Redis/Consul 连接信息、凭证、白名单
#   - 默认值取"生产安全"基线（validate / show-sql=false / details=never / WARN 日志）
# ===========================================

server:
  port: ${SERVER_PORT:9090}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie

spring:
  application:
    name: auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # 配置中心：启动期从 Consul KV 拉取本环境配置。KV 里的键沿用环境变量名（DB_HOST 等），
  # 于是本文件所有 ${VAR:default} 占位符可直接被 KV 的值填上，yml 结构与默认值一行都不用改。
  # optional: 前缀 —— Consul 不可达时跳过该 location 而非启动失败，此时回落到各占位符默认值。
  # 地址取下方 spring.cloud.consul.host/port，此处不重复写。
  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      # 配置中心（KV）。format=YAML 时每个 context 只读 `data` 这一个键，值是整份 YAML 文档：
      #   config/application/data            六服务共享 · 跨环境
      #   config/application,<profile>/data  六服务共享 · 按环境
      #   config/<app>/data                  单服务   · 跨环境
      #   config/<app>,<profile>/data        单服务   · 按环境（优先级最高）
      # <app> 即 spring.application.name —— 本服务是 auth。注意 gateway 的 app 名是
      # gateway-server（不是 gateway），KV 路径按 app 名而非 compose 服务名。
      # 共享层只放 6 服务通用的 Redis / RabbitMQ 连接；DB、OAuth、SMS 等按服务下沉，
      # 避免 ease-mind 侧三服务读到本仓库的库凭据。键位清单见 docs/consul-config.md。
      # ⚠️ 真实环境变量优先级高于 Consul —— compose 里仍注入的同名变量会盖掉 KV 值。
      #    （.env 文件已于 2026-08-07 删除，现在只剩 compose 这一个覆盖来源。）
      config:
        enabled: ${CONSUL_CONFIG_ENABLED:true}
        format: YAML
        prefix: config
        default-context: application
        profile-separator: ','
        data-key: data
        # ACL token。Spring Cloud Consul 5.x 把 token 拆成 discovery / config 两处独立配置
        # （4.x 的 spring.cloud.consul.token 在 5.x 的 ConsulProperties 里已不存在，
        #  写了不报错但完全不生效），两处都要给，否则 ACL 开启后一侧 403。
        acl-token: ${CONSUL_TOKEN:}
        # 热更新关闭：配置只在启动期读一次，改完 KV 需重启服务才生效（与 ease-mind 侧口径一致）。
        # 本仓库未显式关 spring.cloud.refresh（ease-mind 侧关了），但本项为 false 时
        # ConfigWatch 根本不注册，不会有 RefreshEvent 发出。日后要热更新：本项改 true，
        # 并给需要热更的 bean 挂 @RefreshScope。
        watch:
          enabled: false
      discovery:
        acl-token: ${CONSUL_TOKEN:}
        enabled: ${CONSUL_DISCOVERY_ENABLED:true}
        register: true
        # 用 IP 注册而非 hostname：容器内 hostname 是容器 ID，跨主机不可达。
        prefer-ip-address: true
        # 未注入 CONSUL_INSTANCE_IP 时回落到 InetUtils 探测出的本机/容器 IP。
        # ⚠️ 回落仅在该变量「未定义」时生效 —— Spring 的 ${VAR:default} 对空串不回落，
        #    空串会原样绑定。而 prefer-ip-address=true 时 getHostname() 直接返回 ipAddress，
        #    空串会让注册 Address 和健康检查 URL 双双缺 host（http://:9090/actuator/health），
        #    Consul 判 critical，再按 health-check-critical-timeout 注销实例 ——
        #    现象是服务压根没注册上。compose 无法条件性省略 environment 键，
        #    故由 Dockerfile entrypoint 把空串 unset 掉，让这里的回落真正生效。
        ip-address: ${CONSUL_INSTANCE_IP:${spring.cloud.client.ip-address}}
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}-${random.value}
        health-check-path: /actuator/health
        health-check-interval: 10s
        health-check-critical-timeout: 30s
        # 实例 metadata：网关 GatewayOpenApiConfig 按 spring-doc 聚合 OpenAPI，对应 /v3/api-docs/auth。
        # 必须放 metadata 不能放 tags —— Spring Cloud Consul 5.x 的 ConsulServiceInstance.getMetadata()
        # 只读 Consul 原生 Meta 字段，不再像 4.x 那样把 "k=v" 形式的 tag 折算进 metadata，
        # 写成 tags 的话网关侧 instance.getMetadata() 永远取不到 spring-doc，聚合恒为空。
        metadata:
          spring-doc: auth
          spring-doc-name: Auth Service
        # tags 仅供 Consul UI / DNS 侧筛选，不参与网关聚合
        tags:
          - spring-doc=auth

  # ---- 数据源：PostgreSQL（环境变量驱动连接信息）----
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eagle_auth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: EagleAuthHikariPool
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true
      connection-test-query: SELECT 1

  # ---- Spring Authorization Server 原生 schema（裸 JDBC，不走 JPA）----
  # JdbcOAuth2AuthorizationService / JdbcOAuth2AuthorizationConsentService 用裸 JdbcTemplate，
  # 不是 JPA 实体，因此 ddl-auto=update 不会建对应的 oauth2_authorization /
  # oauth2_authorization_consent 表。这里通过 spring.sql.init 在启动时按需创建（IF NOT EXISTS 幂等）。
  sql:
    init:
      mode: always
      schema-locations: classpath:db/oauth2-schema-postgresql.sql
      continue-on-error: false

  # ---- JPA：Flyway 引入前由 Hibernate 自动同步 schema（update）；上线前切回 validate ----
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 100
          fetch_size: 100
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 16

  # ---- 缓存：默认 Redis ----
  cache:
    type: redis
    redis:
      time-to-live: 30m
      key-prefix: "eagle:auth:"
      cache-null-values: true
      use-key-prefix: true
    caffeine:
      spec: "maximumSize=2000,expireAfterWrite=600s"

  # ---- Redis 连接 ----
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 3000ms
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:64}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: ${REDIS_POOL_MAX_WAIT:2000ms}
        shutdown-timeout: 1000ms

  # ---- RabbitMQ 连接（取代 RocketMQ 的 endpoints）----
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true

# ===========================================
# Eagle 业务配置（仅 auth 域相关）
# ===========================================
eagle:
  # ----- 初始管理员 -----
  # AdminInitializer 启动时创建 admin Account(已存在则幂等跳过),并通过
  # AccountRegisteredEvent → RocketMQ eagle_auth_events → system-service 同步出 admin User。
  # 与 system-service 端 eagle.admin.username 走同一 EAGLE_ADMIN_USERNAME 环境变量,
  # 确保两侧"哪个 username 是管理员"的判定一致。
  # 【安全】password 故意无默认值,缺失即 fail-fast;生产必须通过环境变量注入强密码。
  admin:
    username: ${EAGLE_ADMIN_USERNAME:admin}
    password: ${EAGLE_ADMIN_PASSWORD}
    name: ${EAGLE_ADMIN_NAME:系统管理员}
    email: ${EAGLE_ADMIN_EMAIL:admin@eagle.com}
    phone: ${EAGLE_ADMIN_PHONE:}
  # ----- Resource Server -----
  # K8s liveness/readiness 探针:/actuator/health/liveness、/actuator/health/readiness
  # starter DEFAULT_PERMIT_PATHS 仅放行 /actuator/health,需追加 /** 覆盖子路径
  resource-server:
    permit-paths:
      - /actuator/health/**
  # ----- 审计日志(eagle-audit-log-starter) -----
  # 启用 GET /audit-logs 查询接口(admin 角色),写入路径在 @AuditLog 注解的业务方法
  audit-log:
    controller-enabled: true
    permit-role: admin
  jwt:
    keystore-location: classpath:jwt-keystore.p12
    keystore-password: ${EAGLE_JWT_KEYSTORE_PASSWORD}
    key-alias: eagle-jwt
  # ----- 表单登录"记住我"(hash-token) -----
  # 【安全】key 故意无默认值,缺失即 fail-fast;集群所有实例必须配置完全相同的强密钥,
  # 否则各实例 / 重启之间签发的 remember-me Cookie 互相无法校验,"记住我"静默失效。
  remember-me:
    key: ${EAGLE_REMEMBER_ME_KEY}
    validity: 14d
  amqp:
    consumer-group: auth_consumer
    exchange-prefix: ${RABBITMQ_EXCHANGE_PREFIX:dev_}
  websocket:
    endpoint: /ws-stomp
    app-prefix: /message
    topic-prefix: /topic
    user-prefix: /user
  oauth:
    issuer: ${EAGLE_OAUTH_ISSUER}
    default-client:
      enabled: true
      client-id: eagleWeb
      client-name: Eagle Web 前端应用
      client-authentication-methods: none
      authorization-grant-types: authorization_code,refresh_token,wechat_mini_program,sms_code
      redirect-uris: ${EAGLE_OAUTH_REDIRECT_URIS:http://localhost:8080/auth/oauth2/callback}
      # OIDC RP-Initiated Logout 回跳 URI 白名单（/connect/logout?post_logout_redirect_uri= 必须命中）
      post-logout-redirect-uris: ${EAGLE_OAUTH_POST_LOGOUT_REDIRECT_URIS:http://localhost:8000/auth/oauth2/logout/callback}
      scopes: openid,profile,email,address,phone
      require-proof-key: true
      require-authorization-consent: false
      access-token-ttl-seconds: 3600
      refresh-token-ttl-seconds: 2592000
    app-client:
      enabled: true
      client-id: eagleApp
      client-name: Eagle App 移动端
      client-authentication-methods: none
      # phone_one_click 已下线：一键登录没接真实 provider，只剩 mock（token 即手机号）。
      # 本客户端是 client-authentication-methods=none 的 public client，放行它等于任意手机号可换 token。
      # 接入真实 provider 后，连同 eagle.auth.one-click.enabled 与 MockPhoneOneClickProvider 的 @Profile 一起放开。
      authorization-grant-types: refresh_token,sms_code,wechat_app,wechat_mini_program,taobao_app,apple_app,social_bind
      redirect-uris: ""
      scopes: openid,profile,email,address,phone
      require-proof-key: false
      require-authorization-consent: false
      access-token-ttl-seconds: 3600
      refresh-token-ttl-seconds: 2592000
    # 运营端机密客户端（client_credentials）：内部运营系统调用购物金对外接口用。
    # 默认关闭——secret 未注入时不建号，避免出现无凭据的机密客户端。
    # 开启需同时提供 EAGLE_OAUTH_OPS_CLIENT_ENABLED=true 与 EAGLE_OAUTH_OPS_CLIENT_SECRET。
    ops-client:
      enabled: ${EAGLE_OAUTH_OPS_CLIENT_ENABLED:false}
      client-id: shengxinOps
      client-name: 省心运营系统
      client-secret: ${EAGLE_OAUTH_OPS_CLIENT_SECRET:}
      client-authentication-methods: client_secret_basic
      authorization-grant-types: client_credentials
      scopes: shopping-gold.grant,shopping-gold.revoke
      access-token-ttl-seconds: 1800
  wechat:
    app:
      app-id: ${WECHAT_APP_APP_ID:}
      app-secret: ${WECHAT_APP_APP_SECRET:}
    mini-program:
      app-id: ${WECHAT_MINI_APP_ID:}
      app-secret: ${WECHAT_MINI_APP_SECRET:}
    web:
      pc:
        app-id: ${WECHAT_WEB_APP_ID:}
        app-secret: ${WECHAT_WEB_APP_SECRET:}
        redirect-uri: ${WECHAT_WEB_REDIRECT_URI:http://localhost/login/wechat/pc/callback}
      h5:
        app-id: ${WECHAT_MP_APP_ID:}
        app-secret: ${WECHAT_MP_APP_SECRET:}
        redirect-uri: ${WECHAT_MP_REDIRECT_URI:http://localhost/login/wechat/h5/callback}
  taobao:
    app:
      enabled: ${TAOBAO_APP_ENABLED:false}
      app-key: ${TAOBAO_APP_KEY:}
      app-secret: ${TAOBAO_APP_SECRET:}
      sign-method: ${TAOBAO_APP_SIGN_METHOD:md5}
  apple-authentication:
    enabled: ${APPLE_AUTH_ENABLED:false}
    issuer: https://appleid.apple.com
    jwk-set-uri: https://appleid.apple.com/auth/keys
    token-uri: https://appleid.apple.com/auth/token
    revoke-uri: https://appleid.apple.com/auth/revoke
    client-id: ${APPLE_CLIENT_ID:com.shengxinfast.app}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
    connect-timeout: 5s
    read-timeout: 10s
  auth:
    # 审核白名单固定验证码（App Store 提审用）：白名单手机号不发真实短信，直接用固定验证码登录；
    # phones 为空（默认）时功能关闭，其余手机号不受影响
    sms-mock:
      code: ${SMS_MOCK_CODE:123456}
      phones: ${SMS_MOCK_PHONES:}
  message:
    # 短信网关（SmsProperties）：provider=hnsls 且 username/password/sign-name 三者齐全时
    # 才真实下发，否则验证码只打印到日志（开发态兜底）。启动日志会明确告知当前处于哪种模式。
    # 阿里云/腾讯云 provider 尚未实现，配 provider=aliyun 只会回落到日志兜底。
    sms:
      provider: ${SMS_PROVIDER:hnsls}
      sign-name: ${SMS_SIGN_NAME:}
      username: ${HNSLS_SMS_USERNAME:}
      password: ${HNSLS_SMS_PASSWORD:}
      content-template: ${HNSLS_SMS_CONTENT_TEMPLATE:您的验证码是{code}，5分钟内有效。}
      send-url: ${HNSLS_SMS_SEND_URL:https://xapi.hnsls.com.cn/eums/sms/utf8/send.do}
      charset: ${HNSLS_SMS_CHARSET:UTF-8}
      connect-timeout-ms: ${HNSLS_SMS_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${HNSLS_SMS_READ_TIMEOUT_MS:10000}

# ===========================================
# Actuator
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
    metrics:
      enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  info:
    env:
      enabled: false

# ===========================================
# Springdoc / Swagger
# ===========================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  show-oauth2-endpoints: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    oauth:
      app-name: Eagle Auth
      client-id: eagleWeb
      use-pkce-with-authorization-code-grant: true
      scopes:
        - "openid"
        - "profile"
    csrf:
      enabled: true
    doc-expansion: none
    persist-authorization: true

# ===========================================
# 日志
# ===========================================
logging:
  level:
    root: INFO
    com.eagle: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    # 排查 /oauth2/token 400：SAS 框架过滤器把 OAuth2 错误直接写成 JSON 响应，
    # 默认不在 INFO/ERROR 打日志，调到 DEBUG/TRACE 才能看到是哪个 converter / client-auth 抛的 OAuth2Error。
    # prod 已在 application-prod.yml 覆盖 org.springframework.security=WARN，此处不影响生产。
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.server.authorization: TRACE
