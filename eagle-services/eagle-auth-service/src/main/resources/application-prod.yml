# ===========================================
# 生产差异(auth-service)
# 与基线相比的强制锁定:
#   - JPA ddl-auto=validate, 禁止生产运行时自动改表
#   - HikariCP 快速失败 5s + 60s 泄漏检测
#   - Swagger / api-docs 强制关闭
#   - Actuator 仅暴露 health/info/prometheus
#   - 日志 root=WARN, com.eagle=INFO
#
# 【schema 策略】当前阶段:
#   - JdbcOAuth2AuthorizationService 所需 oauth2_* 表仍由 spring.sql.init 的
#     IF NOT EXISTS 脚本幂等创建。
#   - JPA 管理的业务表生产只 validate;后续统一由 Flyway 接管全部 DDL。
# ===========================================

spring:
  jpa:
    hibernate:
      ddl-auto: update

  datasource:
    hikari:
      connection-timeout: 5000
      leak-detection-threshold: 60000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  show-oauth2-endpoints: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    root: WARN
    com.eagle: INFO
    org.springframework: WARN
    org.springframework.security: WARN
