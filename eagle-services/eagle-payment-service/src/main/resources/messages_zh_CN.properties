# ========== Payment 支付域错误码 ==========
error.payment.not_found                 = 支付订单不存在
error.payment.duplicate                 = 业务订单号已存在,请勿重复下单
error.payment.invalid_amount            = 支付金额不合法
error.payment.invalid_status            = 支付订单状态不允许此操作
error.payment.expired                   = 支付订单已过期
error.payment.cancelled                 = 支付订单已取消
error.payment.channel_unavailable       = 支付渠道暂不可用
error.payment.gateway_error             = 支付渠道异常
error.payment.signature_invalid         = 回调签名校验失败
error.payment.notify_unknown_payment    = 回调对应的支付订单不存在
# ========== Refund 退款域错误码 ==========
error.refund.not_found                  = 退款单不存在
error.refund.duplicate                  = 业务退款号已存在,请勿重复发起
error.refund.invalid_amount             = 退款金额不合法
error.refund.exceed_refundable          = 退款金额超过可退余额
error.refund.payment_not_paid           = 支付未完成,无法退款
error.refund.partial_disabled           = 当前未开启部分退款
error.refund.gateway_error              = 退款渠道异常
error.refund.invalid_status             = 退款单状态不允许此操作
# ========== Transfer 提现域错误码 ==========
error.transfer.not_found                = 提现单不存在
error.transfer.duplicate                = 业务提现号已存在
error.transfer.disabled                 = 提现功能未开启
error.transfer.invalid_amount           = 提现金额不合法
error.transfer.exceed_single_limit      = 单笔提现超过限额
error.transfer.exceed_daily_amount      = 当日累计提现超过限额
error.transfer.exceed_daily_count       = 当日提现次数超过上限
error.transfer.gateway_error            = 提现渠道异常
error.transfer.invalid_status           = 提现单状态不允许此操作
error.transfer.channel_unavailable      = 提现渠道暂不可用
error.transfer.mode_required            = 受理模式不能为空
error.transfer.approval_not_allowed     = 当前状态不允许审核操作
error.transfer.reject_reason_required   = 拒绝原因不能为空
error.transfer.not_approval_mode        = 立即到账模式不支持审核操作
# ========== Reconcile 对账域错误码 ==========
error.reconcile.fetch_failed            = 渠道清算单拉取失败
error.reconcile.parse_failed            = 渠道清算单解析失败
