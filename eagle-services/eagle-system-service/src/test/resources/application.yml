spring:
  # 不再激活 local profile（已删除）。剩余 @SpringBootTest 默认 @Disabled，
  # 其它 Mockito 单测不依赖此文件，但保留下方防御性配置作为未来集成测试的兜底。
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

  # 测试期彻底排除会拉起外部资源的自动配置：Flyway / Redisson。
  # 双重防御 = enabled:false（属性开关）+ autoconfigure.exclude（自动配置剔除）。
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
  autoconfigure:
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV4