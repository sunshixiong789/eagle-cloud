# ===========================================
# 本地开发差异(system-service)
# 与基线相比的覆盖:
#   - 关闭 Consul 服务发现与配置中心(本地不起 Consul)
#   - ddl-auto=update:基线是生产安全的 validate,本地首次启动需由 Hibernate 建表
#   - 数据源 / Redis 凭据默认值对齐本地 compose,开箱即跑
#   - Actuator 暴露调试端点 + details=always
#   - 日志 com.eagle=DEBUG,SQL=DEBUG,参数绑定=TRACE
#
# 【本地依赖】
#   docker compose -f docker-compose.pg.yml up -d          # PostgreSQL(eagle_system)
#   docker compose -f docker-compose.middleware.yml up -d  # Redis / RabbitMQ / Consul
# 只跑 system 时 middleware 里的 Consul 可以不启 —— 本 profile 已关掉对它的依赖。
#
# 【安全】本文件的默认凭据仅供本地,全部沿用仓库既有 compose 的默认值,不新增机密;
# dev/prod 都不读本文件,那两个环境的凭据一律走 Consul KV。
#
# 文件存储沿用基线的 eagle.oss.type=local(本地文件系统),无需起 MinIO。
# ===========================================

spring:
  cloud:
    consul:
      # 本地不起 Consul:config 关掉后基线的 spring.config.import=optional:consul: 直接跳过;
      # discovery 关掉后不再反复重试注册(否则启动日志被连接失败刷屏)。
      config:
        enabled: false
      discovery:
        enabled: false

  # 仅覆盖凭据 —— host/port/库名的基线默认值(localhost:5432/eagle_system)本地已适用。
  # 默认值对齐 docker-compose.pg.yml 的 POSTGRES_USER / POSTGRES_PASSWORD。
  datasource:
    username: ${DB_USERNAME:eagle}
    password: "${DB_PASSWORD:W2kL9@mZ5&nR4*bJ6^y}"

  # 默认值对齐 docker-compose.middleware.yml 的 --requirepass
  data:
    redis:
      password: ${REDIS_PASSWORD:redis123456}

  # 基线是 validate(生产安全默认),本地空库起不来,交给 Hibernate 建表 —— 与 dev 一致
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,mappings,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

logging:
  level:
    com.eagle: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
