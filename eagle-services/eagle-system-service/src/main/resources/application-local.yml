# ===========================================
# 本地开发差异（system-service）
# 与基线相比的覆盖：
#   - 数据源切换为 H2（覆盖默认 MySQL）
#   - 缓存切换为 Caffeine（覆盖默认 Redis）
#   - 关闭 Nacos / Redis 健康检查 / Redisson 自动配置
#   - ddl-auto=update + show-sql 便于联调
#   - Actuator 暴露调试端点 + details=always
#   - 日志 com.eagle=DEBUG，SQL=DEBUG，参数绑定=TRACE
# ===========================================

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${H2_DB_PATH:./db/eagle}
    username: ${H2_DB_USERNAME:root}
    password: ${H2_DB_PASSWORD:123456}

  jpa:
    database: h2
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  cloud:
    nacos:
      discovery:
        enabled: false

  cache:
    type: caffeine

  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,mappings,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    redis:
      enabled: false
  info:
    env:
      enabled: true

eagle:
  admin:
    password: ${EAGLE_ADMIN_PASSWORD:localDev@2026}
  security:
    # 开发环境关闭登录频率限制，避免反复联调时被自封 30 分钟
    login-rate-limit:
      enabled: false

logging:
  level:
    com.eagle: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
