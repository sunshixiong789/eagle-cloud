# ===========================================
# 开发/测试差异配置（system-service）
# 与基线相比的开发便利覆盖：
#   - SQL 打印开启（便于排查）
#   - Actuator 暴露更多端点 + 返回 health 详情
#   - com.eagle 日志降到 DEBUG，参数绑定打到 TRACE
# 其余配置（数据源、Redis、JPA 主体）使用基线 + 环境变量。
# ===========================================

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Actuator：dev 暴露常用端点 + 返回 health 详情
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,mappings,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

# dev 日志级别
logging:
  level:
    com.eagle: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
