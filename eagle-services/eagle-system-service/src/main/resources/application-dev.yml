# ===========================================
# 开发/测试差异（system-service）
# 与基线相比的覆盖：
#   - Flyway 启用 + baseline-on-migrate=true（兼容已有库）
#   - ddl-auto=update + show-sql 便于排查
#   - Actuator 暴露调试端点 + details=always
#   - 日志 com.eagle=DEBUG，SQL=DEBUG，参数绑定=TRACE
# 数据源 / Redis 连接信息使用基线 + 环境变量注入。
# ===========================================

eagle:
  jwt:
    # dev 环境默认值；与项目内置 classpath:jwt-keystore.p12 的密码对齐，
    # 仅用于 dev profile；test/staging/prod 必须通过环境变量 EAGLE_JWT_KEYSTORE_PASSWORD 注入
    keystore-password: ${EAGLE_JWT_KEYSTORE_PASSWORD:eagle-jwt-dev-2026}
  # 本地无 RocketMQ broker 时关闭 Consumer 注册；接入联调环境改为 true 即可
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:false}
    topic-env-prefix: dev_

spring:
  # dev 环境默认沿用 Nacos 内置 public 命名空间。
  # 注意：Spring Boot 4 占位符行为变化——${VAR:default} 在 VAR 已定义但为空时也会用 default，
  # 因此默认值必须是 Nacos 已存在的 namespace ID。若改为不存在的 ID（如 dev），Nacos 3 对注册
  # 路径会 fallback 到 public、查询路径不 fallback，导致 gateway/system 错位看不到彼此。
  cloud:
    nacos:
      discovery:
        namespace: ${NACOS_NAMESPACE:public}

  # 开发环境彻底排除 Flyway：暂时仅用 JPA ddl-auto=update。
  # 双重防御 = enabled:false（属性开关）+ autoconfigure.exclude（自动配置剔除），
  # 防止任何环境变量 / IDE / 残留构建强行装配 FlywayAutoConfiguration。
  flyway:
    enabled: false
    baseline-on-migrate: false
  autoconfigure:
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,mappings,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

logging:
  level:
    com.eagle: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.eagle.system.auth: DEBUG