# ===========================================
# 开发/测试差异(system-service)
# 与基线相比的覆盖:
#   - ddl-auto=update,由 Hibernate 自动同步 schema(无 Flyway 期间)
#   - Actuator 暴露调试端点 + details=always
#   - 日志 com.eagle=DEBUG,SQL=DEBUG,参数绑定=TRACE
# 数据源 / Redis 连接信息使用基线 + 环境变量注入。
# ===========================================

eagle:
  amqp:
    exchange-prefix: dev_

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,mappings,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

logging:
  level:
    com.eagle: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE