# ===========================================
# 生产差异（system-service）
# 与基线相比的强制锁定：
#   - HikariCP 快速失败 5s + 60s 泄漏检测
#   - Swagger 强制关闭（防止 schema 泄漏）
#   - 日志 root=WARN，com.eagle=INFO
#
# 【schema 策略】严格遵循 28-migration.md：
#   - ddl-auto=validate：启动期校验实体与表结构匹配，禁止运行时自动改表
#   - 所有业务实体表必须由 Flyway 脚本预先建立（V{yyyyMMddHHmm}__*.sql）
#
# 【Flyway 覆盖范围】
#   - V1__oauth2_authorization_tables.sql：SAS JDBC 持久化表（authorization / consent）
#   - V202605161500__init_business_tables.sql：业务实体 baseline（auth_account / oauth2_client / sys_*）
#   后续业务表变更通过新增 V{yyyyMMddHHmm}__*.sql 文件；如需重新生成 baseline，
#   开启 SchemaExportTest 上的 @Disabled 跑一次即可（详见该测试类 Javadoc）。
# ===========================================

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate                        # 生产严格 validate；运行时禁止改表，所有 DDL 通过 Flyway 管控

  datasource:
    hikari:
      connection-timeout: 5000
      leak-detection-threshold: 60000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.eagle: INFO
    org.springframework: WARN
    org.springframework.security: WARN
