# ===========================================
# 生产差异（system-service）
# 与基线相比的强制锁定：
#   - HikariCP 快速失败 5s + 60s 泄漏检测
#   - Swagger 强制关闭（防止 schema 泄漏）
#   - 日志 root=WARN，com.eagle=INFO
#
# 【新项目阶段】schema 策略：
#   - ddl-auto=update：Hibernate 自动同步业务实体表（非 JPA 的 OAuth2 表由 Flyway 建）
#   - Flyway 启用 + baseline-on-migrate=true：兼容 Hibernate 已建表的库
#   - 等业务稳定后再切回基线 ddl-auto=validate + 完整 Flyway 管理
# ===========================================

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: update                          # 新项目阶段自动建表；稳定后改回 validate

  datasource:
    hikari:
      connection-timeout: 5000
      leak-detection-threshold: 60000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.eagle: INFO
    org.springframework: WARN
    org.springframework.security: WARN
