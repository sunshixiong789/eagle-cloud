# ===========================================
# 生产差异(system-service)
# 与基线相比的强制锁定:
#   - HikariCP 快速失败 5s + 60s 泄漏检测
#   - Swagger 强制关闭(防止 schema 泄漏)
#   - 日志 root=WARN,com.eagle=INFO
#
# 【schema 策略】当前阶段:
#   - ddl-auto=validate:启动期校验实体与表结构匹配,禁止运行时自动改表
#   - Flyway 尚未引入,生产部署前需先由运维手动跑 DDL 建表
#     (可借 SchemaExportTest 生成 schema-postgres.sql 后审核应用)
#   - 后续统一引入 Flyway 后,迁移脚本接管全部 DDL 变更
# ===========================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate                        # 生产严格 validate;运行时禁止改表

  datasource:
    hikari:
      connection-timeout: 5000
      leak-detection-threshold: 60000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.eagle: INFO
    org.springframework: WARN
    org.springframework.security: WARN
