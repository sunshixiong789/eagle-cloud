# ===========================================
# Eagle System Server · 基线配置（所有环境共用）
# 设计原则：
#   - 公共配置全部在此，通过 ${VAR:default} 占位符让环境变量按需覆盖
#   - 默认值取"生产安全"基线（validate / show-sql=false / details=never / WARN 日志）
#   - 各 profile（local / dev / prod）只声明与基线"不一样"的部分
# ===========================================

server:
  port: ${SERVER_PORT:80}                    # 容器/物理机均默认 80；如需改用 SERVER_PORT 注入
  shutdown: graceful

spring:
  application:
    name: eagle-system-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}  # 不指定则按本地开发处理
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

  # ---- Flyway（生产部署应该启用：FLYWAY_ENABLED=true）----
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: true
    out-of-order: false

  # ---- 数据源（默认 MySQL；local profile 覆盖为 H2）----
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eagle}?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: EagleHikariPool
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true
      connection-test-query: SELECT 1
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION:0}

  # ---- JPA / Hibernate ----
  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false                       # 生产/开发都关闭视图层延迟加载
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        jdbc:
          batch_size: 100
          fetch_size: 100
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 16

  # ---- 缓存（默认 Redis；local profile 覆盖为 Caffeine）----
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 30m
      key-prefix: "eagle:"
      cache-null-values: true
      use-key-prefix: true
    caffeine:
      spec: "maximumSize=2000,expireAfterWrite=600s"

  # ---- Redis 连接（type=redis 时生效）----
  data:
    redis:
      url: redis://${REDIS_PASSWORD:}@${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}/${REDIS_DATABASE:0}
      connect-timeout: 3000ms
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:16}
          max-idle: ${REDIS_POOL_IDLE_MAX:8}
          min-idle: ${REDIS_POOL_IDLE_MIN:2}
          max-wait: 2000ms
        shutdown-timeout: 1000ms

# ===========================================
# Eagle 自定义配置
# ===========================================
eagle:
  jwt:
    keystore-location: ${EAGLE_JWT_KEYSTORE_LOCATION:classpath:jwt-keystore.p12}
    keystore-password: ${EAGLE_JWT_KEYSTORE_PASSWORD:eagle-jwt-dev-2026}
    key-alias: eagle-jwt
  websocket:
    endpoint: /ws-stomp
    app-prefix: /message
    topic-prefix: /topic
    user-prefix: /user
  admin:
    username: ${EAGLE_ADMIN_USERNAME:admin}
    password: ${EAGLE_ADMIN_PASSWORD}        # 必填，缺失即 fail-fast
    name: ${EAGLE_ADMIN_NAME:系统管理员}
    email: ${EAGLE_ADMIN_EMAIL:admin@eagle.com}
  oauth:
    default-client:
      enabled: true
      client-id: eagleWeb
      client-name: Eagle Web 前端应用
      client-authentication-methods: none
      authorization-grant-types: authorization_code,refresh_token,wechat_mini_program,sms_code
      # OAuth2 / Swagger 回调白名单（绝对 URL；Swagger UI 与外部 host 必须精确匹配）
      redirect-uris: >
        http://localhost:8080/auth/oauth2/callback,
        ${SYSTEM_SERVER_URL:http://localhost:80}/swagger-ui/oauth2-redirect.html,
        ${GATEWAY_URL:http://localhost:8080}/swagger-ui/oauth2-redirect.html
      scopes: openid,profile,email,address,phone
      require-proof-key: true
      require-authorization-consent: false
      access-token-ttl-seconds: ${EAGLE_ACCESS_TOKEN_TTL:3600}
      refresh-token-ttl-seconds: ${EAGLE_REFRESH_TOKEN_TTL:2592000}
  wechat:
    mini-program:
      app-id: ${WECHAT_MINI_APP_ID:}
      app-secret: ${WECHAT_MINI_APP_SECRET:}
    web:
      pc:
        app-id: ${WECHAT_WEB_APP_ID:}
        app-secret: ${WECHAT_WEB_APP_SECRET:}
        redirect-uri: ${WECHAT_WEB_REDIRECT_URI:http://localhost/login/wechat/pc/callback}
      h5:
        app-id: ${WECHAT_MP_APP_ID:}
        app-secret: ${WECHAT_MP_APP_SECRET:}
        redirect-uri: ${WECHAT_MP_REDIRECT_URI:http://localhost/login/wechat/h5/callback}
  log:
    cleanup:
      enabled: true
      retention-days: ${EAGLE_LOG_RETENTION_DAYS:90}
      cron: "0 0 2 * * ?"
  sms:
    aliyun:
      access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}

# ===========================================
# Spring Boot Actuator（默认按生产安全：仅暴露 health/info/prometheus，不返回详情）
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,prometheus}
      base-path: /actuator
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:never}
      show-components: ${ACTUATOR_HEALTH_COMPONENTS:never}
      probes:
        enabled: true
    metrics:
      enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: ${ACTUATOR_REDIS_HEALTH:true}
  info:
    env:
      enabled: ${ACTUATOR_INFO_ENV:false}      # 默认关闭，防止 env 经 /info 泄漏

# ===========================================
# Swagger / OpenAPI（默认开启；prod profile 强制关闭）
# ===========================================
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  show-oauth2-endpoints: true
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    oauth:
      app-name: Eagle
      client-id: eagleWeb
      use-pkce-with-authorization-code-grant: true
      scopes:
        - "openid"
        - "profile"
    csrf:
      enabled: true
    doc-expansion: none
    persist-authorization: true

# ===========================================
# 日志（默认 INFO 基线；profile 各自调整级别）
# ===========================================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.eagle: ${LOG_LEVEL_EAGLE:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_BIND:WARN}
