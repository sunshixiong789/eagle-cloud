# ===========================================
# Eagle System Server · 基线配置（承载全部默认）
# 设计原则：
#   - application.yml 承载完整配置；profile 文件只声明"开发/线上不一样"的差异
#   - 环境变量仅暴露外部接入字段：数据源/Redis/Consul 连接信息、凭证、白名单
#   - 默认值取"生产安全"基线（validate / show-sql=false / details=never / WARN 日志）
#     dev/local profile 显式打开调试便利
# ===========================================

server:
  port: ${SERVER_PORT:80}
  shutdown: graceful
  # 信任网关注入的 X-Forwarded-* 头,让生成的 URL(actuator / swagger-ui 等)
  # 使用网关对外的 host/scheme,而不是 system 自身内网地址。
  # 仅在通过网关或可信反向代理访问时启用;直连调试不受影响(无 X-Forwarded-* 时退化)。
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
  tomcat:
    # ⚠️ 本服务扛着 C 端 App 的 WebSocket 长连接（/ws-stomp，经 gateway 的 /system/ws-stomp 转发）。
    # max-connections 是**连接数硬墙**，默认 8192 —— 与内存无关，第 8193 条连接直接被拒。
    # 后台管理端 HTTP 本身 QPS 很低，这个值几乎完全是给 WS 在线数用的：
    #   按「同时在线 WS 数 × 1.2 余量 + 管理端并发」取，20000 覆盖到约 1.6 万同时在线。
    # 每条 WS 连接约 30~50 KB 堆，2 万条 ≈ 800 MB，配合 Dockerfile 里 2G 的堆预算。
    # ⚠️ 宿主机 / 容器的 ulimit -n 必须大于此值（每条连接一个 fd），否则先撞 fd 上限报
    #    "Too many open files"。compose 侧需要 ulimits.nofile。
    max-connections: ${TOMCAT_MAX_CONNECTIONS:20000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}
    # 未开虚拟线程（spring.threads.virtual 未启用）→ 仍是平台线程池。
    # WS 空闲连接不占线程，这 200 个是给管理端 HTTP 请求用的，够用。
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: 20

spring:
  application:
    name: system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: ${CONSUL_DISCOVERY_ENABLED:true}
        register: true
        # 多机部署时显式注入宿主机/可达 IP；单机 docker 部署留空，客户端自动取容器 IP
        prefer-ip-address: true
        ip-address: ${CONSUL_INSTANCE_IP:}
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}-${random.value}
        health-check-path: /actuator/health
        health-check-interval: 10s
        health-check-critical-timeout: 30s
        # 实例 metadata：网关 GatewayOpenApiConfig 按 spring-doc 聚合 OpenAPI，对应 /v3/api-docs/system。
        # 必须放 metadata 不能放 tags —— Spring Cloud Consul 5.x 的 ConsulServiceInstance.getMetadata()
        # 只读 Consul 原生 Meta 字段，不再像 4.x 那样把 "k=v" 形式的 tag 折算进 metadata，
        # 写成 tags 的话网关侧 instance.getMetadata() 永远取不到 spring-doc，聚合恒为空。
        metadata:
          spring-doc: system
          spring-doc-name: System Server
        # tags 仅供 Consul UI / DNS 侧筛选，不参与网关聚合
        tags:
          - spring-doc=system

  # ---- 数据源:PostgreSQL(环境变量驱动连接信息) ----
  # 注:Schema 当前由 Hibernate ddl-auto=update 同步;Flyway 后期统一引入。
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eagle_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: EagleSystemHikariPool
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true
      connection-test-query: SELECT 1

  # ---- JPA:生产 ddl-auto=validate(prod profile 覆盖);dev/local profile 用 update ----
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 100
          fetch_size: 100
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 16

  # ---- 缓存：默认 Redis；local profile 覆盖为 Caffeine ----
  cache:
    type: redis
    redis:
      time-to-live: 30m
      key-prefix: "eagle:"
      cache-null-values: true
      use-key-prefix: true
    caffeine:
      spec: "maximumSize=2000,expireAfterWrite=600s"

  # ---- Redis 连接（type=redis 时生效）----
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 3000ms
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:64}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: ${REDIS_POOL_MAX_WAIT:2000ms}
        shutdown-timeout: 1000ms

  # ---- RabbitMQ 连接（取代 RocketMQ 的 endpoints）----
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true

  # ---- OAuth2 资源服务器:直连 auth-service JWKS endpoint ----
  # 24f3f21/f7e82eb 拆出 auth-service 后,本服务作为纯资源服务器,JwtDecoder 必须有 jwk-set-uri 才能创建。
  # 直连 JWKS(不走 issuer-uri OIDC discovery)避免容器启动早于 auth 时的 503 + 重启风暴(参考既往 bug)。
  # 容器内默认走 service name(auth:9090);本地开发走 localhost:9090。
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${EAGLE_OAUTH_JWK_SET_URI:http://localhost:9090/oauth2/jwks}

# ===========================================
# Eagle 业务配置
# ===========================================
eagle:
  # ----- Admin 用户名 -----
  # 仅 username,识别消费 AccountRegisteredMessage 时哪个用户应被赋予 admin 角色。
  # auth-service 端 AdminInitializer 用相同 EAGLE_ADMIN_USERNAME 环境变量创建初始 Account,
  # 两侧通过环境变量联动保持一致;system 侧不读 password/email(那是 auth 端职责)。
  admin:
    username: ${EAGLE_ADMIN_USERNAME:admin}
  # ----- Resource Server -----
  # /internal/** 是跨服务内部 API(目前仅 /internal/authorization/{accountId} 供 auth-service
  # 在 OAuth2 登录流程中调用,此时尚无用户 JWT 可透传),必须放行。
  # 【生产强约束】网关层必须用 IP 白名单 / mTLS / 客户端凭证(client-credentials scope)二次
  # 保护 /internal/**,本服务侧仅 permitAll 不足以构成访问控制。
  # ----- 审计日志(eagle-audit-log-starter) -----
  # 启用 GET /audit-logs 查询接口(admin 角色),写入路径在 @AuditLog 注解的业务方法
  audit-log:
    controller-enabled: true
    permit-role: admin
  resource-server:
    permit-paths:
      - /internal/**
      # SockJS 探针 (/ws-stomp/info) 是浏览器 XHR GET,无法注入自定义 header,
      # 必须放行 HTTP 层鉴权;WebSocket 连接鉴权由 STOMP CONNECT 帧的
      # JwtWebSocketChannelInterceptor (message/infrastructure/push/) 负责。
      - /ws-stomp/**
      # K8s liveness/readiness 探针:/actuator/health/liveness、/actuator/health/readiness
      # starter DEFAULT_PERMIT_PATHS 仅放行 /actuator/health,需追加 /** 覆盖子路径
      - /actuator/health/**
  # ----- AMQP -----
  # 既消费站内消息,也消费 auth-service 的集成事件(eagle_auth_events)
  # starter 已无 enabled 总开关:auto-configuration 装即生效;
  # 本地无 broker 时让 spring.rabbitmq.host 指向不可达地址即可,Consumer/Publisher 启动后日志告警但不影响应用启动
  amqp:
    consumer-group: system_consumer
    exchange-prefix: ${RABBITMQ_EXCHANGE_PREFIX:dev_}
  # ----- 文件存储(eagle-oss-minio-starter) -----
  # type 默认 local,本地文件系统存储;生产应切到 minio
  storage:
    type: ${EAGLE_STORAGE_TYPE:local}
    local:
      base-path: ${EAGLE_STORAGE_BASE_PATH:./data/eagle/storage}
      url-prefix: ${EAGLE_STORAGE_URL_PREFIX:http://localhost/api/files}
  file:
    bucket: ${EAGLE_FILE_BUCKET:eagle-dev-files}
    max-size-mb: ${EAGLE_FILE_MAX_SIZE_MB:50}
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - pdf
      - docx
      - xlsx
      - txt
  websocket:
    endpoint: /ws-stomp
    app-prefix: /message
    topic-prefix: /topic
    user-prefix: /user
  log:
    cleanup:
      enabled: true
      retention-days: 90
      cron: "0 0 2 * * ?"
  # ----- Redis 缓存区域独立 TTL(默认 30m,见 spring.cache.redis.time-to-live) -----
  redis:
    cache-ttls:
      # 仪表盘聚合统计:5min 抗刷新风暴,可容忍短暂不一致
      DASHBOARD_STATS: 5m

# ===========================================
# Actuator：生产安全基线（仅 health/info/prometheus，无详情）
# dev/local profile 暴露调试端点 + 详情
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
    metrics:
      enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  info:
    env:
      enabled: false

# ===========================================
# Springdoc / Swagger：基线开启（dev/local 用），prod profile 强制关闭
# ===========================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    csrf:
      enabled: true
    doc-expansion: none
    persist-authorization: true

# ===========================================
# 日志：生产安全默认 INFO；dev/local 调到 DEBUG，prod 调到 WARN
# ===========================================
logging:
  level:
    root: INFO
    com.eagle: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
