# ===========================================
# Eagle System Server · 基线配置（承载全部默认）
# 设计原则：
#   - application.yml 承载完整配置；profile 文件只声明"开发/线上不一样"的差异
#   - 环境变量仅暴露外部接入字段：数据源/Redis/Nacos 连接信息、凭证、白名单
#   - 默认值取"生产安全"基线（validate / show-sql=false / details=never / WARN 日志）
#     dev/local profile 显式打开调试便利
# ===========================================

server:
  port: ${SERVER_PORT:80}
  shutdown: graceful
  # 信任网关注入的 X-Forwarded-* 头，让 Spring Authorization Server 的 issuer 与
  # OIDC discovery 文档自动使用网关对外的 host/scheme，而不是 system 自身内网地址。
  # 仅在通过网关或可信反向代理访问时启用；直连调试不受影响（无 X-Forwarded-* 时退化）。
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie

spring:
  application:
    name: system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # Nacos 3.0+ 默认开启鉴权（nacos.core.auth.enabled=true），客户端必须传账号密码
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        # 多机部署时显式注入宿主机/可达 IP；单机 docker 部署留空，客户端自动取容器 IP
        ip: ${NACOS_REGISTER_IP:}
        # 实例 metadata：网关按 spring-doc 聚合 OpenAPI，对应 /v3/api-docs/system
        metadata:
          spring-doc: system
          spring-doc-name: System Server

  # ---- Flyway：基线默认关闭，dev/prod profile 显式打开 ----
  flyway:
    enabled: false
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  # ---- 数据源：默认 MySQL（环境变量驱动连接信息）；local profile 覆盖为 H2 ----
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eagle}?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: EagleHikariPool
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true
      connection-test-query: SELECT 1

  # ---- JPA：生产安全默认（validate / 不打印 SQL）；dev/local profile 覆盖 ----
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 100
          fetch_size: 100
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 16

  # ---- 缓存：默认 Redis；local profile 覆盖为 Caffeine ----
  cache:
    type: redis
    redis:
      time-to-live: 30m
      key-prefix: "eagle:"
      cache-null-values: true
      use-key-prefix: true
    caffeine:
      spec: "maximumSize=2000,expireAfterWrite=600s"

  # ---- Redis 连接（type=redis 时生效）----
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 3000ms
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
        shutdown-timeout: 1000ms

# ===========================================
# Eagle 业务配置
# ===========================================
eagle:
  jwt:
    keystore-location: classpath:jwt-keystore.p12
    keystore-password: ${EAGLE_JWT_KEYSTORE_PASSWORD:eagle-jwt-dev-2026}
    key-alias: eagle-jwt
  websocket:
    endpoint: /ws-stomp
    app-prefix: /message
    topic-prefix: /topic
    user-prefix: /user
  admin:
    username: ${EAGLE_ADMIN_USERNAME:admin}
    password: ${EAGLE_ADMIN_PASSWORD}        # 必填，缺失即 fail-fast
    name: ${EAGLE_ADMIN_NAME:系统管理员}
    email: ${EAGLE_ADMIN_EMAIL:admin@eagle.com}
  oauth:
    # OAuth2 Authorization Server 对外 issuer（必填,fail-fast）。
    # 一旦设置,签发 token 的 iss claim 锁定为此值,不再随 X-Forwarded-Host 漂移。
    # 集群部署：所有 system 实例必须配置同一个 issuer；指向 LB / 网关对外稳定 URL,而非任何单实例地址。
    # 资源服务器 (product / user / trade) 的 AUTH_SERVER_ISSUER_URI 必须与此严格一致。
    issuer: ${EAGLE_OAUTH_ISSUER}
    default-client:
      enabled: true
      client-id: eagleWeb
      client-name: Eagle Web 前端应用
      client-authentication-methods: none
      authorization-grant-types: authorization_code,refresh_token,wechat_mini_program,sms_code
      redirect-uris: >
        http://localhost:8080/auth/oauth2/callback,
        http://139.155.104.132:3000/auth/oauth2/callback
      scopes: openid,profile,email,address,phone
      require-proof-key: true
      require-authorization-consent: false
      access-token-ttl-seconds: 3600
      refresh-token-ttl-seconds: 2592000
    # App 端专用 public client：关闭 PKCE，仅授权自定义 grant_type，配合移动端 sms_code / wechat_app / wechat_mini_program / phone_one_click 使用
    app-client:
      enabled: true
      client-id: eagleApp
      client-name: Eagle App 移动端
      client-authentication-methods: none
      authorization-grant-types: refresh_token,sms_code,wechat_app,wechat_mini_program,phone_one_click
      redirect-uris: ""
      scopes: openid,profile,email,address,phone
      require-proof-key: false
      require-authorization-consent: false
      access-token-ttl-seconds: 3600
      refresh-token-ttl-seconds: 2592000
  wechat:
    app:
      app-id: ${WECHAT_APP_APP_ID:}
      app-secret: ${WECHAT_APP_APP_SECRET:}
    mini-program:
      app-id: ${WECHAT_MINI_APP_ID:}
      app-secret: ${WECHAT_MINI_APP_SECRET:}
    web:
      pc:
        app-id: ${WECHAT_WEB_APP_ID:}
        app-secret: ${WECHAT_WEB_APP_SECRET:}
        redirect-uri: ${WECHAT_WEB_REDIRECT_URI:http://localhost/login/wechat/pc/callback}
      h5:
        app-id: ${WECHAT_MP_APP_ID:}
        app-secret: ${WECHAT_MP_APP_SECRET:}
        redirect-uri: ${WECHAT_MP_REDIRECT_URI:http://localhost/login/wechat/h5/callback}
  log:
    cleanup:
      enabled: true
      retention-days: 90
      cron: "0 0 2 * * ?"
  message:
    sms:
      # 短信服务商：aliyun / tencent / hnsls，三选一
      provider: ${SMS_PROVIDER:tencent}
      access-key-id: ${SMS_ACCESS_KEY_ID:}
      access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
      sign-name: ${SMS_SIGN_NAME:${HNSLS_SMS_SIGN_NAME:}}
      template-id: ${SMS_TEMPLATE_ID:${TENCENT_SMS_TEMPLATE_ID:${ALIYUN_SMS_TEMPLATE_CODE:}}}
      sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:}
      region: ${TENCENT_SMS_REGION:ap-guangzhou}
      username: ${HNSLS_SMS_USERNAME:}
      password: ${HNSLS_SMS_PASSWORD:}
      content-template: ${HNSLS_SMS_CONTENT_TEMPLATE:您的验证码是{code}，5分钟内有效。}
      send-url: ${HNSLS_SMS_SEND_URL:https://xapi.hnsls.com.cn/eums/sms/utf8/send.do}
      charset: ${HNSLS_SMS_CHARSET:UTF-8}
      connect-timeout-ms: ${HNSLS_SMS_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${HNSLS_SMS_READ_TIMEOUT_MS:10000}

# ===========================================
# Actuator：生产安全基线（仅 health/info/prometheus，无详情）
# dev/local profile 暴露调试端点 + 详情
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
    metrics:
      enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  info:
    env:
      enabled: false

# ===========================================
# Springdoc / Swagger：基线开启（dev/local 用），prod profile 强制关闭
# ===========================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  show-oauth2-endpoints: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    oauth:
      app-name: Eagle
      client-id: eagleWeb
      use-pkce-with-authorization-code-grant: true
      scopes:
        - "openid"
        - "profile"
    csrf:
      enabled: true
    doc-expansion: none
    persist-authorization: true

# ===========================================
# 日志：生产安全默认 INFO；dev/local 调到 DEBUG，prod 调到 WARN
# ===========================================
logging:
  level:
    root: INFO
    com.eagle: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
