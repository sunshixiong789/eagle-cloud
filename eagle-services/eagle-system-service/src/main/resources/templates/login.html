<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>系统登录</title>
    <style>
        /* ── Reset ── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ── Base ── */
        :root {
            --primary: #4782da;
            --primary-dark: #1e3a5f;
            --primary-gradient: linear-gradient(160deg, #4782da 0%, #1e3a5f 100%);
            --error: #ef4444;
            --success: #059669;
            --wechat: #07c160;
            --wechat-light: #f0fdf4;
            --wechat-border: #bbf7d0;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #c4cdd8;
            --border-light: #e2e8f0;
            --bg-page: #eef2f7;
            --bg-hover: #f1f5f9;
            --radius-input: 10px;
            --radius-card: 20px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
            'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        /* ── Card ── */
        .login-card {
            display: flex;
            width: 740px;
            max-width: 100%;
            border-radius: var(--radius-card);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
            animation: popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ── Brand Panel ── */
        .brand {
            width: 260px;
            flex-shrink: 0;
            background: var(--primary-gradient);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .brand::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 75% 15%, rgba(255, 255, 255, 0.09) 0%, transparent 55%),
            radial-gradient(circle at 20% 85%, rgba(255, 255, 255, 0.06) 0%, transparent 45%);
        }

        .brand-dots {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.13) 1px, transparent 1px);
            background-size: 18px 18px;
        }

        .brand-icon {
            position: relative;
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
        }

        .brand-icon svg {
            width: 30px;
            height: 30px;
            stroke: white;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-title {
            position: relative;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .brand-sub {
            position: relative;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
        }

        /* ── Form Panel ── */
        .form-panel {
            flex: 1;
            background: white;
            padding: 36px 36px 32px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .form-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .form-sub {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        /* ── Tab Navigation ── */
        .tab-nav {
            display: flex;
            position: relative;
            background: #f1f5f9;
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 22px;
        }

        .tab-btn {
            flex: 1;
            padding: 9px 0;
            border: none;
            background: transparent;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
            font-family: inherit;
            position: relative;
            z-index: 1;
            transition: color 0.25s;
            border-radius: 8px;
        }

        .tab-btn.active {
            color: var(--primary);
            font-weight: 600;
        }

        .tab-indicator {
            position: absolute;
            top: 3px;
            bottom: 3px;
            left: 3px;
            width: calc(33.333% - 2px);
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08), 0 0.5px 1px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-indicator[data-tab="1"] {
            transform: translateX(0);
        }

        .tab-indicator[data-tab="2"] {
            transform: translateX(100%);
        }

        .tab-indicator[data-tab="3"] {
            transform: translateX(200%);
        }

        /* ── Tab Panels ── */
        .tab-panel {
            display: none;
            animation: fadeSlide 0.3s ease;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Alert Banner ── */
        .alert {
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.8rem;
            margin-bottom: 16px;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
        }

        .alert-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
        }

        .alert svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        /* ── MUI Outlined Input ── */
        .mui-field {
            position: relative;
            margin-bottom: 8px;
        }

        .mui-field input {
            width: 100%;
            height: 52px;
            padding: 0 40px 0 44px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-input);
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--text-main);
            background: white;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .mui-field input::placeholder {
            color: transparent;
        }

        .mui-field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(71, 130, 218, 0.12);
        }

        .mui-field input.is-error {
            border-color: var(--error);
        }

        .mui-field input.is-error:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        /* Floating label */
        .mui-field label {
            position: absolute;
            left: 44px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.88rem;
            color: #94a3b8;
            pointer-events: none;
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            padding: 0 4px;
            line-height: 1;
        }

        .mui-field input:focus + label,
        .mui-field input:not(:placeholder-shown) + label {
            top: 0;
            font-size: 0.72rem;
            color: var(--primary);
        }

        .mui-field input.is-error + label,
        .mui-field input.is-error:focus + label {
            color: var(--error);
        }

        .mui-field input:not(:placeholder-shown):not(:focus) + label {
            color: var(--text-sub);
        }

        /* Prefix icon */
        .field-prefix {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            display: flex;
            align-items: center;
            pointer-events: none;
            transition: color 0.2s;
        }

        .field-prefix svg {
            width: 18px;
            height: 18px;
        }

        .mui-field input:focus ~ .field-prefix {
            color: var(--primary);
        }

        .mui-field input.is-error ~ .field-prefix {
            color: var(--error);
        }

        /* Suffix (password eye / send code btn) */
        .field-suffix {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
            background: none;
            border: none;
        }

        .field-suffix:hover {
            color: var(--text-sub);
        }

        .field-suffix svg {
            width: 17px;
            height: 17px;
        }

        /* Helper text */
        .field-helper {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            color: var(--error);
            padding: 3px 4px 8px;
            min-height: 20px;
        }

        .field-helper svg {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
        }

        .field-helper:empty {
            padding: 0;
            min-height: 0;
        }

        /* ── Code Input Row ── */
        .code-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .code-row .mui-field {
            flex: 1;
            margin-bottom: 0;
        }

        .btn-send-code {
            flex-shrink: 0;
            width: 120px;
            height: 52px;
            border: 1.5px solid var(--primary);
            border-radius: var(--radius-input);
            background: white;
            color: var(--primary);
            font-size: 0.82rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s, opacity 0.2s;
        }

        .btn-send-code:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }

        .btn-send-code:disabled {
            border-color: var(--border);
            color: var(--text-sub);
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* ── Bottom Row ── */
        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        /* Custom Checkbox */
        .cb-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .cb-wrap input[type="checkbox"] {
            display: none;
        }

        .cb-box {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            border: 1.5px solid var(--border);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .cb-wrap input:checked ~ .cb-box {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(71, 130, 218, 0.3);
        }

        .cb-box svg {
            opacity: 0;
            transform: scale(0.4) rotate(-15deg);
            transition: opacity 0.15s, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cb-wrap input:checked ~ .cb-box svg {
            opacity: 1;
            transform: scale(1) rotate(0);
        }

        .cb-label {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .forgot {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot:hover {
            color: #2563eb;
        }

        /* ── Primary Button ── */
        .btn-primary {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: var(--radius-input);
            background: var(--primary-gradient);
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(71, 130, 218, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(71, 130, 218, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* ── WeChat Panel ── */
        .wechat-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
        }

        .wechat-qr-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            min-height: 280px;
            position: relative;
        }

        /* 微信 JS SDK 生成的 iframe 样式覆盖 */
        .wechat-qr-wrap iframe {
            width: 300px !important;
            height: 280px !important;
            border: none !important;
        }

        .wechat-hint {
            margin-top: 6px;
            font-size: 0.72rem;
            color: #94a3b8;
            text-align: center;
        }

        .wechat-qr-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-sub);
            font-size: 0.82rem;
        }

        /* ── Register Link ── */
        .register-link {
            text-align: center;
            margin-top: 18px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .register-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .register-link a:hover {
            color: #2563eb;
        }

        /* ══════════════════════════════════════
           Mobile
        ══════════════════════════════════════ */
        @media (max-width: 640px) {
            body {
                align-items: flex-start;
                padding: 0;
                background: white;
            }

            .login-card {
                width: 100%;
                min-height: 100vh;
                border-radius: 0;
                flex-direction: column;
                box-shadow: none;
                animation: none;
            }

            .brand {
                width: 100%;
                padding: 36px 24px 52px;
                border-radius: 0 0 40% 40% / 0 0 36px 36px;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.14);
                flex-shrink: 0;
            }

            .brand-icon {
                width: 56px;
                height: 56px;
                border-radius: 14px;
                margin-bottom: 14px;
            }

            .brand-icon svg {
                width: 26px;
                height: 26px;
            }

            .brand-title {
                font-size: 1.1rem;
            }

            .brand-sub {
                font-size: 0.75rem;
            }

            .form-panel {
                flex: 1;
                margin: 28px 20px 32px;
                padding: 28px 20px 24px;
                border-radius: 16px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
                justify-content: flex-start;
            }

            .form-title {
                font-size: 1.05rem;
                text-align: center;
            }

            .form-sub {
                text-align: center;
                margin-bottom: 16px;
            }

            .tab-nav {
                margin-bottom: 18px;
            }

            .tab-btn {
                font-size: 0.78rem;
                padding: 8px 0;
            }

            .mui-field input {
                height: 48px;
                font-size: 0.88rem;
            }

            .btn-primary {
                height: 44px;
                font-size: 0.88rem;
            }

            .btn-send-code {
                width: 100px;
                height: 48px;
                font-size: 0.78rem;
            }
        }

        @media (min-width: 641px) and (max-width: 800px) {
            .login-card {
                width: 100%;
            }

            .brand {
                width: 220px;
            }

            .form-panel {
                padding: 32px 28px 28px;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- Brand Panel -->
    <div class="brand">
        <div class="brand-dots"></div>
        <div class="brand-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>
        <div class="brand-title">认证中心</div>
        <div class="brand-sub">统一登录平台</div>
    </div>

    <!-- Form Panel -->
    <div class="form-panel">
        <div class="form-title">你好，欢迎登录</div>
        <div class="form-sub">选择登录方式继续</div>

        <!-- Alerts -->
        <div class="alert alert-error" id="global-alert" th:if="${param.error}">
            <svg fill="currentColor" viewBox="0 0 20 20">
                <path d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                      fill-rule="evenodd"/>
            </svg>
            <span th:if="${param.sms}">短信验证失败，请重新输入</span>
            <span th:unless="${param.sms}">账号或密码错误，请重新输入</span>
        </div>

        <div class="alert alert-success" th:if="${param.logout}">
            <svg fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                      fill-rule="evenodd"/>
            </svg>
            已成功退出登录
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <div class="tab-indicator" data-tab="1"></div>
            <button class="tab-btn active" data-target="tab-password" type="button">密码登录</button>
            <button class="tab-btn" data-target="tab-sms" type="button">短信登录</button>
            <button class="tab-btn" data-target="tab-wechat" type="button">微信登录</button>
        </div>

        <!-- ═══════ Tab 1: Password Login ═══════ -->
        <div class="tab-panel active" id="tab-password">
            <form id="password-form" method="post" novalidate th:action="@{/login}">
                <!-- Username -->
                <div class="mui-field">
                    <input autocomplete="username" id="username" name="username"
                           placeholder=" " required type="text">
                    <label for="username">用户名</label>
                    <span class="field-prefix">
                        <svg fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10 10a4 4 0 100-8 4 4 0 000 8zm-7 9a7 7 0 1114 0H3z"/>
                        </svg>
                    </span>
                </div>
                <div class="field-helper" id="username-error"></div>

                <!-- Password -->
                <div class="mui-field">
                    <input autocomplete="current-password" id="password" name="password"
                           placeholder=" " required type="password">
                    <label for="password">密码</label>
                    <span class="field-prefix">
                        <svg fill="currentColor" viewBox="0 0 20 20">
                            <path d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                                  fill-rule="evenodd"/>
                        </svg>
                    </span>
                    <button aria-label="显示/隐藏密码" class="field-suffix" id="pw-toggle" type="button">
                        <svg fill="currentColor" id="eye-icon" viewBox="0 0 20 20">
                            <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                            <path d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"
                                  fill-rule="evenodd"/>
                        </svg>
                    </button>
                </div>
                <div class="field-helper" id="password-error"></div>

                <!-- Remember me + Forgot -->
                <div class="bottom-row">
                    <label class="cb-wrap">
                        <input name="remember-me" type="checkbox">
                        <div class="cb-box">
                            <svg fill="none" height="8" viewBox="0 0 10 8" width="10">
                                <path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-linecap="round"
                                      stroke-linejoin="round" stroke-width="1.8"/>
                            </svg>
                        </div>
                        <span class="cb-label">记住我</span>
                    </label>
                    <a class="forgot" th:href="@{/login/reset-password}">忘记密码?</a>
                </div>

                <button class="btn-primary" type="submit">登 录</button>
            </form>

            <div class="register-link">
                没有账号？<a th:href="@{/login/register}">立即注册</a>
            </div>
        </div>

        <!-- ═══════ Tab 2: SMS Login ═══════ -->
        <div class="tab-panel" id="tab-sms">
            <form id="sms-form" method="post" novalidate th:action="@{/login/sms}">
                <!-- Phone -->
                <div class="mui-field">
                    <input autocomplete="tel" id="sms-phone" maxlength="11"
                           name="phone" placeholder=" " required type="tel">
                    <label for="sms-phone">手机号</label>
                    <span class="field-prefix">
                        <svg fill="currentColor" viewBox="0 0 20 20">
                            <path d="M7 2a2 2 0 00-2 2v12a2 2 0 002 2h6a2 2 0 002-2V4a2 2 0 00-2-2H7zm3 14a1 1 0 100-2 1 1 0 000 2z"/>
                        </svg>
                    </span>
                </div>
                <div class="field-helper" id="phone-error"></div>

                <!-- Code + Send Button -->
                <div class="code-row">
                    <div class="mui-field">
                        <input autocomplete="one-time-code" id="sms-code" inputmode="numeric"
                               maxlength="6" name="code" placeholder=" "
                               required type="text">
                        <label for="sms-code">验证码</label>
                        <span class="field-prefix">
                            <svg fill="currentColor" viewBox="0 0 20 20">
                                <path d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                                      fill-rule="evenodd"/>
                            </svg>
                        </span>
                    </div>
                    <button class="btn-send-code" id="send-code-btn" type="button">获取验证码</button>
                </div>
                <div class="field-helper" id="code-error"></div>

                <button class="btn-primary" style="margin-top: 10px;" type="submit">登 录</button>
            </form>

            <div class="register-link">
                没有账号？<a th:href="@{/login/register}">立即注册</a>
            </div>
        </div>

        <!-- ═══════ Tab 3: WeChat Login (Embedded QR) ═══════ -->
        <div class="tab-panel" id="tab-wechat">
            <div class="wechat-panel">
                <div class="wechat-qr-wrap" id="wechat-qr-container">
                    <div class="wechat-qr-loading" id="wechat-qr-loading">加载中...</div>
                </div>
                <div class="wechat-hint">请使用微信扫描二维码登录</div>
            </div>
        </div>

    </div>
</div>

<script th:inline="javascript">
    (function () {
        /* ── 微信内置浏览器自动跳转 H5 授权 ── */
        if (/micromessenger/i.test(navigator.userAgent)) {
            window.location.replace('/login/wechat/h5');
            return;
        }

        /* ── 服务端注入的微信配置 ── */
        var wechatAppId = /*[[${wechatAppId}]]*/ '';
        var wechatRedirectUri = /*[[${wechatRedirectUri}]]*/ '';
        var wechatState = /*[[${wechatState}]]*/ '';

        /* ══════════════════════════════════════
           Tab Switching
        ══════════════════════════════════════ */
        var tabBtns = document.querySelectorAll('.tab-btn');
        var tabPanels = document.querySelectorAll('.tab-panel');
        var indicator = document.querySelector('.tab-indicator');
        var tabMap = {'tab-password': '1', 'tab-sms': '2', 'tab-wechat': '3'};
        var hashMap = {'#password': 'tab-password', '#sms': 'tab-sms', '#wechat': 'tab-wechat'};
        var wechatQrLoaded = false;

        function switchTab(targetId) {
            tabBtns.forEach(function (btn) {
                btn.classList.toggle('active', btn.getAttribute('data-target') === targetId);
            });
            tabPanels.forEach(function (panel) {
                panel.classList.toggle('active', panel.id === targetId);
            });
            indicator.setAttribute('data-tab', tabMap[targetId] || '1');
            history.replaceState(null, '', '#' + targetId.replace('tab-', ''));

            /* 切换到微信 tab 时懒加载二维码 */
            if (targetId === 'tab-wechat' && !wechatQrLoaded) {
                loadWechatQr();
            }
        }

        tabBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                switchTab(this.getAttribute('data-target'));
            });
        });

        /* Restore tab from URL hash or error param */
        var hash = window.location.hash;
        var params = new URLSearchParams(window.location.search);
        if (params.has('sms')) {
            switchTab('tab-sms');
        } else if (hashMap[hash]) {
            switchTab(hashMap[hash]);
        }

        /* ══════════════════════════════════════
           WeChat Embedded QR Code
        ══════════════════════════════════════ */
        function loadWechatQr() {
            if (!wechatAppId) {
                document.getElementById('wechat-qr-loading').textContent = '微信登录未配置';
                return;
            }
            wechatQrLoaded = true;
            var script = document.createElement('script');
            script.src = 'https://res.wx.qq.com/connect/zh_CN/htmledition/js/wxLogin.js';
            script.onload = function () {
                document.getElementById('wechat-qr-loading').style.display = 'none';
                new WxLogin({
                    self_redirect: false,
                    id: 'wechat-qr-container',
                    appid: wechatAppId,
                    scope: 'snsapi_login',
                    redirect_uri: encodeURIComponent(wechatRedirectUri),
                    state: wechatState,
                    style: 'white',
                    href: ''
                });
            };
            script.onerror = function () {
                document.getElementById('wechat-qr-loading').textContent = '二维码加载失败，请刷新重试';
            };
            document.head.appendChild(script);
        }

        /* ══════════════════════════════════════
           Password Form — Visibility Toggle
        ══════════════════════════════════════ */
        var pwInput = document.getElementById('password');
        var pwToggle = document.getElementById('pw-toggle');
        var eyeIcon = document.getElementById('eye-icon');

        var eyeOpen = '<path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"/>';
        var eyeClosed = '<path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z"/><path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/>';

        pwToggle.addEventListener('click', function () {
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                eyeIcon.innerHTML = eyeClosed;
                pwToggle.setAttribute('aria-label', '隐藏密码');
            } else {
                pwInput.type = 'password';
                eyeIcon.innerHTML = eyeOpen;
                pwToggle.setAttribute('aria-label', '显示密码');
            }
        });

        /* ══════════════════════════════════════
           Password Form — Validation
        ══════════════════════════════════════ */
        var passwordForm = document.getElementById('password-form');
        var usernameInput = document.getElementById('username');
        var usernameError = document.getElementById('username-error');
        var passwordError = document.getElementById('password-error');

        var errorSvg = '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/></svg>';

        function setError(input, helperEl, msg) {
            input.classList.add('is-error');
            helperEl.innerHTML = msg ? errorSvg + msg : '';
        }

        function clearError(input, helperEl) {
            input.classList.remove('is-error');
            helperEl.innerHTML = '';
        }

        usernameInput.addEventListener('input', function () {
            if (this.value.trim()) clearError(this, usernameError);
        });

        pwInput.addEventListener('input', function () {
            if (this.value) clearError(this, passwordError);
        });

        passwordForm.addEventListener('submit', function (e) {
            var valid = true;
            if (!usernameInput.value.trim()) {
                setError(usernameInput, usernameError, '请输入用户名');
                valid = false;
            }
            if (!pwInput.value) {
                setError(pwInput, passwordError, '请输入密码');
                valid = false;
            }
            if (!valid) e.preventDefault();
        });

        /* ══════════════════════════════════════
           SMS Form — Send Code + Countdown
        ══════════════════════════════════════ */
        var smsForm = document.getElementById('sms-form');
        var phoneInput = document.getElementById('sms-phone');
        var codeInput = document.getElementById('sms-code');
        var phoneError = document.getElementById('phone-error');
        var codeError = document.getElementById('code-error');
        var sendBtn = document.getElementById('send-code-btn');
        var phoneRegex = /^1[3-9]\d{9}$/;
        var countdown = 0;
        var countdownTimer = null;

        phoneInput.addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '').slice(0, 11);
            if (phoneRegex.test(this.value)) clearError(this, phoneError);
        });

        codeInput.addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
            if (this.value.length > 0) clearError(this, codeError);
        });

        function startCountdown() {
            countdown = 60;
            sendBtn.disabled = true;
            sendBtn.textContent = countdown + 's';
            countdownTimer = setInterval(function () {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(countdownTimer);
                    sendBtn.disabled = false;
                    sendBtn.textContent = '获取验证码';
                } else {
                    sendBtn.textContent = countdown + 's';
                }
            }, 1000);
        }

        sendBtn.addEventListener('click', function () {
            var phone = phoneInput.value.trim();
            if (!phoneRegex.test(phone)) {
                setError(phoneInput, phoneError, '请输入正确的手机号');
                return;
            }
            clearError(phoneInput, phoneError);
            sendBtn.disabled = true;
            sendBtn.textContent = '发送中...';

            fetch('/sms/code?phone=' + encodeURIComponent(phone), {method: 'POST'})
                .then(function (resp) {
                    if (resp.ok) {
                        startCountdown();
                    } else {
                        return resp.json().then(function (data) {
                            throw new Error(data.message || '发送失败');
                        });
                    }
                })
                .catch(function (err) {
                    setError(phoneInput, phoneError, err.message || '发送失败，请稍后重试');
                    sendBtn.disabled = false;
                    sendBtn.textContent = '获取验证码';
                });
        });

        smsForm.addEventListener('submit', function (e) {
            var valid = true;
            if (!phoneRegex.test(phoneInput.value.trim())) {
                setError(phoneInput, phoneError, '请输入正确的手机号');
                valid = false;
            }
            if (!codeInput.value.trim()) {
                setError(codeInput, codeError, '请输入验证码');
                valid = false;
            }
            if (!valid) e.preventDefault();
        });
    }());
</script>
</body>
</html>
