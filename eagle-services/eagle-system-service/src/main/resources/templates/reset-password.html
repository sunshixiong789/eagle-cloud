<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码</title>
    <style>
        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Base ── */
        :root {
            --primary: #4782da;
            --primary-dark: #1e3a5f;
            --primary-gradient: linear-gradient(160deg, #4782da 0%, #1e3a5f 100%);
            --error: #ef4444;
            --success: #059669;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #c4cdd8;
            --border-light: #e2e8f0;
            --bg-page: #eef2f7;
            --radius-input: 10px;
            --radius-card: 20px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                         'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        /* ── Card ── */
        .reset-card {
            display: flex;
            width: 740px;
            max-width: 100%;
            border-radius: var(--radius-card);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
            animation: popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.94) translateY(8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ── Brand Panel ── */
        .brand {
            width: 260px;
            flex-shrink: 0;
            background: var(--primary-gradient);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .brand::before {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(circle at 75% 15%, rgba(255,255,255,0.09) 0%, transparent 55%),
                radial-gradient(circle at 20% 85%, rgba(255,255,255,0.06) 0%, transparent 45%);
        }

        .brand-dots {
            position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.13) 1px, transparent 1px);
            background-size: 18px 18px;
        }

        .brand-icon {
            position: relative;
            width: 64px; height: 64px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
        }

        .brand-icon svg {
            width: 30px; height: 30px;
            stroke: white; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        .brand-title {
            position: relative;
            font-size: 1.2rem; font-weight: 700;
            color: white; margin-bottom: 8px;
        }

        .brand-sub {
            position: relative;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
        }

        /* ── Form Panel ── */
        .form-panel {
            flex: 1;
            background: white;
            padding: 36px 36px 32px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .form-title {
            font-size: 1.2rem; font-weight: 700;
            color: var(--text-main); margin-bottom: 4px;
        }

        .form-sub {
            font-size: 0.8rem; color: var(--text-sub);
            margin-bottom: 20px;
        }

        /* ── Steps ── */
        .step-bar {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            gap: 0;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .step-item.active { color: var(--primary); font-weight: 600; }
        .step-item.done { color: var(--success); }

        .step-num {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 700;
            flex-shrink: 0;
        }

        .step-item.active .step-num {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .step-item.done .step-num {
            border-color: var(--success);
            background: var(--success);
            color: white;
        }

        .step-line {
            flex: 1;
            height: 1px;
            background: var(--border-light);
            margin: 0 12px;
        }

        .step-line.done { background: var(--success); }

        /* ── Alert Banner ── */
        .alert {
            display: flex; align-items: center; gap: 8px;
            border-radius: 8px; padding: 10px 14px;
            font-size: 0.8rem; margin-bottom: 16px;
        }

        .alert-error {
            background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
        }

        .alert-success {
            background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d;
        }

        .alert svg { width: 15px; height: 15px; flex-shrink: 0; }

        /* ── MUI Outlined Input ── */
        .mui-field { position: relative; margin-bottom: 8px; }

        .mui-field input {
            width: 100%;
            height: 52px;
            padding: 0 40px 0 44px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-input);
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--text-main);
            background: white;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .mui-field input::placeholder { color: transparent; }

        .mui-field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(71, 130, 218, 0.12);
        }

        .mui-field input.is-error { border-color: var(--error); }
        .mui-field input.is-error:focus { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1); }

        .mui-field label {
            position: absolute;
            left: 44px; top: 50%; transform: translateY(-50%);
            font-size: 0.88rem; color: #94a3b8;
            pointer-events: none;
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            background: white; padding: 0 4px; line-height: 1;
        }

        .mui-field input:focus + label,
        .mui-field input:not(:placeholder-shown) + label {
            top: 0;
            font-size: 0.72rem;
            color: var(--primary);
        }

        .mui-field input.is-error + label,
        .mui-field input.is-error:focus + label { color: var(--error); }

        .mui-field input:not(:placeholder-shown):not(:focus) + label { color: var(--text-sub); }

        .field-prefix {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; display: flex; align-items: center; pointer-events: none;
            transition: color 0.2s;
        }

        .field-prefix svg { width: 18px; height: 18px; }

        .mui-field input:focus ~ .field-prefix { color: var(--primary); }
        .mui-field input.is-error ~ .field-prefix { color: var(--error); }

        .field-suffix {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; cursor: pointer; padding: 4px;
            display: flex; align-items: center;
            transition: color 0.2s; background: none; border: none;
        }

        .field-suffix:hover { color: var(--text-sub); }
        .field-suffix svg { width: 17px; height: 17px; }

        .field-helper {
            display: flex; align-items: center; gap: 4px;
            font-size: 0.72rem; color: var(--error);
            padding: 3px 4px 8px;
            min-height: 20px;
        }

        .field-helper svg { width: 12px; height: 12px; flex-shrink: 0; }
        .field-helper:empty { padding: 0; min-height: 0; }

        /* ── Code Input Row ── */
        .code-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .code-row .mui-field { flex: 1; margin-bottom: 0; }

        .btn-send-code {
            flex-shrink: 0;
            width: 120px;
            height: 52px;
            border: 1.5px solid var(--primary);
            border-radius: var(--radius-input);
            background: white;
            color: var(--primary);
            font-size: 0.82rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s, opacity 0.2s;
        }

        .btn-send-code:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }

        .btn-send-code:disabled {
            border-color: var(--border);
            color: var(--text-sub);
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* ── Primary Button ── */
        .btn-primary {
            width: 100%; height: 46px;
            border: none; border-radius: var(--radius-input);
            background: var(--primary-gradient);
            color: white; font-size: 0.9rem; font-weight: 600;
            letter-spacing: 0.5px; cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(71, 130, 218, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(71, 130, 218, 0.45);
        }

        .btn-primary:active { transform: translateY(0); }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ── Step Panel ── */
        .step-panel { display: none; animation: fadeSlide 0.3s ease; }
        .step-panel.active { display: block; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Success Panel ── */
        .success-icon {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: #f0fdf4;
            display: flex; align-items: center; justify-content: center;
            margin: 16px auto 20px;
        }

        .success-icon svg { width: 32px; height: 32px; color: var(--success); }

        .success-text {
            text-align: center;
            font-size: 1rem; font-weight: 600;
            color: var(--text-main); margin-bottom: 8px;
        }

        .success-hint {
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-sub); margin-bottom: 24px;
        }

        /* ── Back Link ── */
        .back-link {
            text-align: center; margin-top: 18px;
            font-size: 0.8rem; color: var(--text-sub);
        }

        .back-link a {
            color: var(--primary); font-weight: 600;
            text-decoration: none; transition: color 0.2s;
        }

        .back-link a:hover { color: #2563eb; }

        /* ── Mobile ── */
        @media (max-width: 640px) {
            body { align-items: flex-start; padding: 0; background: white; }

            .reset-card {
                width: 100%; min-height: 100vh; border-radius: 0;
                flex-direction: column; box-shadow: none; animation: none;
            }

            .brand {
                width: 100%; padding: 36px 24px 52px;
                border-radius: 0 0 40% 40% / 0 0 36px 36px;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.14);
            }

            .brand-icon { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 14px; }
            .brand-icon svg { width: 26px; height: 26px; }
            .brand-title { font-size: 1.1rem; }
            .brand-sub { font-size: 0.75rem; }

            .form-panel {
                flex: 1; margin: 28px 20px 32px; padding: 28px 20px 24px;
                border-radius: 16px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            }

            .form-title { font-size: 1.05rem; text-align: center; }
            .form-sub { text-align: center; margin-bottom: 16px; }

            .mui-field input { height: 48px; font-size: 0.88rem; }
            .btn-primary { height: 44px; font-size: 0.88rem; }
            .btn-send-code { width: 100px; height: 48px; font-size: 0.78rem; }
        }

        @media (min-width: 641px) and (max-width: 800px) {
            .reset-card { width: 100%; }
            .brand { width: 220px; }
            .form-panel { padding: 32px 28px 28px; }
        }
    </style>
</head>
<body>

<div class="reset-card">
    <!-- Brand Panel -->
    <div class="brand">
        <div class="brand-dots"></div>
        <div class="brand-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>
        <div class="brand-title">认证中心</div>
        <div class="brand-sub">找回密码</div>
    </div>

    <!-- Form Panel -->
    <div class="form-panel">
        <div class="form-title">找回密码</div>
        <div class="form-sub">通过手机号短信验证码重置密码</div>

        <!-- Step Bar -->
        <div class="step-bar">
            <div class="step-item active" id="step-ind-1">
                <div class="step-num">1</div>
                <span>验证手机</span>
            </div>
            <div class="step-line" id="step-line-1"></div>
            <div class="step-item" id="step-ind-2">
                <div class="step-num">2</div>
                <span>重置密码</span>
            </div>
            <div class="step-line" id="step-line-2"></div>
            <div class="step-item" id="step-ind-3">
                <div class="step-num">3</div>
                <span>完成</span>
            </div>
        </div>

        <!-- Global Error Alert -->
        <div class="alert alert-error" id="global-error" style="display:none;">
            <svg viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/>
            </svg>
            <span id="global-error-msg"></span>
        </div>

        <!-- ═══════ Step 1: Phone + Code ═══════ -->
        <div class="step-panel active" id="step-1">
            <!-- Phone -->
            <div class="mui-field">
                <input type="tel" id="reset-phone" placeholder=" " autocomplete="tel" maxlength="11">
                <label for="reset-phone">手机号</label>
                <span class="field-prefix">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path d="M7 2a2 2 0 00-2 2v12a2 2 0 002 2h6a2 2 0 002-2V4a2 2 0 00-2-2H7zm3 14a1 1 0 100-2 1 1 0 000 2z"/>
                    </svg>
                </span>
            </div>
            <div class="field-helper" id="reset-phone-error"></div>

            <!-- Code + Send Button -->
            <div class="code-row">
                <div class="mui-field">
                    <input type="text" id="reset-code" placeholder=" " autocomplete="one-time-code"
                           maxlength="6" inputmode="numeric">
                    <label for="reset-code">验证码</label>
                    <span class="field-prefix">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"/>
                        </svg>
                    </span>
                </div>
                <button type="button" class="btn-send-code" id="reset-send-btn">获取验证码</button>
            </div>
            <div class="field-helper" id="reset-code-error"></div>

            <button type="button" class="btn-primary" id="btn-next" style="margin-top: 10px;">下一步</button>
        </div>

        <!-- ═══════ Step 2: New Password ═══════ -->
        <div class="step-panel" id="step-2">
            <div class="mui-field">
                <input type="password" id="new-password" placeholder=" " autocomplete="new-password">
                <label for="new-password">新密码</label>
                <span class="field-prefix">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"/>
                    </svg>
                </span>
                <button type="button" class="field-suffix" id="pw-toggle-1" aria-label="显示/隐藏密码">
                    <svg id="eye-icon-1" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                        <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                </button>
            </div>
            <div class="field-helper" id="new-pw-error"></div>

            <div class="mui-field">
                <input type="password" id="confirm-password" placeholder=" " autocomplete="new-password">
                <label for="confirm-password">确认密码</label>
                <span class="field-prefix">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"/>
                    </svg>
                </span>
            </div>
            <div class="field-helper" id="confirm-pw-error"></div>

            <button type="button" class="btn-primary" id="btn-reset" style="margin-top: 10px;">重置密码</button>
        </div>

        <!-- ═══════ Step 3: Success ═══════ -->
        <div class="step-panel" id="step-3">
            <div class="success-icon">
                <svg viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                </svg>
            </div>
            <div class="success-text">密码重置成功</div>
            <div class="success-hint">请使用新密码登录</div>
            <a th:href="@{/login}" class="btn-primary" style="display:block;text-align:center;text-decoration:none;line-height:46px;">返回登录</a>
        </div>

        <div class="back-link">
            <a th:href="@{/login}">&larr; 返回登录</a>
        </div>
    </div>
</div>

<script>
(function () {
    var phoneInput = document.getElementById('reset-phone');
    var codeInput = document.getElementById('reset-code');
    var phoneError = document.getElementById('reset-phone-error');
    var codeError = document.getElementById('reset-code-error');
    var sendBtn = document.getElementById('reset-send-btn');
    var btnNext = document.getElementById('btn-next');
    var btnReset = document.getElementById('btn-reset');
    var newPwInput = document.getElementById('new-password');
    var confirmPwInput = document.getElementById('confirm-password');
    var newPwError = document.getElementById('new-pw-error');
    var confirmPwError = document.getElementById('confirm-pw-error');
    var globalError = document.getElementById('global-error');
    var globalErrorMsg = document.getElementById('global-error-msg');

    var phoneRegex = /^1[3-9]\d{9}$/;
    var errorSvg = '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/></svg>';

    function setError(input, helperEl, msg) {
        input.classList.add('is-error');
        helperEl.innerHTML = msg ? errorSvg + msg : '';
    }

    function clearError(input, helperEl) {
        input.classList.remove('is-error');
        helperEl.innerHTML = '';
    }

    function showGlobalError(msg) {
        globalErrorMsg.textContent = msg;
        globalError.style.display = 'flex';
    }

    function hideGlobalError() {
        globalError.style.display = 'none';
    }

    /* ── Step Navigation ── */
    function goToStep(step) {
        document.querySelectorAll('.step-panel').forEach(function (p) { p.classList.remove('active'); });
        document.getElementById('step-' + step).classList.add('active');

        for (var i = 1; i <= 3; i++) {
            var ind = document.getElementById('step-ind-' + i);
            ind.classList.remove('active', 'done');
            if (i < step) ind.classList.add('done');
            else if (i === step) ind.classList.add('active');
        }
        for (var j = 1; j <= 2; j++) {
            var line = document.getElementById('step-line-' + j);
            line.classList.toggle('done', j < step);
        }
        hideGlobalError();
    }

    /* ── Phone Input ── */
    phoneInput.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 11);
        if (phoneRegex.test(this.value)) clearError(this, phoneError);
    });

    codeInput.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 6);
        if (this.value.length > 0) clearError(this, codeError);
    });

    /* ── Send Code with Countdown ── */
    var countdown = 0;
    var countdownTimer = null;

    function startCountdown() {
        countdown = 60;
        sendBtn.disabled = true;
        sendBtn.textContent = countdown + 's';
        countdownTimer = setInterval(function () {
            countdown--;
            if (countdown <= 0) {
                clearInterval(countdownTimer);
                sendBtn.disabled = false;
                sendBtn.textContent = '获取验证码';
            } else {
                sendBtn.textContent = countdown + 's';
            }
        }, 1000);
    }

    sendBtn.addEventListener('click', function () {
        var phone = phoneInput.value.trim();
        if (!phoneRegex.test(phone)) {
            setError(phoneInput, phoneError, '请输入正确的手机号');
            return;
        }
        clearError(phoneInput, phoneError);
        hideGlobalError();
        sendBtn.disabled = true;
        sendBtn.textContent = '发送中...';

        fetch('/sms/code/reset?phone=' + encodeURIComponent(phone), { method: 'POST' })
            .then(function (resp) {
                if (resp.ok) {
                    startCountdown();
                } else {
                    return resp.json().then(function (data) {
                        throw new Error(data.message || '发送失败');
                    });
                }
            })
            .catch(function (err) {
                showGlobalError(err.message || '发送失败，请稍后重试');
                sendBtn.disabled = false;
                sendBtn.textContent = '获取验证码';
            });
    });

    /* ── Step 1 → Step 2 ── */
    btnNext.addEventListener('click', function () {
        var valid = true;
        if (!phoneRegex.test(phoneInput.value.trim())) {
            setError(phoneInput, phoneError, '请输入正确的手机号');
            valid = false;
        }
        if (!codeInput.value.trim()) {
            setError(codeInput, codeError, '请输入验证码');
            valid = false;
        }
        if (valid) goToStep(2);
    });

    /* ── Password Toggle ── */
    var pwToggle = document.getElementById('pw-toggle-1');
    var eyeIcon = document.getElementById('eye-icon-1');
    var eyeOpen = '<path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"/>';
    var eyeClosed = '<path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z"/><path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/>';

    pwToggle.addEventListener('click', function () {
        if (newPwInput.type === 'password') {
            newPwInput.type = 'text';
            eyeIcon.innerHTML = eyeClosed;
        } else {
            newPwInput.type = 'password';
            eyeIcon.innerHTML = eyeOpen;
        }
    });

    newPwInput.addEventListener('input', function () {
        if (this.value) clearError(this, newPwError);
    });

    confirmPwInput.addEventListener('input', function () {
        if (this.value) clearError(this, confirmPwError);
    });

    /* ── Step 2: Reset Password ── */
    btnReset.addEventListener('click', function () {
        hideGlobalError();
        var valid = true;
        var pw = newPwInput.value;
        var cpw = confirmPwInput.value;

        if (!pw || pw.length < 6) {
            setError(newPwInput, newPwError, '密码长度不少于6位');
            valid = false;
        }
        if (pw !== cpw) {
            setError(confirmPwInput, confirmPwError, '两次输入的密码不一致');
            valid = false;
        }
        if (!valid) return;

        btnReset.disabled = true;
        btnReset.textContent = '提交中...';

        fetch('/accounts/password/reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                phone: phoneInput.value.trim(),
                code: codeInput.value.trim(),
                newPassword: pw
            })
        })
        .then(function (resp) {
            if (resp.ok || resp.status === 204) {
                goToStep(3);
            } else {
                return resp.json().then(function (data) {
                    throw new Error(data.message || '重置失败');
                });
            }
        })
        .catch(function (err) {
            showGlobalError(err.message || '重置失败，请稍后重试');
            btnReset.disabled = false;
            btnReset.textContent = '重置密码';
        });
    });
}());
</script>
</body>
</html>
