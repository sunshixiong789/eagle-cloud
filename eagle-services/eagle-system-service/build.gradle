
dependencies {
    implementation project(':eagle-starter:eagle-data-jpa-starter')
    implementation project(':eagle-starter:eagle-resource-server-starter')
    implementation project(':eagle-starter:eagle-websocket-starter')
    implementation project(':eagle-starter:eagle-amqp-starter')
    implementation project(':eagle-starter:eagle-resilience-starter')
    implementation project(':eagle-starter:eagle-oss-minio-starter')
    implementation project(':eagle-starter:eagle-openapi-starter')
    implementation project(':eagle-starter:eagle-audit-log-starter')
    // 跨服务同步调用:通过 lb://auth 访问 auth-service 内部 API
    implementation project(':eagle-starter:eagle-restclient-starter')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    // PostgreSQL JDBC 驱动由 eagle-data-jpa-starter 通过 runtimeOnly 传递引入。
    // Schema 暂由 Hibernate ddl-auto=update 同步;Flyway 后期统一引入。

    // Nacos 服务注册与发现
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'

    implementation "com.github.ben-manes.caffeine:caffeine"
    implementation "org.apache.poi:poi-ooxml"


    // 本地开发:自动加载项目根目录的 .env.prod 文件到 Spring Environment
    runtimeOnly 'me.paulschwarz:spring-dotenv:5.1.0'


    // Spring Modulith
    // compileOnly:仅编译期可见,@Modulithic/@ApplicationModule/@NamedInterface 注解使用
    compileOnly 'org.springframework.modulith:spring-modulith-core'
    // spring-modulith-starter-test 提供 ApplicationModules、Documenter 等测试工具
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5'
}

// 集成事件契约文件由 auth-service 的 IntegrationEventContractTest 生成。
// 声明为测试输入,否则契约变了 Gradle 仍判 UP-TO-DATE 跳过校验（契约漂移就漏网了）。
tasks.named('test') {
    def contractsDir = rootProject.file('docs/contracts')
    if (contractsDir.exists()) {
        inputs.dir(contractsDir)
                .withPropertyName('integrationEventContracts')
                .withPathSensitivity(PathSensitivity.RELATIVE)
    }
}
