# -------- 线上部署:应用层 (auth / system / gateway) ----------
#
# 本文件**只部署无状态 / 轻状态应用**;有状态基础设施(PG / Redis / Nacos / RocketMQ)
# **不**在本文件,理由见下方"为什么不用 docker 跑基础设施"。
#
# 配套外部基础设施清单(必须在启动前准备好,通过 .env.prod 把端点 / 凭据写进对应 *_HOST / *_PASSWORD):
#   ┌──────────────┬──────────────────────────────────────────────────────────────┐
#   │ PostgreSQL16+│ 阿里云 RDS for PostgreSQL / 腾讯云 TDSQL-PG / 自建 Patroni    │
#   │ Redis 7+     │ 阿里云 Tair / 腾讯云 Redis / 自建 Sentinel 或 Cluster        │
#   │ Nacos 3.x    │ 阿里云 MSE Nacos / 3 节点集群 + MySQL 后端 (config 持久化)     │
#   │ RocketMQ 5.x │ 阿里云 MQ / 腾讯云 TDMQ-RocketMQ / K8s + RocketMQ Operator   │
#   │ MinIO / OSS  │ 阿里云 OSS / 腾讯云 COS / 自建 MinIO 集群(4+ 节点 EC 模式)    │
#   └──────────────┴──────────────────────────────────────────────────────────────┘
#
# ── 为什么不建议用单机 docker 跑这些基础设施(避免下次又被加回来)──
#
#   1. 数据持久化:named volume 绑定在宿主机磁盘;宿主机盘故障 = 数据全丢。
#      托管服务: 多副本 + PITR + 跨可用区备份,RPO 通常 ≤ 5 分钟。
#
#   2. 高可用:PG streaming replication / Redis Sentinel / Nacos raft / RocketMQ DLedger
#      都要多节点协同;单机 docker 跑等于"高可用协议假装在运行",真宕机就完蛋。
#
#   3. 性能:大页内存 / 网络栈 / IO scheduler / NUMA 绑核等 OS 级调优在容器化场景损失 5~20%,
#      对吞吐 / 延迟敏感的有状态服务尤其明显。
#
#   4. 备份恢复:托管自带 PITR / 快照 / 跨区域备份;docker 自建要自己维护 wal-g / restic /
#      RocketMQ 异地灾备,出事时回滚链路极长。
#
#   5. 升级:托管支持小版本滑动升级 + 跨大版本迁移工具;docker 自建大概率要停机 + 手工迁数据。
#
#   6. 监控:托管自带控制台 / 慢日志 / 自动告警;docker 自建要自搭 Prometheus + Grafana +
#      Alertmanager,且容易和应用监控混在一起。
#
#   Sentinel Dashboard 已移至 docker-compose.middleware.yml(与 Redis/Nacos/RocketMQ 同机),
#   本文件不再包含它;gateway 通过 SENTINEL_DASHBOARD 环境变量指向其地址即可。
#
# ── env 文件(prod 自包含,与 dev 完全独立)──
#   .env.prod —— prod 全套值 + 机密(外部端点/凭据/对外 URL),gitignore
#   首次部署:cp .env.prod.example .env.prod,把外部基础设施端点 / 凭据填进去
#
# ── 启动(命令行)──
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   IDEA 一键:Docker Compose 运行配置里 Compose files=docker-compose.prod.yml,
#             Environment variables file=.env.prod,点绿三角即部署
#
# ── 灰度 / 滚动单服务(env 文件照样要带)──
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps --build auth
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps --build system
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps --build gateway
#
# ── staging / PoC 想在单机自建基础设施 ──
#   不要改本文件;直接复用 docker-compose.yml(开发本地配置),把 mem_limit / JVM 拉大即可。
#   但**仍不建议**对其打线上流量。
#
# ─── 容量标定：目标峰值合计 1000~3000 QPS（约对应 10 万在线 / DAU）────────────
#
# 三个服务的流量画像**完全不同**，资源不能按"看起来重要"平均分：
#
#   gateway  看到 **100% 的流量**（后端各服务只看到自己那一片），是全链路 QPS 最高的组件。
#            但它是 WebFlux / Netty，少量 event loop 线程处理全部连接，
#            **主要工作内存在堆外（PooledByteBufAllocator 的 direct buffer）而不是堆**。
#            → 堆压小（40%）、direct 放大（640M）。容器 1536m → 2g。
#
#   auth     只处理登录 / token 刷新 —— 各资源服务器用 JWKS **本地**验签，
#            不会每个请求都打过来。10 万 DAU 对应峰值大约 50~200 QPS，是低负载服务。
#            → 容器 2560m → 2g（原本给多了），Hikari 20 绰绰有余。
#
#   system   后台管理端 HTTP 的 QPS 只有几十，真正吃资源的是 **C 端 App 的 WebSocket
#            长连接**（/ws-stomp，经 gateway 的 /system/ws-stomp 转发）。
#            → 容器保持 4g，堆 2g；每条 WS 约 30~50 KB 堆，够到约 2~3 万同时在线。
#
# 【三个此前都存在的隐患，已修】
#   1. MaxDirectMemorySize 全都没设 —— 不设时默认等于 -Xmx，堆外无上限。
#      对 gateway 这种 Netty 组件尤其致命：1536m 容器里 -Xmx1g 意味着 direct 也可以涨到 1g，
#      加上 metaspace 320m 必然先被 OOMKilled。现三个服务都显式封顶。
#   2. 内存预算超配 —— 例如 auth 原来是 2560m 容器里 -Xmx2g + metaspace 384m = 2432m，
#      留给 code cache / direct / 线程栈 / JVM 自身的空间几乎为零。
#   3. WebSocket 连接数硬墙 —— server.tomcat.max-connections 默认 8192，与内存无关。
#      已在 system 的 application.yml 抬到 20000，并配套 ulimits.nofile=65536
#      （每条连接一个 fd，Docker 默认 1024 会先撞 "Too many open files"）。
#
# 预算核对（上限值，实测常驻远低于此）：
#   auth    堆1024 + meta256 + code96  + direct128 + JVM~100 = 1604 ≤ 2048
#   system  堆2048 + meta384 + code128 + direct512 + JVM~100 = 3172 ≤ 4096
#   gateway 堆 819 + meta256 + code128 + direct640 + JVM~100 = 1943 ≤ 2048
#
# 调参不必改镜像：覆盖 AUTH_JAVA_OPTS / SYSTEM_JAVA_OPTS / GATEWAY_JAVA_OPTS，
# 或用镜像内的 JAVA_OPTS_APPEND 追加单项；连接数用 TOMCAT_MAX_CONNECTIONS。
# 压测口径：docker stats 看 RSS；容器内 jcmd <pid> VM.native_memory summary
# （镜像已保留 jdk.jcmd 模块）看堆/metaspace/code cache/**direct** 的实际分布。
# gateway 重点盯 direct，system 重点盯堆与当前 WS 连接数。

name: eagle-prod

networks:
  # external: true → 期望基础设施侧已经创建好同名网络,应用层加入即可;
  # 若基础设施也在本机 docker(不推荐),启动时改成 driver: bridge 即可。
  eagle-network:
    name: eagle-network
    driver: bridge

volumes:
  auth-logs:
  system-logs:
  gateway-logs:
  # 本地文件存储持久化(system-service 上传文件落盘目录,对应 Dockerfile 的 /data/eagle/storage)。
  # 命名卷首次创建时会继承镜像内该目录的 spring:spring owner,故非 root 用户可写。
  system-storage:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "10"

services:
  # 认证服务 (OAuth2 Authorization Server)
  # 基础设施依赖: PG (eagle_auth 库) / Redis / Nacos / RocketMQ 全部走 .env.prod.prod 配置的外部端点
  auth:
    build:
      context: ./eagle-auth-service
      dockerfile: Dockerfile
    image: eagle-auth:${EAGLE_IMAGE_TAG:-1.0.0}
    pull_policy: build
    container_name: eagle-auth
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - eagle-network
    mem_limit: 2g
    mem_reservation: 1g
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SERVER_PORT=${AUTH_SERVER_PORT:-9090}
      # Nacos (外部集群端点,无默认值 → fail-fast)
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:?NACOS_SERVER_ADDR must be set in .env.prod.prod}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-}
      - NACOS_GROUP=${NACOS_GROUP:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME must be set in .env.prod.prod}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD must be set in .env.prod.prod}
      - NACOS_REGISTER_IP=${NACOS_REGISTER_IP:-}
      # PostgreSQL (外部 RDS,auth 用独立库 eagle_auth)
      - DB_HOST=${DB_HOST:?DB_HOST must be set in .env.prod.prod}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${AUTH_DB_NAME:-eagle_auth}
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME must be set in .env.prod.prod}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env.prod.prod}
      - DB_POOL_MAX=${DB_POOL_MAX:-80}
      - DB_POOL_MIN=${DB_POOL_MIN:-20}
      # Redis (外部托管)
      - REDIS_HOST=${REDIS_HOST:?REDIS_HOST must be set in .env.prod.prod}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod.prod}
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
      - REDIS_POOL_MAX_ACTIVE=${REDIS_POOL_MAX_ACTIVE:-96}
      - REDIS_POOL_MAX_IDLE=${REDIS_POOL_MAX_IDLE:-32}
      - REDIS_POOL_MIN_IDLE=${REDIS_POOL_MIN_IDLE:-8}
      - REDIS_POOL_MAX_WAIT=${REDIS_POOL_MAX_WAIT:-2000ms}
      # RocketMQ 5.x gRPC → Proxy:8081 (外部托管)
      - ROCKETMQ_ENDPOINTS=${ROCKETMQ_ENDPOINTS:?ROCKETMQ_ENDPOINTS must be set in .env.prod.prod}
      - ROCKETMQ_TOPIC_ENV_PREFIX=${ROCKETMQ_TOPIC_ENV_PREFIX:-prod_}
      # 初始管理员
      - EAGLE_ADMIN_USERNAME=${EAGLE_ADMIN_USERNAME:-admin}
      - EAGLE_ADMIN_PASSWORD=${EAGLE_ADMIN_PASSWORD:?EAGLE_ADMIN_PASSWORD must be set in .env.prod.prod}
      - EAGLE_ADMIN_NAME=${EAGLE_ADMIN_NAME:-系统管理员}
      - EAGLE_ADMIN_EMAIL=${EAGLE_ADMIN_EMAIL:-admin@eagle.com}
      # JWT keystore
      - EAGLE_JWT_KEYSTORE_LOCATION=${EAGLE_JWT_KEYSTORE_LOCATION:-classpath:jwt-keystore.p12}
      - EAGLE_JWT_KEYSTORE_PASSWORD=${EAGLE_JWT_KEYSTORE_PASSWORD:?EAGLE_JWT_KEYSTORE_PASSWORD must be set in .env.prod.prod}
      # OAuth2: iss claim + 回调白名单 + RP-Initiated Logout 白名单
      - EAGLE_OAUTH_ISSUER=${EAGLE_OAUTH_ISSUER:?EAGLE_OAUTH_ISSUER must be set in .env.prod.prod}
      - EAGLE_OAUTH_REDIRECT_URIS=${EAGLE_OAUTH_REDIRECT_URIS:?EAGLE_OAUTH_REDIRECT_URIS must be set in .env.prod.prod}
      - EAGLE_OAUTH_POST_LOGOUT_REDIRECT_URIS=${EAGLE_OAUTH_POST_LOGOUT_REDIRECT_URIS:?EAGLE_OAUTH_POST_LOGOUT_REDIRECT_URIS must be set in .env.prod.prod}
      # 第三方登录 (留空 = 禁用)
      - WECHAT_APP_APP_ID=${WECHAT_APP_APP_ID:-}
      - WECHAT_APP_APP_SECRET=${WECHAT_APP_APP_SECRET:-}
      - WECHAT_MINI_APP_ID=${WECHAT_MINI_APP_ID:-}
      - WECHAT_MINI_APP_SECRET=${WECHAT_MINI_APP_SECRET:-}
      - WECHAT_WEB_APP_ID=${WECHAT_WEB_APP_ID:-}
      - WECHAT_WEB_APP_SECRET=${WECHAT_WEB_APP_SECRET:-}
      - WECHAT_WEB_REDIRECT_URI=${WECHAT_WEB_REDIRECT_URI:-}
      - WECHAT_MP_APP_ID=${WECHAT_MP_APP_ID:-}
      - WECHAT_MP_APP_SECRET=${WECHAT_MP_APP_SECRET:-}
      - WECHAT_MP_REDIRECT_URI=${WECHAT_MP_REDIRECT_URI:-}
      # 淘宝登录（taobao_app grant）：enabled=true 才装配 TaobaoClient，用 access token 调 taobao.openuid.get 取 openUid
      - TAOBAO_APP_ENABLED=${TAOBAO_APP_ENABLED:-false}
      - TAOBAO_APP_KEY=${TAOBAO_APP_KEY:-}
      - TAOBAO_APP_SECRET=${TAOBAO_APP_SECRET:-}
      - TAOBAO_APP_SIGN_METHOD=${TAOBAO_APP_SIGN_METHOD:-md5}
      # Apple 登录：私钥与 refresh token 加密密钥必须来自 Secret / .env.prod（不进镜像）
      - APPLE_AUTH_ENABLED=${APPLE_AUTH_ENABLED:-false}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-com.shengxinfast.app}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY:-}
      - EAGLE_ENCRYPT_SECRET_KEY=${EAGLE_ENCRYPT_SECRET_KEY:-}
      # App Store 审核固定验证码：SMS_MOCK_PHONES 填审核测试手机号（逗号分隔），白名单内不发真实短信，直接用 SMS_MOCK_CODE 登录；留空 = 关闭
      - SMS_MOCK_CODE=${SMS_MOCK_CODE:-123456}
      - SMS_MOCK_PHONES=${SMS_MOCK_PHONES:-}
      # 短信
      - SMS_PROVIDER=${SMS_PROVIDER:-hnsls}
      - SMS_ACCESS_KEY_ID=${SMS_ACCESS_KEY_ID:-}
      - SMS_ACCESS_KEY_SECRET=${SMS_ACCESS_KEY_SECRET:-}
      - SMS_SIGN_NAME=${SMS_SIGN_NAME:-}
      - SMS_TEMPLATE_ID=${SMS_TEMPLATE_ID:-}
      - TENCENT_SMS_SDK_APP_ID=${TENCENT_SMS_SDK_APP_ID:-}
      - TENCENT_SMS_REGION=${TENCENT_SMS_REGION:-ap-guangzhou}
      - HNSLS_SMS_USERNAME=${HNSLS_SMS_USERNAME:-}
      - HNSLS_SMS_PASSWORD=${HNSLS_SMS_PASSWORD:-}
      - HNSLS_SMS_CONTENT_TEMPLATE=${HNSLS_SMS_CONTENT_TEMPLATE:-您的验证码是{code}，5分钟内有效。}
      - HNSLS_SMS_SEND_URL=${HNSLS_SMS_SEND_URL:-https://xapi.hnsls.com.cn/eums/sms/utf8/send.do}
      - HNSLS_SMS_CHARSET=${HNSLS_SMS_CHARSET:-UTF-8}
      - JAVA_OPTS=${AUTH_JAVA_OPTS:--server -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=25.0 -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=128m -Xss768k -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:ParallelGCThreads=4 -XX:ConcGCThreads=1 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - auth-logs:/app/logs
    logging: *default-logging
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # 系统服务
  # 基础设施依赖: PG (eagle_system 库) / Redis / Nacos / RocketMQ 走 .env.prod.prod 配置的外部端点
  system:
    build:
      context: ./eagle-system-service
      dockerfile: Dockerfile
    image: eagle-system:${EAGLE_IMAGE_TAG:-1.0.0}
    pull_policy: build
    container_name: eagle-system
    # WebSocket 长连接每条占一个 fd。Docker 默认 nofile 通常 1024，
    # 远低于 server.tomcat.max-connections=20000，不抬高会先撞 "Too many open files"。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    ports:
      - "8082:8082"
    networks:
      - eagle-network
    mem_limit: 4g
    mem_reservation: 2g
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SERVER_PORT=${SERVER_PORT:-8082}
      # Nacos
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:?NACOS_SERVER_ADDR must be set in .env.prod.prod}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-}
      - NACOS_GROUP=${NACOS_GROUP:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME must be set in .env.prod.prod}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD must be set in .env.prod.prod}
      - NACOS_REGISTER_IP=${NACOS_REGISTER_IP:-}
      # PostgreSQL
      - DB_HOST=${DB_HOST:?DB_HOST must be set in .env.prod.prod}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-eagle_system}
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME must be set in .env.prod.prod}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env.prod.prod}
      - DB_POOL_MAX=${DB_POOL_MAX:-80}
      - DB_POOL_MIN=${DB_POOL_MIN:-20}
      # Redis
      - REDIS_HOST=${REDIS_HOST:?REDIS_HOST must be set in .env.prod.prod}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod.prod}
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
      - REDIS_POOL_MAX_ACTIVE=${REDIS_POOL_MAX_ACTIVE:-96}
      - REDIS_POOL_MAX_IDLE=${REDIS_POOL_MAX_IDLE:-32}
      - REDIS_POOL_MIN_IDLE=${REDIS_POOL_MIN_IDLE:-8}
      - REDIS_POOL_MAX_WAIT=${REDIS_POOL_MAX_WAIT:-2000ms}
      # RocketMQ
      - ROCKETMQ_ENDPOINTS=${ROCKETMQ_ENDPOINTS:?ROCKETMQ_ENDPOINTS must be set in .env.prod.prod}
      - ROCKETMQ_TOPIC_ENV_PREFIX=${ROCKETMQ_TOPIC_ENV_PREFIX:-prod_}
      # 初始管理员 username (与 auth 共用同一值)
      - EAGLE_ADMIN_USERNAME=${EAGLE_ADMIN_USERNAME:-admin}
      # JWT keystore
      - EAGLE_JWT_KEYSTORE_LOCATION=${EAGLE_JWT_KEYSTORE_LOCATION:-classpath:jwt-keystore.p12}
      - EAGLE_JWT_KEYSTORE_PASSWORD=${EAGLE_JWT_KEYSTORE_PASSWORD:?EAGLE_JWT_KEYSTORE_PASSWORD must be set in .env.prod.prod}
      # OAuth2
      - EAGLE_OAUTH_ISSUER=${EAGLE_OAUTH_ISSUER:?EAGLE_OAUTH_ISSUER must be set in .env.prod.prod}
      - EAGLE_OAUTH_REDIRECT_URIS=${EAGLE_OAUTH_REDIRECT_URIS:?EAGLE_OAUTH_REDIRECT_URIS must be set in .env.prod.prod}
      - EAGLE_OAUTH_POST_LOGOUT_REDIRECT_URIS=${EAGLE_OAUTH_POST_LOGOUT_REDIRECT_URIS:?EAGLE_OAUTH_POST_LOGOUT_REDIRECT_URIS must be set in .env.prod.prod}
      # JWKS 直连 auth-service,绕过 OIDC discovery
      - EAGLE_OAUTH_JWK_SET_URI=${EAGLE_OAUTH_JWK_SET_URI:-http://auth:9090/oauth2/jwks}
      # 第三方登录
      - WECHAT_MINI_APP_ID=${WECHAT_MINI_APP_ID:-}
      - WECHAT_MINI_APP_SECRET=${WECHAT_MINI_APP_SECRET:-}
      - WECHAT_WEB_APP_ID=${WECHAT_WEB_APP_ID:-}
      - WECHAT_WEB_APP_SECRET=${WECHAT_WEB_APP_SECRET:-}
      - WECHAT_WEB_REDIRECT_URI=${WECHAT_WEB_REDIRECT_URI:-}
      - WECHAT_MP_APP_ID=${WECHAT_MP_APP_ID:-}
      - WECHAT_MP_APP_SECRET=${WECHAT_MP_APP_SECRET:-}
      - WECHAT_MP_REDIRECT_URI=${WECHAT_MP_REDIRECT_URI:-}
      # 短信
      - SMS_PROVIDER=${SMS_PROVIDER:-hnsls}
      - SMS_ACCESS_KEY_ID=${SMS_ACCESS_KEY_ID:-}
      - SMS_ACCESS_KEY_SECRET=${SMS_ACCESS_KEY_SECRET:-}
      - SMS_SIGN_NAME=${SMS_SIGN_NAME:-}
      - SMS_TEMPLATE_ID=${SMS_TEMPLATE_ID:-}
      - HNSLS_SMS_USERNAME=${HNSLS_SMS_USERNAME:-}
      - HNSLS_SMS_PASSWORD=${HNSLS_SMS_PASSWORD:-}
      - HNSLS_SMS_CONTENT_TEMPLATE=${HNSLS_SMS_CONTENT_TEMPLATE:-您的验证码是{code}，5分钟内有效。}
      - HNSLS_SMS_SEND_URL=${HNSLS_SMS_SEND_URL:-https://xapi.hnsls.com.cn/eums/sms/utf8/send.do}
      - HNSLS_SMS_CHARSET=${HNSLS_SMS_CHARSET:-UTF-8}
      - JAVA_OPTS=${SYSTEM_JAVA_OPTS:--server -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=25.0 -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:MaxDirectMemorySize=512m -Xss768k -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:ParallelGCThreads=4 -XX:ConcGCThreads=1 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - system-logs:/app/logs
      - system-storage:/data/eagle/storage
    logging: *default-logging
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # 网关 — 唯一公网入口 0.0.0.0:8080,前面应该再叠一层 nginx / SLB / WAF
  gateway:
    build:
      context: ./eagle-gateway-service
      dockerfile: Dockerfile
    image: eagle-gateway:${EAGLE_IMAGE_TAG:-1.0.0}
    pull_policy: build
    container_name: eagle-gateway
    # 网关侧每条客户端 WS 连接还要再开一条到 system 的上游连接，fd 需求约翻倍。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - eagle-network
    mem_limit: 2g
    mem_reservation: 1g
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:?NACOS_SERVER_ADDR must be set in .env.prod.prod}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-}
      - NACOS_GROUP=${NACOS_GROUP:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME must be set in .env.prod.prod}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD must be set in .env.prod.prod}
      - NACOS_REGISTER_IP=${NACOS_REGISTER_IP:-}
      - AUTH_SERVER_URL=${AUTH_SERVER_URL:-http://auth:9090}
      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD:-sentinel-dashboard:8858}
      - EAGLE_GATEWAY_SENTINEL_ENABLED=${EAGLE_GATEWAY_SENTINEL_ENABLED:-true}
      - EAGLE_SENTINEL_GLOBAL_QPS=${EAGLE_SENTINEL_GLOBAL_QPS:-3600}
      - EAGLE_SENTINEL_GLOBAL_BURST=${EAGLE_SENTINEL_GLOBAL_BURST:-600}
      - EAGLE_SENTINEL_AUTH_QPS=${EAGLE_SENTINEL_AUTH_QPS:-1200}
      - EAGLE_SENTINEL_AUTH_BURST=${EAGLE_SENTINEL_AUTH_BURST:-200}
      - EAGLE_SENTINEL_SMS_QPS=${EAGLE_SENTINEL_SMS_QPS:-120}
      - EAGLE_SENTINEL_SMS_BURST=${EAGLE_SENTINEL_SMS_BURST:-30}
      - ROCKETMQ_NAME_SERVER=${ROCKETMQ_NAME_SERVER:?ROCKETMQ_NAME_SERVER must be set in .env.prod.prod}
      # 生产 CORS 不允许通配符:必须显式列出业务前端域名
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in .env.prod.prod (no wildcard allowed)}
      - JAVA_OPTS=${GATEWAY_JAVA_OPTS:--server -XX:+UseContainerSupport -XX:MaxRAMPercentage=40.0 -XX:InitialRAMPercentage=20.0 -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:MaxDirectMemorySize=640m -Xss768k -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:ParallelGCThreads=4 -XX:ConcGCThreads=1 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - gateway-logs:/app/logs
    logging: *default-logging
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
