// 单体启动模块：复用 eagle-system-service 全部业务代码（认证 / 用户 / 角色 / 菜单 / 权限 等），
// 排除 Nacos / 微服务专属传递依赖，下游用户拿到即可作为单体应用启动。
dependencies {
    implementation(project(':eagle-services:eagle-system-service')) {
        // Nacos 服务发现：单体不需要注册中心
        exclude group: 'com.alibaba.cloud', module: 'spring-cloud-starter-alibaba-nacos-discovery'
    }
    // 启动类需直接使用 @EntityScan / @EnableJpaRepositories 显式声明跨包扫描
    // （system-service 以 implementation 引入 JPA starter，传递依赖在 monolith 编译期不可见）
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
}
