# ===========================================
# Eagle monolith baseline configuration
# No profile is activated here. Use SPRING_PROFILES_ACTIVE:
#   local             -> H2 + Caffeine
#   prod,mysql        -> MySQL + Redis
#   prod,postgresql   -> PostgreSQL + Redis
# ===========================================

server:
  port: ${SERVER_PORT:80}
  shutdown: graceful
  forward-headers-strategy: framework
spring:
  application:
    name: eagle-monolith
  lifecycle:
    timeout-per-shutdown-phase: 30s
  sql:
    init:
      mode: never
      continue-on-error: false
  jpa:
    open-in-view: false
  profiles:
    active: h2
eagle:
  jwt:
    keystore-location: ${EAGLE_JWT_KEYSTORE_LOCATION:classpath:jwt-keystore.p12}
    keystore-password: ${EAGLE_JWT_KEYSTORE_PASSWORD}
    key-alias: ${EAGLE_JWT_KEY_ALIAS:eagle-jwt}

  websocket:
    endpoint: ${EAGLE_WEBSOCKET_ENDPOINT:/ws-stomp}
    app-prefix: ${EAGLE_WEBSOCKET_APP_PREFIX:/message}
    topic-prefix: ${EAGLE_WEBSOCKET_TOPIC_PREFIX:/topic}
    user-prefix: ${EAGLE_WEBSOCKET_USER_PREFIX:/user}

  admin:
    username: ${EAGLE_ADMIN_USERNAME:admin}
    password: ${EAGLE_ADMIN_PASSWORD}
    name: ${EAGLE_ADMIN_NAME:System Administrator}
    email: ${EAGLE_ADMIN_EMAIL:admin@eagle.com}
    phone: ${EAGLE_ADMIN_PHONE:}

  oauth:
    issuer: ${EAGLE_OAUTH_ISSUER:http://localhost:80}
    default-client:
      enabled: ${EAGLE_OAUTH_WEB_CLIENT_ENABLED:true}
      sync-mode: ${EAGLE_OAUTH_WEB_CLIENT_SYNC_MODE:OVERWRITE}
      client-id: ${EAGLE_OAUTH_WEB_CLIENT_ID:eagleWeb}
      client-name: ${EAGLE_OAUTH_WEB_CLIENT_NAME:Eagle Web}
      client-authentication-methods: ${EAGLE_OAUTH_WEB_CLIENT_AUTH_METHODS:none}
      authorization-grant-types: ${EAGLE_OAUTH_WEB_CLIENT_GRANT_TYPES:authorization_code,refresh_token,wechat_mini_program,sms_code,phone_one_click}
      redirect-uris: ${EAGLE_OAUTH_REDIRECT_URIS:http://localhost:8080/auth/oauth2/callback,http://localhost:80/swagger-ui/oauth2-redirect.html,http://localhost:8000/auth/oauth2/callback}
      post-logout-redirect-uris: ${EAGLE_OAUTH_POST_LOGOUT_REDIRECT_URIS:http://localhost:8000/auth/oauth2/logout/callback}
      scopes: ${EAGLE_OAUTH_WEB_CLIENT_SCOPES:openid,profile,email,address,phone}
      require-proof-key: ${EAGLE_OAUTH_WEB_CLIENT_REQUIRE_PKCE:true}
      require-authorization-consent: ${EAGLE_OAUTH_WEB_CLIENT_REQUIRE_CONSENT:false}
      access-token-ttl-seconds: ${EAGLE_OAUTH_ACCESS_TOKEN_TTL_SECONDS:3600}
      refresh-token-ttl-seconds: ${EAGLE_OAUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
    app-client:
      enabled: ${EAGLE_OAUTH_APP_CLIENT_ENABLED:true}
      sync-mode: ${EAGLE_OAUTH_APP_CLIENT_SYNC_MODE:OVERWRITE}
      client-id: ${EAGLE_OAUTH_APP_CLIENT_ID:eagleApp}
      client-name: ${EAGLE_OAUTH_APP_CLIENT_NAME:Eagle App}
      client-authentication-methods: ${EAGLE_OAUTH_APP_CLIENT_AUTH_METHODS:none}
      authorization-grant-types: ${EAGLE_OAUTH_APP_CLIENT_GRANT_TYPES:refresh_token,sms_code,wechat_app,wechat_mini_program,phone_one_click}
      redirect-uris: ${EAGLE_OAUTH_APP_REDIRECT_URIS:}
      scopes: ${EAGLE_OAUTH_APP_CLIENT_SCOPES:openid,profile,email,address,phone}
      require-proof-key: ${EAGLE_OAUTH_APP_CLIENT_REQUIRE_PKCE:false}
      require-authorization-consent: ${EAGLE_OAUTH_APP_CLIENT_REQUIRE_CONSENT:false}
      access-token-ttl-seconds: ${EAGLE_OAUTH_ACCESS_TOKEN_TTL_SECONDS:3600}
      refresh-token-ttl-seconds: ${EAGLE_OAUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}

  wechat:
    app:
      app-id: ${WECHAT_APP_APP_ID:}
      app-secret: ${WECHAT_APP_APP_SECRET:}
    mini-program:
      app-id: ${WECHAT_MINI_APP_ID:}
      app-secret: ${WECHAT_MINI_APP_SECRET:}
    web:
      pc:
        app-id: ${WECHAT_WEB_APP_ID:}
        app-secret: ${WECHAT_WEB_APP_SECRET:}
        redirect-uri: ${WECHAT_WEB_REDIRECT_URI:http://localhost/login/wechat/pc/callback}
      h5:
        app-id: ${WECHAT_MP_APP_ID:}
        app-secret: ${WECHAT_MP_APP_SECRET:}
        redirect-uri: ${WECHAT_MP_REDIRECT_URI:http://localhost/login/wechat/h5/callback}

  log:
    cleanup:
      enabled: true
      retention-days: ${EAGLE_LOG_RETENTION_DAYS:90}
      cron: "${EAGLE_LOG_CLEANUP_CRON:0 0 2 * * ?}"

  message:
    sms:
      provider: ${SMS_PROVIDER:}
      access-key-id: ${SMS_ACCESS_KEY_ID:}
      access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
      sign-name: ${SMS_SIGN_NAME:}
      template-id: ${SMS_TEMPLATE_ID:}
      sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:}
      region: ${TENCENT_SMS_REGION:ap-guangzhou}
      username: ${HNSLS_SMS_USERNAME:}
      password: ${HNSLS_SMS_PASSWORD:}
      content-template: "${HNSLS_SMS_CONTENT_TEMPLATE:Your verification code is {code}, valid for 5 minutes.}"
      send-url: ${HNSLS_SMS_SEND_URL:https://xapi.hnsls.com.cn/eums/sms/utf8/send.do}
      charset: ${HNSLS_SMS_CHARSET:UTF-8}
      connect-timeout-ms: ${HNSLS_SMS_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${HNSLS_SMS_READ_TIMEOUT_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    metrics:
      enabled: true
  health:
    db:
      enabled: true
  info:
    env:
      enabled: true

springdoc:
  show-oauth2-endpoints: true
  swagger-ui:
    oauth:
      app-name: Eagle
      client-id: ${EAGLE_OAUTH_WEB_CLIENT_ID:eagleWeb}
      use-pkce-with-authorization-code-grant: true
      scopes:
        - openid
        - profile
    csrf:
      enabled: true
    doc-expansion: none
    persist-authorization: true
