# ===========================================
# 本地开发环境配置
# H2 文件数据库 + Caffeine 本地缓存，无外部依赖即可启动
# ===========================================

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true   # 兼容已有数据库
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${H2_DB_PATH:./db/eagle}
    username: ${H2_DB_USERNAME:root}
    password: ${H2_DB_PASSWORD:123456}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true
  jpa:
    database: h2
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update   # 仅本地用 update，生产必须 validate（参见 .claude/rules/06-database.md）
  # 本地无 Redis，排除 Redisson 自动配置避免启动报错
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  cache:
    type: caffeine
    caffeine:
      spec: "maximumSize=2000,expireAfterWrite=600s"

management:
  health:
    redis:
      enabled: false   # 本地无 Redis
