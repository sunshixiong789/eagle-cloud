# ===========================================
# PostgreSQL profile. Use with prod for production:
#   SPRING_PROFILES_ACTIVE=prod,postgresql
# ===========================================

spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/oauth2-schema-postgresql.sql
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN:10}
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
