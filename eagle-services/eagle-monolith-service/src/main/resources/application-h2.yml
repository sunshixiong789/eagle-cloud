# ===========================================
# Local profile: H2 + Caffeine, no external infrastructure required.
# Activate with SPRING_PROFILES_ACTIVE=local.
# ===========================================

eagle:
  admin:
    password: ${EAGLE_ADMIN_PASSWORD:localDev@2026}
  jwt:
    keystore-password: ${EAGLE_JWT_KEYSTORE_PASSWORD:eagle-jwt-dev-2026}

spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/oauth2-schema-h2.sql
  flyway:
    enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:${H2_DB_NAME:eagle};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: ${H2_DB_USERNAME:root}
    password: ${H2_DB_PASSWORD:123456}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true
  jpa:
    database: h2
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=600s

management:
  health:
    redis:
      enabled: false
