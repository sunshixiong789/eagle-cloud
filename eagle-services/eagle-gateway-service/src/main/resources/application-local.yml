# ===========================================
# Gateway 本地开发差异
# 与基线相比的覆盖：
#   - 关闭 Consul 服务发现
#   - 路由从 lb:// 切换为本地静态地址 http://localhost:80
#   - 关闭 OpenAPI 服务发现聚合，手动配置 swagger urls
#   - Actuator 暴露调试端点 + details=always
#   - 日志 com.eagle=DEBUG
# 其余（CORS=* / httpclient / Swagger 开 等）使用基线默认。
# ===========================================

spring:
  cloud:
    consul:
      discovery:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,mappings,prometheus,gateway
  endpoint:
    health:
      show-details: always
      show-components: always

eagle:
  gateway:
    openapi:
      discovery-enabled: false                  # 本地无注册中心，关闭服务发现聚合
    routes:
      enabled: false                            # 本地无注册中心，关闭服务发现路由生成；走上方静态路由

# 本地手动聚合 Swagger 文档源
springdoc:
  swagger-ui:
    urls:
      - name: 系统服务
        url: /v3/api-docs/eagle-system-server

logging:
  level:
    com.eagle: DEBUG
