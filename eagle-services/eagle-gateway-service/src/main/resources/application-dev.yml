# ===========================================
# Gateway 开发/测试差异
# 与基线相比的覆盖：
#   - Actuator 暴露调试端点 + details=always
#   - 日志 com.eagle=DEBUG
# 其余（Consul 注册 / lb 路由 / CORS=* / Swagger 开）使用基线 + 环境变量。
# ===========================================

spring:
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,mappings,prometheus,gateway
  endpoint:
    gateway:
      access: read-only
    health:
      show-details: always
      show-components: always

logging:
  level:
    com.eagle: DEBUG
