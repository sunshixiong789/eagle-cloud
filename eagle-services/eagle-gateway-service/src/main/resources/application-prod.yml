# ===========================================
# Gateway 生产差异
# 与基线相比的强制锁定：
#   - CORS 必须显式注入 CORS_ALLOWED_ORIGINS（覆盖基线的 *；缺失即 fail-fast）
#     额外暴露 Authorization / X-Request-Id / X-Trace-Id 给前端
#   - Swagger / api-docs 强制关闭
#   - trusted-proxies 默认收窄到 RFC1918 私网段；生产应注入 GATEWAY_TRUSTED_PROXIES 覆盖为真实反代 IP
#   - 日志 root=WARN
# 其余（lb 路由 / httpclient / Actuator 极简 / 等）使用基线默认。
# ===========================================

spring:
  cloud:

# CORS：覆盖基线 ${CORS_ALLOWED_ORIGINS:*} 默认值，缺失环境变量即 fail-fast；
# 额外向前端暴露 Authorization / X-Request-Id / X-Trace-Id 三个响应头。
# 实际写入响应头由 GatewayCorsConfig 注册的 CorsWebFilter 统一处理。
eagle:
  gateway:
    # 生产关闭 OpenAPI 服务发现聚合：一并停掉 GatewayOpenApiConfig（UI 下拉聚合）、
    # OpenApiRouteLocator（/v3/api-docs/{alias} 代理路由）、OpenApiServersRewriteFilter
    # （servers 改写）三个组件，与上面 springdoc 全关保持一致，避免下游 OpenAPI JSON 经网关暴露公网。
    openapi:
      discovery-enabled: false
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS}
      exposed-headers: Authorization,X-Request-Id,X-Trace-Id

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Actuator 生产收窄:不暴露 /actuator/gateway(否则外部可探测路由表与下游服务名),
# 也不暴露 env / configprops / mappings 等可能泄漏内部信息的端点。
# 基线 application.yml 的 include 含 gateway 仅用于 dev/local 排障。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    root: WARN
    com.eagle: INFO
    org.springframework.cloud.gateway: WARN
    reactor.netty: WARN
