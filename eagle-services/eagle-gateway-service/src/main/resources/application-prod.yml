# ===========================================
# Gateway 生产差异
# 与基线相比的强制锁定：
#   - Sentinel eager=true（启动即建立心跳）
#   - CORS 必须显式注入 CORS_ALLOWED_ORIGINS（覆盖基线的 *；缺失即 fail-fast）
#     额外暴露 Authorization / X-Request-Id / X-Trace-Id 给前端
#   - Swagger / api-docs 强制关闭
#   - 日志 root=WARN
# 其余（lb 路由 / httpclient / Actuator 极简 / 等）使用基线默认。
# ===========================================

spring:
  cloud:
    sentinel:
      eager: true
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                # 覆盖基线 ${CORS_ALLOWED_ORIGINS:*} 默认值，强制注入
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS}
                exposedHeaders:
                  - Authorization
                  - X-Request-Id
                  - X-Trace-Id

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.eagle: INFO
    org.springframework.cloud.gateway: WARN
    reactor.netty: WARN
