# ===========================================
# Eagle Gateway · 基线配置（承载全部默认）
# 设计原则：
#   - application.yml 承载完整配置；profile 文件只声明"开发/线上不一样"的差异
#   - 环境变量仅暴露外部接入字段：Nacos 地址、CORS 白名单、Sentinel dashboard 等
#   - 默认值取"生产安全"基线（CORS 默认 *，prod 覆盖；Swagger 默认开，prod 关闭）
# ===========================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # 响应压缩：JSON/XML/HTML 体积 ≥ 1KB 自动 gzip，减少带宽
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  application:
    name: gateway-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    # Spring Cloud LoadBalancer 缓存：默认 TTL 35s 偏长，
    # 在"gateway 启动早于下游服务注册到 Nacos"的场景下会缓存空实例列表 35s，
    # 期间所有 lb:// 路由返回 "Unable to find instance for X" 503。
    # 缩短到 5s 让 LB 快速感知 Nacos 实例变化；Spring Cloud Alibaba Nacos
    # discovery 不会向 LoadBalancer 主动推送事件，只能靠 TTL 过期重拉。
    loadbalancer:
      cache:
        enabled: true
        ttl: 5s
        capacity: 256

    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # Nacos 3.0+ 默认开启鉴权（nacos.core.auth.enabled=true），客户端必须传账号密码
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        # 多机部署时显式注入宿主机/可达 IP；单机 docker 部署留空，客户端自动取容器 IP
        ip: ${NACOS_REGISTER_IP:}

    # Sentinel：dashboard 留空时不连接，避免无意义超时；prod 注入并 eager=true
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
      eager: false
      filter:
        enabled: false                          # Gateway 用 SentinelGatewayFilter，关闭 Servlet Filter
      # Sentinel 规则持久化到 Nacos：客户端启动时从 Nacos 拉取规则，Dashboard 修改后实时下发
      # 需要在 Nacos 中预创建对应 dataId 的 JSON 配置（首次启动会因找不到配置 warn 一次，可忽略）
      datasource:
        ds-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            data-type: json
            rule-type: gw-flow
        ds-api-group:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-api-groups
            data-type: json
            rule-type: gw-api-group
        ds-degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            data-type: json
            rule-type: degrade

    gateway:
      # Spring Cloud Gateway 4.3+：spring.cloud.gateway.server.webflux.*
      server:
        webflux:
          # SCG 5.0 安全设计：trusted-proxies 不配置则 XForwardedHeadersFilter Bean 不创建,
          # 网关不会给下游注入 X-Forwarded-Host/Proto/Port/Prefix，导致下游（如 system 的
          # Spring Authorization Server）用容器内网 host:port 拼 302 Location。
          # 值是 Java 正则，匹配 request.getRemoteAddress() 的 hostString。
          # 开发期信任所有 IP；生产应收窄为 VPC 网段 / CDN 节点 / Ingress IP 的正则。
          # 注意属性必须在 server.webflux 下：GatewayProperties.PREFIX 已迁移到此前缀。
          trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:.*}
          # CORS 不在 SCG globalcors 配置 —— SCG 5.x 在 globalcors 与 WebFlux 默认
          # CORS 处理链共存时会双写 Access-Control-Allow-Origin（浏览器拒收 "multiple values"）。
          # 改由 GatewayCorsConfig 注册的 CorsWebFilter Bean 唯一处理；配置见
          # eagle.gateway.cors.*（基线放开 *；prod profile 强制注入 CORS_ALLOWED_ORIGINS）

          # Reactor Netty 客户端全局超时：不开 httpclient.compression 避免
          # "上游 → 网关解压 → 网关重压"的 CPU 浪费，仅依赖 server.compression 末端压缩一次
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s
          discovery:
            locator:
              enabled: true

          # X-Forwarded-* 头注入（SCG 默认就是这些值，这里显式声明仅为防御后续误关）：
          # 网关必须把外部访问地址（host/proto/port）告诉下游 system 服务，否则
          # Spring Authorization Server 用 docker 容器内网 host:port 拼 302 Location，
          # 导致 /oauth2/authorize 未登录跳转到 172.x.x.x:8082/login 跳出反代范围。
          # 与 system 侧 server.forward-headers-strategy=framework 配套生效。
          x-forwarded:
            enabled: true
            for-enabled: true
            host-enabled: true
            port-enabled: true
            proto-enabled: true
            prefix-enabled: true

          # 协议固定路径：OAuth2 / OIDC 规范要求客户端按 discovery 中发布的
          # 字面 URL（authorization_endpoint / token_endpoint / jwks_uri 等）发起请求，
          # 网关必须按原路径透传到授权服务器，不能套 alias 前缀也不能 rewrite/strip。
          # issuer 由下游 Spring Authorization Server 从 X-Forwarded-* 自动派生为网关 URL
          # （auth-service 侧需开启 server.forward-headers-strategy=framework）。
          # 路由目标：auth-service（注册名 auth），OAuth2 Authorization Server
          # 在 24f3f21 从 system 拆出后承载所有认证 / 账号自助 / 短信流程。
          #
          # 例外：/auth/userinfo 是给前端用的别名路由，StripPrefix 后下游仍是标准 /userinfo。
          # OIDC discovery 仍发布标准 /userinfo（issuer 派生），不受影响；OIDC 客户端按 discovery
          # 走标准路径，前端业务调用走 /auth/userinfo 与其他 /auth/* 命名空间保持一致。
          routes:
            - id: auth-oauth2
              uri: lb://auth
              predicates:
                - Path=/oauth2/**,/.well-known/**,/userinfo,/logout,/connect/**
            - id: auth-userinfo-alias
              uri: lb://auth
              predicates:
                - Path=/auth/userinfo
              filters:
                - StripPrefix=1
            - id: auth-login
              uri: lb://auth
              predicates:
                - Path=/login,/login/**
            # 账号自助 / 短信验证码：注册、重置密码、绑定手机、短信码下发等
            # auth-service 侧已在 SecurityConfig 中按需 permitAll；网关层只做透传不做鉴权
            - id: auth-account
              uri: lb://auth
              predicates:
                - Path=/accounts/**,/sms/**
            # favicon 透传到 auth-service（其 static/favicon.ico 已存在），
            # 避免浏览器直连网关时被 WebFlux ResourceWebHandler 抛 404 刷栈
            - id: auth-favicon
              uri: lb://auth
              predicates:
                - Path=/favicon.ico
            # WebSocket / STOMP：网关对外暴露 /system/ws-stomp，StripPrefix=1 后
            # 转给下游 system 服务的真实端点 /ws-stomp。
            - id: system-server-ws
              uri: lb:ws://system
              predicates:
                - Path=/system/ws-stomp,/system/ws-stomp/**
              filters:
                - StripPrefix=1

# ===========================================
# Actuator：生产安全基线
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

# ===========================================
# Springdoc / Swagger：基线开启（dev/local 用），prod profile 强制关闭
# ===========================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  show-oauth2-endpoints: true
  swagger-ui:
    enabled: true
    # 不自定义 path：保留 SpringDoc 默认 /swagger-ui.html。
    # 若改成 /swagger-ui，访问 /swagger-ui.html 会因无 Handler 落入 WebFlux 静态资源
    # 处理器并返回 404（"No static resource swagger-ui.html"）。
    config-url: /v3/api-docs/swagger-config
    csrf:
      enabled: true
    doc-expansion: none
    persist-authorization: true

# ===========================================
# 日志：默认 INFO 基线；profile 各自调整级别
# ===========================================
logging:
  level:
    root: INFO
    com.eagle: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty: WARN

# ===========================================
# 网关 CORS：唯一一处（由 GatewayCorsConfig 注册 CorsWebFilter 落地）
# 基线放开 *；prod profile 必须显式注入 CORS_ALLOWED_ORIGINS（覆盖默认值）
# 列表字段也支持环境变量逗号分隔："http://a.com,http://b.com"
# ===========================================
eagle:
  gateway:
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
    sentinel:
      enabled: ${EAGLE_GATEWAY_SENTINEL_ENABLED:true}
      rules:
        # 单机 8G 默认高并发基线：保护 system 服务，同时给短时突发留余量。
        - resource: global-api
          resource-mode: api
          path-prefixes: /
          qps: ${EAGLE_SENTINEL_GLOBAL_QPS:1800}
          burst: ${EAGLE_SENTINEL_GLOBAL_BURST:300}
        # OAuth2 / 登录相关接口较重，单独收紧，避免拖垮授权链路。
        - resource: auth-sensitive-api
          resource-mode: api
          path-prefixes: /oauth2/,/.well-known/,/userinfo,/auth/userinfo,/logout,/connect/,/login
          qps: ${EAGLE_SENTINEL_AUTH_QPS:600}
          burst: ${EAGLE_SENTINEL_AUTH_BURST:100}
        # 短信 / 注册 / 重置密码牵涉 Redis、DB 和外部短信商，不能跟普通查询同阈值。
        - resource: sms-api
          resource-mode: api
          path-prefixes: /sms/,/accounts/register,/accounts/password/reset
          qps: ${EAGLE_SENTINEL_SMS_QPS:80}
          burst: ${EAGLE_SENTINEL_SMS_BURST:20}
