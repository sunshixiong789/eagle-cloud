# ===========================================
# Eagle Gateway · 基线配置（承载全部默认）
# 设计原则：
#   - application.yml 承载完整配置；profile 文件只声明"开发/线上不一样"的差异
#   - 环境变量仅暴露外部接入字段：Nacos 地址、CORS 白名单、Sentinel dashboard 等
#   - 默认值取"生产安全"基线（CORS 默认 *，prod 覆盖；Swagger 默认开，prod 关闭）
# ===========================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # 响应压缩：JSON/XML/HTML 体积 ≥ 1KB 自动 gzip，减少带宽
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  application:
    name: eagle-gateway-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # 限制 WebFlux 在内存中暂存请求体的最大字节数，防止超大 Body 攻击拖垮网关
  codec:
    max-in-memory-size: 2MB

  cloud:
    # Spring Cloud LoadBalancer 缓存：默认 TTL 35s 偏长，
    # 在"gateway 启动早于下游服务注册到 Nacos"的场景下会缓存空实例列表 35s，
    # 期间所有 lb:// 路由返回 "Unable to find instance for X" 503。
    # 缩短到 5s 让 LB 快速感知 Nacos 实例变化；Spring Cloud Alibaba Nacos
    # discovery 不会向 LoadBalancer 主动推送事件，只能靠 TTL 过期重拉。
    loadbalancer:
      cache:
        enabled: true
        ttl: 5s
        capacity: 256

    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # Nacos 3.0+ 默认开启鉴权（nacos.core.auth.enabled=true），客户端必须传账号密码
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        # 多机部署时显式注入宿主机/可达 IP；单机 docker 部署留空，客户端自动取容器 IP
        ip: ${NACOS_REGISTER_IP:}

    # Sentinel：dashboard 留空时不连接，避免无意义超时；prod 注入并 eager=true
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
      eager: false
      filter:
        enabled: false                          # Gateway 用 SentinelGatewayFilter，关闭 Servlet Filter
      # Sentinel 规则持久化到 Nacos：客户端启动时从 Nacos 拉取规则，Dashboard 修改后实时下发
      # 需要在 Nacos 中预创建对应 dataId 的 JSON 配置（首次启动会因找不到配置 warn 一次，可忽略）
      datasource:
        ds-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            data-type: json
            rule-type: flow
        ds-degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            data-type: json
            rule-type: degrade

    gateway:
      # Spring Cloud Gateway 4.3+：spring.cloud.gateway.server.webflux.*
      server:
        webflux:
          # 全局 CORS（基线放开 *；prod profile 强制注入 CORS_ALLOWED_ORIGINS）
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:*}
                allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
                allowedHeaders: ["*"]
                allowCredentials: true
                maxAge: 3600

          # Reactor Netty 客户端全局超时：不开 httpclient.compression 避免
          # "上游 → 网关解压 → 网关重压"的 CPU 浪费，仅依赖 server.compression 末端压缩一次
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s

          # AliasRouteDefinitionLocator 基于 DiscoveryClient 自动生成两类路由：
          #   - 业务别名：/api/{alias}/**       → lb://{serviceId}（整段透传）
          #   - OpenAPI 聚合：/v3/api-docs/{alias} → lb://{serviceId} + SetPath=/v3/api-docs
          # 此处仅声明 alias 规则无法覆盖的特殊路径：
          #   - WebSocket：lb:ws:// 协议
          #   - OAuth2/OIDC：协议固定路径（/oauth2/**、/login、/logout、/.well-known/**）不能套别名前缀
          routes:
            - id: system-server-ws
              uri: lb:ws://eagle-system-server
              predicates:
                - Path=/ws-stomp/**

            - id: system-server-oauth2
              uri: lb://eagle-system-server
              predicates:
                - Path=/oauth2/**,/login,/logout,/.well-known/**

          discovery:
            locator:
              enabled: true

# ===========================================
# Eagle Gateway 业务配置
# 注意：网关不再做 JWT 鉴权（JwtAuthenticationGlobalFilter 已移除），
#       JWT 验签与权限校验下沉到下游业务服务（eagle-resource-server-starter）。
#       公开路径白名单由各下游服务通过 eagle.resource-server.permit-paths 各自维护。
# ===========================================
eagle:
  gateway:
    openapi:
      discovery-enabled: true                   # 默认走服务发现聚合；local 关闭
    alias:
      enabled: true                             # 基于 DiscoveryClient 自动为每个下游服务生成 /api/{alias}/** 路由
      path-prefix: /api
      self-service-id: eagle-gateway-server
      # 显式覆盖默认推导规则（eagle-{name}-server / -service → {name}）；
      # 不在此声明的服务，按默认规则自动生成 alias
      mappings:
        system: eagle-system-server
        user: user-service
        trade: trade-service
        product: product-service

# ===========================================
# Actuator：生产安全基线
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    redis:
      enabled: false                            # gateway 默认不强依赖 Redis

# ===========================================
# Springdoc / Swagger：基线开启（dev/local 用），prod profile 强制关闭
# ===========================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  show-oauth2-endpoints: true
  swagger-ui:
    enabled: true
    # 不自定义 path：保留 SpringDoc 默认 /swagger-ui.html。
    # 若改成 /swagger-ui，访问 /swagger-ui.html 会因无 Handler 落入 WebFlux 静态资源
    # 处理器并返回 404（"No static resource swagger-ui.html"）。
    config-url: /v3/api-docs/swagger-config
    csrf:
      enabled: true
    doc-expansion: none
    persist-authorization: true

# ===========================================
# 日志：默认 INFO 基线；profile 各自调整级别
# ===========================================
logging:
  level:
    root: INFO
    com.eagle: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty: WARN
