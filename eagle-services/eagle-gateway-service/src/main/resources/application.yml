# ===========================================
# Eagle Gateway · 基线配置（承载全部默认）
# 设计原则：
#   - application.yml 承载完整配置；profile 文件只声明"开发/线上不一样"的差异
#   - 环境变量仅暴露外部接入字段：Nacos 地址、CORS 白名单、Sentinel dashboard 等
#   - 默认值取"生产安全"基线（CORS 默认 *，prod 覆盖；Swagger 默认开，prod 关闭）
# ===========================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # 响应压缩：JSON/XML/HTML 体积 ≥ 1KB 自动 gzip，减少带宽
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  application:
    name: eagle-gateway-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # 限制 WebFlux 在内存中暂存请求体的最大字节数，防止超大 Body 攻击拖垮网关
  codec:
    max-in-memory-size: 2MB

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

    # Sentinel：dashboard 留空时不连接，避免无意义超时；prod 注入并 eager=true
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
      eager: false
      filter:
        enabled: false                          # Gateway 用 SentinelGatewayFilter，关闭 Servlet Filter
      # Sentinel 规则持久化到 Nacos：客户端启动时从 Nacos 拉取规则，Dashboard 修改后实时下发
      # 需要在 Nacos 中预创建对应 dataId 的 JSON 配置（首次启动会因找不到配置 warn 一次，可忽略）
      datasource:
        ds-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            data-type: json
            rule-type: flow
        ds-degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            data-type: json
            rule-type: degrade

    gateway:
      # Spring Cloud Gateway 4.3+：spring.cloud.gateway.server.webflux.*
      server:
        webflux:
          # 全局 CORS（基线放开 *；prod profile 强制注入 CORS_ALLOWED_ORIGINS）
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:*}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

          # Reactor Netty 客户端全局超时（路由 metadata 可覆盖）。
          # 不开 httpclient.compression：避免"上游 → 网关解压 → 网关重压"的 CPU 浪费,
          # 仅依赖 server.compression 对最终客户端响应压缩一次即可。
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s

          # 默认基于服务发现的 lb 路由；local profile 覆盖为静态地址
          # WebSocket 路由独立配置（lb:ws://）：system-server 通过 /ws-stomp 端点提供 STOMP
          # metadata 路由级超时优先于 httpclient 全局超时；高延迟接口可单独放宽
          routes:
            - id: system-server-ws
              uri: lb:ws://eagle-system-server
              predicates:
                - Path=/ws-stomp/**

            - id: system-server-api-docs
              uri: lb://eagle-system-server
              predicates:
                - Path=/v3/api-docs/eagle-system-server
              filters:
                - SetPath=/v3/api-docs
              metadata:
                response-timeout: 10000           # ms：文档拉取应快速完成
                connect-timeout: 3000

            - id: system-server
              uri: lb://eagle-system-server
              predicates:
                - Path=/api/system/**,/oauth2/**,/login,/logout
              filters:
                - StripPrefix=0
                # 仅对幂等的 GET 重试；上游不可达 / 网关超时 / 服务下线场景指数退避重试 2 次
                # methods / statuses 用显式 list,避免 Spring Boot Binder 对 "GET" / "A,B,C" 单值字符串
                # 转 Set<HttpMethod> / Set<HttpStatus> 的 relaxed binding 行为不稳定
                - name: Retry
                  args:
                    retries: 2
                    methods:
                      - GET
                    statuses:
                      - BAD_GATEWAY
                      - GATEWAY_TIMEOUT
                      - SERVICE_UNAVAILABLE
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
              metadata:
                response-timeout: 30000
                connect-timeout: 3000

            - id: default
              uri: lb://eagle-system-server
              predicates:
                - Path=/**
              metadata:
                response-timeout: 30000
                connect-timeout: 3000

# ===========================================
# Eagle Gateway 业务配置
# 注意：网关不再做 JWT 鉴权（JwtAuthenticationGlobalFilter 已移除），
#       JWT 验签与权限校验下沉到下游业务服务（eagle-resource-server-starter）。
#       公开路径白名单由各下游服务通过 eagle.resource-server.permit-paths 各自维护。
# ===========================================
eagle:
  gateway:
    openapi:
      discovery-enabled: true                   # 默认走服务发现聚合；local 关闭

# ===========================================
# Actuator：生产安全基线
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    redis:
      enabled: false                            # gateway 默认不强依赖 Redis

# ===========================================
# Springdoc / Swagger：基线开启（dev/local 用），prod profile 强制关闭
# ===========================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  show-oauth2-endpoints: true
  swagger-ui:
    enabled: true
    # 不自定义 path：保留 SpringDoc 默认 /swagger-ui.html。
    # 若改成 /swagger-ui，访问 /swagger-ui.html 会因无 Handler 落入 WebFlux 静态资源
    # 处理器并返回 404（"No static resource swagger-ui.html"）。
    config-url: /v3/api-docs/swagger-config
    csrf:
      enabled: true
    doc-expansion: none
    persist-authorization: true

# ===========================================
# 日志：默认 INFO 基线；profile 各自调整级别
# ===========================================
logging:
  level:
    root: INFO
    com.eagle: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty: WARN
