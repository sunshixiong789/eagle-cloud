# ===========================================
# Eagle Gateway · 基线配置（承载全部默认）
# 设计原则：
#   - application.yml 承载完整配置；profile 文件只声明"开发/线上不一样"的差异
#   - 环境变量仅暴露外部接入字段：Consul 地址、CORS 白名单等
#   - 默认值取"生产安全"基线（CORS 默认 *，prod 覆盖；Swagger 默认开，prod 关闭）
# ===========================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # 响应压缩：JSON/XML/HTML 体积 ≥ 1KB 自动 gzip，减少带宽
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  application:
    name: gateway-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # 配置中心：启动期从 Consul KV 拉取本环境配置。KV 里的键沿用环境变量名（REDIS_HOST 等），
  # 于是本文件所有 ${VAR:default} 占位符可直接被 KV 的值填上，yml 结构与默认值一行都不用改。
  # optional: 前缀 —— Consul 不可达时跳过该 location 而非启动失败，此时回落到各占位符默认值。
  # 地址取下方 spring.cloud.consul.host/port，此处不重复写。
  config:
    import: "optional:consul:"

  # ---- Redis 连接 ----
  # 网关自身不缓存业务数据，唯一用途是 Spring Cloud Gateway 内置 RedisRateLimiter
  # （令牌桶 Lua 脚本，key 维度见 GatewayRateLimitConfig 的 KeyResolver）。
  # 必须显式配置：spring-boot-starter-data-redis-reactive 只要在 classpath 上，
  # 缺省即 localhost:6379 —— 容器内必然 Connection refused，DataRedisReactiveHealthIndicator
  # 会把 /actuator/health 整体拉成 DOWN，进而让 Consul 把 gateway-server 判为 critical。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 3000ms
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:64}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: ${REDIS_POOL_MAX_WAIT:2000ms}
        shutdown-timeout: 1000ms

  cloud:
    # Spring Cloud LoadBalancer 缓存：默认 TTL 35s 偏长，
    # 在“gateway 启动早于下游服务注册到注册中心”的场景下会缓存空实例列表 35s，
    # 期间所有 lb:// 路由返回 "Unable to find instance for X" 503。
    # 缩短到 5s 让 LB 快速感知实例变化。
    loadbalancer:
      cache:
        enabled: true
        ttl: 5s
        capacity: 256

    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      # 配置中心（KV）。format=YAML 时每个 context 只读 `data` 这一个键，值是整份 YAML 文档：
      #   config/application/data            六服务共享 · 跨环境
      #   config/application,<profile>/data  六服务共享 · 按环境
      #   config/<app>/data                  单服务   · 跨环境
      #   config/<app>,<profile>/data        单服务   · 按环境（优先级最高）
      # ⚠️ <app> 是 spring.application.name —— 本服务是 **gateway-server**，不是 compose
      #    里的服务名 gateway。KV 路径要写 config/gateway-server,<profile>/data。
      # 共享层只放 6 服务通用的 Redis / RabbitMQ 连接；其余按服务下沉。
      # 键位清单见 docs/consul-config.md。
      # ⚠️ 真实环境变量优先级高于 Consul —— compose / .env 里仍注入的同名变量会盖掉 KV 值。
      config:
        enabled: ${CONSUL_CONFIG_ENABLED:true}
        format: YAML
        prefixes: config
        default-context: application
        profile-separator: ','
        data-key: data
        # ACL token。Spring Cloud Consul 5.x 把 token 拆成 discovery / config 两处独立配置
        # （4.x 的 spring.cloud.consul.token 在 5.x 的 ConsulProperties 里已不存在，
        #  写了不报错但完全不生效），两处都要给，否则 ACL 开启后一侧 403。
        acl-token: ${CONSUL_TOKEN:}
        # 热更新关闭：配置只在启动期读一次，改完 KV 需重启服务才生效。
        watch:
          enabled: false
      discovery:
        acl-token: ${CONSUL_TOKEN:}
        enabled: ${CONSUL_DISCOVERY_ENABLED:true}
        register: true
        # 多机部署时显式注入宿主机/可达 IP；不注入则回落到 InetUtils 探测出的容器 IP。
        prefer-ip-address: true
        # ⚠️ 回落仅在该变量「未定义」时生效 —— Spring 的 ${VAR:default} 对空串不回落，
        #    空串会原样绑定。而 prefer-ip-address=true 时 getHostname() 直接返回 ipAddress，
        #    空串会让注册 Address 和健康检查 URL 双双缺 host（http://:8080/actuator/health），
        #    Consul 判 critical，再按 health-check-critical-timeout 注销实例 ——
        #    现象是服务压根没注册上。compose 无法条件性省略 environment 键，
        #    故由 Dockerfile entrypoint 把空串 unset 掉，让这里的回落真正生效。
        ip-address: ${CONSUL_INSTANCE_IP:${spring.cloud.client.ip-address}}
        service-name: ${spring.application.name}
        health-check-path: /actuator/health
        health-check-interval: 10s
        health-check-critical-timeout: 30s


    gateway:
      # Spring Cloud Gateway 4.3+：spring.cloud.gateway.server.webflux.*
      server:
        webflux:
          # SCG 5.0 安全设计：trusted-proxies 不配置则 XForwardedHeadersFilter Bean 不创建,
          # 网关不会给下游注入 X-Forwarded-Host/Proto/Port/Prefix，导致下游（如 system 的
          # Spring Authorization Server）用容器内网 host:port 拼 302 Location。
          # 值是 Java 正则，匹配 request.getRemoteAddress() 的 hostString。
          # 开发期信任所有 IP；生产应收窄为 VPC 网段 / CDN 节点 / Ingress IP 的正则。
          # 注意属性必须在 server.webflux 下：GatewayProperties.PREFIX 已迁移到此前缀。
          trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:.*}
          # CORS 不在 SCG globalcors 配置 —— SCG 5.x 在 globalcors 与 WebFlux 默认
          # CORS 处理链共存时会双写 Access-Control-Allow-Origin（浏览器拒收 "multiple values"）。
          # 改由 GatewayCorsConfig 注册的 CorsWebFilter Bean 唯一处理；配置见
          # eagle.gateway.cors.*（基线放开 *；prod profile 强制注入 CORS_ALLOWED_ORIGINS）

          # Reactor Netty 客户端全局超时：不开 httpclient.compression 避免
          # "上游 → 网关解压 → 网关重压"的 CPU 浪费，仅依赖 server.compression 末端压缩一次
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s
          discovery:
            locator:
              enabled: true

          # X-Forwarded-* 头注入（SCG 默认就是这些值，这里显式声明仅为防御后续误关）：
          # 网关必须把外部访问地址（host/proto/port）告诉下游 system 服务，否则
          # Spring Authorization Server 用 docker 容器内网 host:port 拼 302 Location，
          # 导致 /oauth2/authorize 未登录跳转到 172.x.x.x:8082/login 跳出反代范围。
          # 与 system 侧 server.forward-headers-strategy=framework 配套生效。
          # *-append 必须为 true（=SCG 默认）：网关把自己这一跳「追加」到最外层反代已写的值之后，
          # 得到 `X-Forwarded-Proto: https,http`。下游 Spring 的 ForwardedHeaderUtils 取**第一个** token，
          # 即最外层 nginx 的 https。一旦被改成 false，写法变成 set 覆盖，
          # 下游只会看到网关自己的 http/80，302 Location 就退化成 http:// 并被 nginx 再 301 升级（多一跳）。
          # 这里显式声明，防止被 Consul KV 或环境变量悄悄关掉。
          x-forwarded:
            enabled: true
            for-enabled: true
            host-enabled: true
            port-enabled: true
            proto-enabled: true
            prefix-enabled: true
            for-append: true
            host-append: true
            port-append: true
            proto-append: true
            prefix-append: true

          # 协议固定路径：OAuth2 / OIDC 规范要求客户端按 discovery 中发布的
          # 字面 URL（authorization_endpoint / token_endpoint / jwks_uri 等）发起请求，
          # 网关必须按原路径透传到授权服务器，不能套 alias 前缀也不能 rewrite/strip。
          # issuer 由下游 Spring Authorization Server 从 X-Forwarded-* 自动派生为网关 URL
          # （auth-service 侧需开启 server.forward-headers-strategy=framework）。
          # 路由目标：auth-service（注册名 auth），OAuth2 Authorization Server
          # 在 24f3f21 从 system 拆出后承载所有认证 / 账号自助 / 短信流程。
          #
          # 例外：/auth/userinfo 是给前端用的别名路由，StripPrefix 后下游仍是标准 /userinfo。
          # OIDC discovery 仍发布标准 /userinfo（issuer 派生），不受影响；OIDC 客户端按 discovery
          # 走标准路径，前端业务调用走 /auth/userinfo 与其他 /auth/* 命名空间保持一致。
          routes:
            - id: auth-oauth2
              uri: lb://auth
              predicates:
                - Path=/oauth2/**,/.well-known/**,/userinfo,/logout,/connect/**
            - id: auth-userinfo-alias
              uri: lb://auth
              predicates:
                - Path=/auth/userinfo
              filters:
                - StripPrefix=1
            - id: auth-login
              uri: lb://auth
              predicates:
                - Path=/login,/login/**
            # 账号自助 / 短信验证码：注册、重置密码、绑定手机、短信码下发等
            # auth-service 侧已在 SecurityConfig 中按需 permitAll；网关层只做透传不做鉴权
            - id: auth-account
              uri: lb://auth
              predicates:
                - Path=/accounts/**,/sms/**
            # favicon 透传到 auth-service（其 static/favicon.ico 已存在），
            # 避免浏览器直连网关时被 WebFlux ResourceWebHandler 抛 404 刷栈
            - id: auth-favicon
              uri: lb://auth
              predicates:
                - Path=/favicon.ico
            # WebSocket / STOMP：网关对外暴露 /system/ws-stomp，StripPrefix=1 后
            # 转给下游 system 服务的真实端点 /ws-stomp。
            - id: system-server-ws
              uri: lb:ws://system
              predicates:
                - Path=/system/ws-stomp,/system/ws-stomp/**
              filters:
                - StripPrefix=1

# ===========================================
# Actuator：生产安全基线
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

# ===========================================
# Springdoc / Swagger：基线开启（dev/local 用），prod profile 强制关闭
# ===========================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  show-oauth2-endpoints: true
  swagger-ui:
    enabled: true
    # 不自定义 path：保留 SpringDoc 默认 /swagger-ui.html。
    # 若改成 /swagger-ui，访问 /swagger-ui.html 会因无 Handler 落入 WebFlux 静态资源
    # 处理器并返回 404（"No static resource swagger-ui.html"）。
    config-url: /v3/api-docs/swagger-config
    csrf:
      enabled: true
    doc-expansion: none
    persist-authorization: true

# ===========================================
# 日志：默认 INFO 基线；profile 各自调整级别
# ===========================================
logging:
  level:
    root: INFO
    com.eagle: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty: WARN

# ===========================================
# 网关 CORS：唯一一处（由 GatewayCorsConfig 注册 CorsWebFilter 落地）
# 基线放开 *；prod profile 必须显式注入 CORS_ALLOWED_ORIGINS（覆盖默认值）
# 列表字段也支持环境变量逗号分隔："http://a.com,http://b.com"
# ===========================================
eagle:
  gateway:
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
