# ===========================================
# Eagle Gateway · 基线配置（承载全部默认）
# 设计原则：
#   - application.yml 承载完整配置；profile 文件只声明"开发/线上不一样"的差异
#   - 环境变量仅暴露外部接入字段：Nacos 地址、CORS 白名单、Sentinel dashboard 等
#   - 默认值取"生产安全"基线（CORS 默认 *，prod 覆盖；Swagger 默认开，prod 关闭）
# ===========================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # 响应压缩：JSON/XML/HTML 体积 ≥ 1KB 自动 gzip，减少带宽
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  application:
    name: eagle-gateway-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # 限制 WebFlux 在内存中暂存请求体的最大字节数，防止超大 Body 攻击拖垮网关
  codec:
    max-in-memory-size: 2MB

  cloud:
    # Spring Cloud LoadBalancer 缓存：默认 TTL 35s 偏长，
    # 在"gateway 启动早于下游服务注册到 Nacos"的场景下会缓存空实例列表 35s，
    # 期间所有 lb:// 路由返回 "Unable to find instance for X" 503。
    # 缩短到 5s 让 LB 快速感知 Nacos 实例变化；Spring Cloud Alibaba Nacos
    # discovery 不会向 LoadBalancer 主动推送事件，只能靠 TTL 过期重拉。
    loadbalancer:
      cache:
        enabled: true
        ttl: 5s
        capacity: 256

    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # Nacos 3.0+ 默认开启鉴权（nacos.core.auth.enabled=true），客户端必须传账号密码
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        # 多机部署时显式注入宿主机/可达 IP；单机 docker 部署留空，客户端自动取容器 IP
        ip: ${NACOS_REGISTER_IP:}

    # Sentinel：dashboard 留空时不连接，避免无意义超时；prod 注入并 eager=true
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
      eager: false
      filter:
        enabled: false                          # Gateway 用 SentinelGatewayFilter，关闭 Servlet Filter
      # Sentinel 规则持久化到 Nacos：客户端启动时从 Nacos 拉取规则，Dashboard 修改后实时下发
      # 需要在 Nacos 中预创建对应 dataId 的 JSON 配置（首次启动会因找不到配置 warn 一次，可忽略）
      datasource:
        ds-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            data-type: json
            rule-type: flow
        ds-degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            data-type: json
            rule-type: degrade

    gateway:
      # Spring Cloud Gateway 4.3+：spring.cloud.gateway.server.webflux.*
      server:
        webflux:
          # 全局 CORS（基线放开 *；prod profile 强制注入 CORS_ALLOWED_ORIGINS）
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:*}
                allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
                allowedHeaders: ["*"]
                allowCredentials: true
                maxAge: 3600

          # Reactor Netty 客户端全局超时：不开 httpclient.compression 避免
          # "上游 → 网关解压 → 网关重压"的 CPU 浪费，仅依赖 server.compression 末端压缩一次
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s

          # 所有业务路由由 GatewayRouteConfig.ServiceRouteLocator 基于 Nacos DiscoveryClient
          # 与 eagle.gateway.routes.services.* 自动生成，此处不再声明任何静态 routes 条目。

# ===========================================
# Eagle 网关路由声明：alias + 协议固定端点 + WebSocket + 路由级 filter
# 每个下游服务的 serviceId 在 services 下声明 alias / wsPaths / fixedPaths / filters；
# 未声明的服务自动按命名规则推导 alias（剥离 eagle- 前缀与 -server/-service 后缀），
# 仅生成业务别名 + OpenAPI 聚合两条基础路由。
#
# filters 结构化格式（- name + args），仅作用于业务别名路由（不作用于 ws/fixed/api-docs）。
# SCG 短 DSL 不支持单参数多值（comma 已是参数分隔符，pipe 不被识别），数组参数请用 YAML 列表，
# 由 ServiceRouteLocator.toFilterDefinition() 自动展开为 statuses[0]/statuses[1] 等索引参数。
# 限流不在此处声明 —— 走 Sentinel Dashboard（spring.cloud.sentinel.datasource.ds-flow 已接入），
# 规则按 routeId（alias-{alias}/api-docs-{alias}）或 API 分组配置，秒级下发，无需重启网关。
# ===========================================
eagle:
  gateway:
    openapi:
      discovery-enabled: true                   # Swagger UI 通过 Nacos 服务发现聚合下游 OpenAPI
    routes:
      enabled: true                             # 启用服务发现路由（本地无 Nacos 场景用 profile 覆盖为 false）
      path-prefix: /api
      self-service-id: eagle-gateway-server
      services:
        eagle-system-server:
          alias: system
          ws-paths:
            - /ws-stomp/**                      # STOMP over WebSocket
          fixed-paths:                          # OAuth2/OIDC 标准路径，不能套 /api/system/ 前缀
            - /oauth2/**
            - /login
            - /logout
            - /.well-known/**
          filters:
            # 仅幂等 GET 在网关瞬时不可用时重试 3 次
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
                  - SERVICE_UNAVAILABLE
                methods: [GET]
        user-service:
          alias: user
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
                  - SERVICE_UNAVAILABLE
                methods: [GET]
        product-service:
          alias: product
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
                  - SERVICE_UNAVAILABLE
                methods: [GET]
        trade-service:
          alias: trade
          # 交易接口绝大多数为 POST（下单/支付/退款），自动重试可能重复扣款 — 不开 Retry，
          # 由 Sentinel 熔断 + 应用层幂等键（eagle-idempotency-starter）兜底

# ===========================================
# Actuator：生产安全基线
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    redis:
      enabled: false                            # gateway 默认不强依赖 Redis

# ===========================================
# Springdoc / Swagger：基线开启（dev/local 用），prod profile 强制关闭
# ===========================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  show-oauth2-endpoints: true
  swagger-ui:
    enabled: true
    # 不自定义 path：保留 SpringDoc 默认 /swagger-ui.html。
    # 若改成 /swagger-ui，访问 /swagger-ui.html 会因无 Handler 落入 WebFlux 静态资源
    # 处理器并返回 404（"No static resource swagger-ui.html"）。
    config-url: /v3/api-docs/swagger-config
    csrf:
      enabled: true
    doc-expansion: none
    persist-authorization: true

# ===========================================
# 日志：默认 INFO 基线；profile 各自调整级别
# ===========================================
logging:
  level:
    root: INFO
    com.eagle: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty: WARN
