# ===========================================
# Eagle Gateway · 基线配置（承载全部默认）
# 设计原则：
#   - application.yml 承载完整配置；profile 文件只声明"开发/线上不一样"的差异
#   - 环境变量仅暴露外部接入字段：Nacos 地址、CORS 白名单、Sentinel dashboard 等
#   - 默认值取"生产安全"基线（CORS 默认 *，prod 覆盖；Swagger 默认开，prod 关闭）
# ===========================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: eagle-gateway-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

    # Sentinel：dashboard 留空时不连接，避免无意义超时；prod 注入并 eager=true
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
      eager: false
      filter:
        enabled: false                          # Gateway 用 SentinelGatewayFilter，关闭 Servlet Filter

    gateway:
      # Spring Cloud Gateway 4.3+：spring.cloud.gateway.server.webflux.*
      server:
        webflux:
          # 全局 CORS（基线放开 *；prod profile 强制注入 CORS_ALLOWED_ORIGINS）
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:*}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

          httpclient:
            connect-timeout: 3000
            response-timeout: 30s

          # 默认基于服务发现的 lb 路由；local profile 覆盖为静态地址
          routes:
            - id: system-server-api-docs
              uri: lb://eagle-system-server
              predicates:
                - Path=/v3/api-docs/eagle-system-server
              filters:
                - SetPath=/v3/api-docs

            - id: system-server
              uri: lb://eagle-system-server
              predicates:
                - Path=/api/system/**,/oauth2/**,/login,/logout
              filters:
                - StripPrefix=0

            - id: default
              uri: lb://eagle-system-server
              predicates:
                - Path=/**

# ===========================================
# Eagle Gateway 业务配置
# ===========================================
eagle:
  gateway:
    security:
      auth-server-url: ${AUTH_SERVER_URL:http://localhost:80}
      public-paths:
        - /public/**
        - /actuator/health
        - /actuator/info
        - /swagger-ui.html
        - /swagger-ui/**
        - /v3/api-docs/**
        - /swagger-resources/**
        - /webjars/**
        - /oauth2/**
        - /login
        - /error
    openapi:
      discovery-enabled: true                   # 默认走服务发现聚合；local 关闭

# ===========================================
# Actuator：生产安全基线
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    redis:
      enabled: false                            # gateway 默认不强依赖 Redis

# ===========================================
# Springdoc / Swagger：基线开启（dev/local 用），prod profile 强制关闭
# ===========================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  show-oauth2-endpoints: true
  swagger-ui:
    enabled: true
    path: /swagger-ui
    config-url: /v3/api-docs/swagger-config
    csrf:
      enabled: true
    doc-expansion: none
    persist-authorization: true

# ===========================================
# 日志：默认 INFO 基线；profile 各自调整级别
# ===========================================
logging:
  level:
    root: INFO
    com.eagle: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty: WARN
