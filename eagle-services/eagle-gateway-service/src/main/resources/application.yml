# ===========================================
# Eagle Gateway · 基线配置（所有环境共用）
# 设计原则：
#   - 公共配置全部在此，通过 ${VAR:default} 占位符让环境变量按需覆盖
#   - 默认值取"开发友好"基线（CORS=*，Swagger 开启），prod profile 强制收紧
#   - 各 profile（local / dev / prod）只声明与基线"不一样"的部分
# ===========================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: eagle-gateway-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

    gateway:
      # Spring Cloud Gateway 4.3+：spring.cloud.gateway.server.webflux.*
      server:
        webflux:
          # 全局 CORS（dev/容器默认放开 *；prod profile 必须显式注入 CORS_ALLOWED_ORIGINS）
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:*}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:30s}

          # 基于服务发现的路由（local profile 用静态 URL 覆盖）
          routes:
            # API Docs 聚合代理路由（必须排在 system-server 通配路由前）
            - id: system-server-api-docs
              uri: lb://eagle-system-server
              predicates:
                - Path=/v3/api-docs/eagle-system-server
              filters:
                - SetPath=/v3/api-docs

            # 系统服务（认证授权 + 用户权限管理）
            - id: system-server
              uri: lb://eagle-system-server
              predicates:
                - Path=/api/system/**,/oauth2/**,/login,/logout
              filters:
                - StripPrefix=0

            # 默认兜底路由
            - id: default
              uri: lb://eagle-system-server
              predicates:
                - Path=/**

# Sentinel（dashboard 留空时不连接，避免无意义超时；prod 必须注入 SENTINEL_DASHBOARD）
spring.cloud.sentinel:
  transport:
    dashboard: ${SENTINEL_DASHBOARD:}
  eager: ${SENTINEL_EAGER:false}
  filter:
    enabled: false                          # Gateway 用 SentinelGatewayFilter，关闭 Servlet Filter

# ===========================================
# Springdoc 聚合（默认开启；prod profile 强制关闭）
# ===========================================
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui
    config-url: /v3/api-docs/swagger-config

# ===========================================
# Actuator（默认按生产安全基线）
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,prometheus,gateway}
      base-path: /actuator
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:never}
      show-components: ${ACTUATOR_HEALTH_COMPONENTS:never}
      probes:
        enabled: true
  health:
    redis:
      enabled: ${ACTUATOR_REDIS_HEALTH:false}   # gateway 默认不强依赖 Redis

# ===========================================
# Eagle Gateway 自定义配置
# ===========================================
eagle:
  gateway:
    security:
      auth-server-url: ${AUTH_SERVER_URL:http://localhost:80}
      public-paths:
        - /public/**
        - /actuator/health
        - /actuator/info
        - /swagger-ui.html
        - /swagger-ui/**
        - /v3/api-docs/**
        - /swagger-resources/**
        - /webjars/**
        - /oauth2/**
        - /login
        - /error
    openapi:
      discovery-enabled: ${EAGLE_OPENAPI_DISCOVERY_ENABLED:true}

# ===========================================
# 日志（默认 INFO 基线；profile 各自调整级别）
# ===========================================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.eagle: ${LOG_LEVEL_EAGLE:INFO}
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
    reactor.netty: ${LOG_LEVEL_NETTY:WARN}
