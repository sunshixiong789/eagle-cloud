dependencies {
    implementation project(':eagle-starter:eagle-common-starter')
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    // SpringDoc OpenAPI 网关聚合
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui'

    // Consul 服务发现（接入动态路由，取代 Nacos）
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'

    // 网关限流：Spring Cloud Gateway 内置 RequestRateLimiter + RedisRateLimiter（取代 Sentinel）。
    // 令牌桶算法由 Redis Lua 脚本执行，是集群级限流 —— 比原 Sentinel 的单机计数更准确，
    // 副本数变化时总阈值不会漂移。
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // 链路追踪
    implementation project(':eagle-starter:eagle-tracing-starter')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
