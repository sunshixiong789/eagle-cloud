dependencies {
    implementation project(':eagle-starter:eagle-common-starter')
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    // 网关定位：纯路由 + 限流 + CORS + 链路追踪 + Header 透传。
    // 不引入 Spring Security / OAuth2 资源服务器依赖 —— JWT 验签与用户身份提取统一由下游
    // 业务服务通过 eagle-resource-server-starter 处理。OAuth2 授权端点（/oauth2/**、/login）
    // 由 system-service 的 OAuth2 Authorization Server SecurityFilterChain 自带放行规则处理。

    // SpringDoc OpenAPI 网关聚合
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui'

    // Nacos 服务发现（接入动态路由）
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'

    // Sentinel 网关限流 + Nacos 持久化规则
    // sentinel-datasource-nacos 自动激活 spring.cloud.sentinel.datasource.* 配置,
    // 实现流控/降级规则从 Nacos 热加载与刷新,避免 Dashboard 推送的规则在客户端重启后丢失。
    implementation 'com.alibaba.cloud:spring-cloud-alibaba-sentinel-gateway'
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-sentinel'
    implementation 'com.alibaba.csp:sentinel-datasource-nacos'

    // 链路追踪
    implementation project(':eagle-starter:eagle-tracing-starter')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
