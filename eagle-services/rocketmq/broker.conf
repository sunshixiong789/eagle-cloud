# RocketMQ Broker 配置(开发环境单机 master)
# brokerIP1 必须指定为容器服务名,否则其他容器拿到默认宿主 IP 后无法连上
# storePathRootDir 必须显式声明,否则某些代码路径派生 null → shutdown NPE
# namesrvAddr 写进 conf 兜底(避免环境变量在派生进程里丢失)
# autoCreateTopicEnable=true:开发环境允许首次发送时自动建 Topic(生产应关闭,由运维预创建)
brokerIP1=rocketmq-broker
brokerName=broker-a
brokerId=0
brokerClusterName=DefaultCluster
namesrvAddr=rocketmq-namesrv:9876
storePathRootDir=/home/rocketmq/store
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true
