# -------只适用于开发环境----------
# 变量管理约定：
#   1. environment 显式枚举所有变量，统一 ${VAR:-default} 形式 —— compose.yml 是"变量清单 + 默认值"，.env 是"差异值表"
#   2. compose 启动时自动加载本文件同目录的 .env 用于 ${VAR} 插值，无需声明 env_file（声明反而冗余）
#   3. 优先级（高 → 低）：shell 环境变量 > .env 文件 > environment 默认值
#   4. healthcheck / command 中引用敏感字段（密码）也采用 ${VAR:-default} 插值，确保 .env 覆盖后整体一致
#   5. 新增凭证：在 .env 写入值 + 在 environment 加 `KEY=${KEY}` 占位即可（让 compose.yml 始终是变量清单）
networks:
  eagle-network:
    name: eagle-network
    driver: bridge

# 数据卷（named volumes，由 docker 自动创建并持久化）
volumes:
  mysql-data:
  redis-data:
  nacos-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0.30
    container_name: eagle-mysql
    restart: always
    ports:
      - "3306:3306"
    networks:
      - eagle-network
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123456}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-eagle}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD:-root123456}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis 缓存
  redis:
    image: redis:8.6.1
    container_name: eagle-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - eagle-network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123456}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123456}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123456}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nacos 注册中心
  nacos:
    image: nacos/nacos-server:v3.2.1
    container_name: eagle-nacos
    restart: always
    ports:
      # Nacos v3 新版控制台容器内端口 8080；为避免与 gateway 主机 8080 冲突，主机映射为 8090
      - "8090:8080"
      - "8848:8848"
      - "9848:9848"
    networks:
      - eagle-network
    environment:
      - PREFER_HOST_MODE=${NACOS_PREFER_HOST_MODE:-hostname}
      - MODE=${NACOS_MODE:-standalone}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:-security}
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      # Nacos v3.x 把控制台拆成独立 Tomcat：
      #   - 容器内 8080：新版 Console（context path 是 /，无 /nacos 前缀）
      #   - 容器内 8848：Server OpenAPI（保留 /nacos 前缀）
      # 旧的 /nacos/v1/console/health/readiness 在 v3 已移除（启动日志：No mapping for GET ...）；
      # actuator 端点默认未暴露（启动日志：Exposing 0 endpoints beneath base path '/actuator'）。
      # healthcheck 在容器内执行，必须用容器内端口（不是 ports 映射出去的主机端口 8090）。
      # 直接探容器内 8080 的根路径——Tomcat 启动后稳定返回 200，且 standalone 模式下
      # Console 与 Server 同进程同启动，Console 就绪即代表 Nacos 可用。
      test: [ "CMD-SHELL", "curl -fsS -o /dev/null -m 3 http://127.0.0.1:8080/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Sentinel Dashboard（开发环境单机，控制台 8858；默认账号 sentinel/sentinel）
  # 客户端通过 SENTINEL_DASHBOARD=sentinel-dashboard:8858 上报心跳与拉取规则
  # 镜像来源：本地 Dockerfile 拉取 Alibaba 官方发布的 fat jar（不依赖第三方 docker hub 镜像）
  sentinel-dashboard:
    build:
      context: ./sentinel-dashboard
      args:
        SENTINEL_VERSION: 1.8.9
    image: eagle-sentinel-dashboard:1.8.9
    pull_policy: build           # 本地构建镜像，禁止 docker compose up 时去 registry 拉
    container_name: eagle-sentinel
    restart: always
    ports:
      - "8858:8858"
    networks:
      - eagle-network
    environment:
      # 启动参数：固定监听 8858 + dashboard 自监控地址 + project.name 区分集群
      # 1.8.6+ 默认开启鉴权（账号/密码 sentinel/sentinel），如需自定义加：
      # -Dsentinel.dashboard.auth.username=xxx -Dsentinel.dashboard.auth.password=xxx
      - JAVA_OPTS=${SENTINEL_JAVA_OPTS:--server -Xms256m -Xmx512m -Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard}
      - TZ=${TZ:-Asia/Shanghai}
    mem_limit: 768m
    mem_reservation: 256m
    healthcheck:
      # Sentinel Dashboard 是 Spring Boot 应用，根路径返回 200 即视为就绪
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8858/ > /dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # RocketMQ NameServer（开发环境单机，9876）
  # 仅做路由注册；Broker 启动后向其汇报，客户端通过它发现 Broker 地址
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: eagle-rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    networks:
      - eagle-network
    environment:
      # NameServer 资源消耗低，限制内存避免占用过多开发机资源
      - JAVA_OPT_EXT=${ROCKETMQ_NAMESRV_JAVA_OPT_EXT:--server -Xms512m -Xmx512m -Xmn256m}
      - TZ=${TZ:-Asia/Shanghai}
    command: sh mqnamesrv
    mem_limit: 768m
    mem_reservation: 384m
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  # RocketMQ Broker（开发环境单机 master，无 slave）
  # brokerIP1 必须指定为容器服务名（rocketmq-broker），否则其他容器拿到默认宿主 IP 后无法连上
  # autoCreateTopicEnable=true：开发环境允许首次发送时自动建 Topic（生产应关闭，由运维预创建）
  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: eagle-rocketmq-broker
    restart: always
    # user: root —— named volume 首次挂载属主是 root:root,镜像内默认 rocketmq 用户(uid=3000)
    # 无法写入 /home/rocketmq/store,会触发"createBrokerController 失败 → shutdown NPE"假象
    user: root
    ports:
      - "10909:10909"   # VIP channel
      - "10911:10911"   # Broker 主端口（客户端读写）
      - "10912:10912"   # HA 同步端口（单机也开放，便于后续扩主从）
    networks:
      - eagle-network
    depends_on:
      - rocketmq-namesrv
    environment:
      - NAMESRV_ADDR=${ROCKETMQ_NAMESRV_ADDR:-rocketmq-namesrv:9876}
      # Broker 默认堆 8g 太大；开发机收紧到 1g
      - JAVA_OPT_EXT=${ROCKETMQ_BROKER_JAVA_OPT_EXT:--server -Xms1g -Xmx1g -Xmn512m}
      - TZ=${TZ:-Asia/Shanghai}
    # 内联生成 broker.conf：单机 master + 自动建 Topic/订阅组；brokerIP1 指向容器服务名
    # storePathRootDir 必须显式声明,否则某些代码路径派生 null → shutdown NPE
    # namesrvAddr 写进 conf 兜底(避免环境变量在派生进程里丢失)
    command: >
      sh -c "mkdir -p /home/rocketmq/store /home/rocketmq/logs &&
      printf 'brokerIP1=rocketmq-broker\nbrokerName=broker-a\nbrokerId=0\nbrokerClusterName=DefaultCluster\nnamesrvAddr=rocketmq-namesrv:9876\nstorePathRootDir=/home/rocketmq/store\nautoCreateTopicEnable=true\nautoCreateSubscriptionGroup=true\n' > /home/rocketmq/broker.conf &&
      sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf"
    mem_limit: 1536m
    mem_reservation: 768m
    volumes:
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store

  # 网关服务
  gateway:
    build:
      context: ./eagle-gateway-service
      dockerfile: Dockerfile
    image: eagle-gateway:1.0.0
    pull_policy: build           # 本地构建镜像，禁止 docker compose up 时去 registry 拉
    container_name: eagle-gateway
    restart: always
    ports:
      - "8080:8080"
    networks:
      - eagle-network
    # 开发环境内存上限：堆 512m + 元空间 192m + 直接内存 + 线程栈 → 容器留 768m 余量
    mem_limit: 768m
    mem_reservation: 384m
    # environment 显式枚举所有关键变量，统一 ${VAR:-default} 插值
    # 默认值已包含容器网络约束（nacos:8848 / system:8082 / sentinel-dashboard:8858），.env 可整体覆盖
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-}
      - NACOS_GROUP=${NACOS_GROUP:-DEFAULT_GROUP}
      # Nacos 3.0+ 默认开启鉴权，客户端必须传账号密码
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-}
      # 多机部署时改为宿主机/公网 IP；单机留空，客户端自动取容器 IP
      - NACOS_REGISTER_IP=${NACOS_REGISTER_IP:-}
      - AUTH_SERVER_URL=${AUTH_SERVER_URL:-http://system:8082}
      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD:-sentinel-dashboard:8858}
      - ROCKETMQ_NAME_SERVER=${ROCKETMQ_NAME_SERVER:-rocketmq-namesrv:9876}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - JAVA_OPTS=${GATEWAY_JAVA_OPTS:--server -XX:+UseG1GC -Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      nacos:
        condition: service_healthy

  # 系统服务
  system:
    build:
      context: ./eagle-system-service
      dockerfile: Dockerfile
    image: eagle-system:1.0.0
    pull_policy: build           # 本地构建镜像，禁止 docker compose up 时去 registry 拉
    container_name: eagle-system
    restart: always
    ports:
      - "8082:8082"
    networks:
      - eagle-network
    # 开发环境内存上限：system 跑 OAuth2/JPA/Hibernate/MapStruct，堆需 768m
    # 容器总量 1.5g = 堆 768m + 元空间 256m + 直接内存 + 线程栈 + 余量
    mem_limit: 1536m
    mem_reservation: 768m
    # environment 显式枚举所有关键变量，统一 ${VAR:-default} 插值
    # 默认值已包含容器网络约束（mysql:3306 / redis:6379 / nacos:8848 / SERVER_PORT=8082），.env 可整体覆盖
    # 注意：.env 文件中的变量仅用于 compose.yml 的 ${VAR} 插值，必须在此 environment 段显式声明才会注入容器
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SERVER_PORT=${SERVER_PORT:-8082}
      # Nacos 注册中心
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-}
      - NACOS_GROUP=${NACOS_GROUP:-DEFAULT_GROUP}
      # Nacos 3.0+ 默认开启鉴权，客户端必须传账号密码
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-}
      # 多机部署时改为宿主机/公网 IP；单机留空，客户端自动取容器 IP
      - NACOS_REGISTER_IP=${NACOS_REGISTER_IP:-}
      # MySQL 数据源（application.yml 占位符：${DB_HOST}/${DB_PORT}/${DB_NAME}/${DB_USERNAME}/${DB_PASSWORD}）
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-eagle}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root123456}
      - DB_POOL_MAX=${DB_POOL_MAX:-50}
      - DB_POOL_MIN=${DB_POOL_MIN:-10}
      # Redis（application.yml 占位符：${REDIS_HOST}/${REDIS_PORT}/${REDIS_PASSWORD}/${REDIS_DATABASE}）
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123456}
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
      # RocketMQ（消息组件）
      - ROCKETMQ_NAME_SERVER=${ROCKETMQ_NAME_SERVER:-rocketmq-namesrv:9876}
      # 初始管理员（application.yml 中 EAGLE_ADMIN_PASSWORD 无默认值，缺失即 fail-fast）
      - EAGLE_ADMIN_USERNAME=${EAGLE_ADMIN_USERNAME:-admin}
      - EAGLE_ADMIN_PASSWORD=${EAGLE_ADMIN_PASSWORD}
      - EAGLE_ADMIN_NAME=${EAGLE_ADMIN_NAME:-系统管理员}
      - EAGLE_ADMIN_EMAIL=${EAGLE_ADMIN_EMAIL:-admin@eagle.com}
      # JWT keystore
      - EAGLE_JWT_KEYSTORE_LOCATION=${EAGLE_JWT_KEYSTORE_LOCATION:-classpath:jwt-keystore.p12}
      - EAGLE_JWT_KEYSTORE_PASSWORD=${EAGLE_JWT_KEYSTORE_PASSWORD:-eagle-jwt-dev-2026}
      # OAuth2 / Swagger 回调对外地址（浏览器侧可访问的 URL）
      - SYSTEM_SERVER_URL=${SYSTEM_SERVER_URL:-http://localhost:8082}
      - GATEWAY_URL=${GATEWAY_URL:-http://localhost:8080}
      # 第三方登录（按需启用，留空 = 禁用）
      - WECHAT_MINI_APP_ID=${WECHAT_MINI_APP_ID:-}
      - WECHAT_MINI_APP_SECRET=${WECHAT_MINI_APP_SECRET:-}
      - WECHAT_WEB_APP_ID=${WECHAT_WEB_APP_ID:-}
      - WECHAT_WEB_APP_SECRET=${WECHAT_WEB_APP_SECRET:-}
      - WECHAT_WEB_REDIRECT_URI=${WECHAT_WEB_REDIRECT_URI:-}
      - WECHAT_MP_APP_ID=${WECHAT_MP_APP_ID:-}
      - WECHAT_MP_APP_SECRET=${WECHAT_MP_APP_SECRET:-}
      - WECHAT_MP_REDIRECT_URI=${WECHAT_MP_REDIRECT_URI:-}
      # 阿里云短信
      - ALIYUN_SMS_ACCESS_KEY_ID=${ALIYUN_SMS_ACCESS_KEY_ID:-}
      - ALIYUN_SMS_ACCESS_KEY_SECRET=${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME:-}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE:-}
      - JAVA_OPTS=${SYSTEM_JAVA_OPTS:--server -XX:+UseG1GC -Xms384m -Xmx768m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
