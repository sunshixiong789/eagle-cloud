# -------- 开发本地最低配 ----------
# 目标:8~16G 开发机本地全栈跑起来,总 mem_limit 约 6.5G(留给 IDE/浏览器)。
# 生产部署请用同目录 docker-compose.prod.yml(资源/JVM/安全配置面均不同,不要互相套用)。
#
# JVM 堆默认值面向"能跑起来 + 留出 GC 头部空间";不追求吞吐与延迟。
# 业务真要压测,改 .env.prod 覆盖各服务的 *_JAVA_OPTS / *_MEM_LIMIT。
#
# 变量管理约定:
#   1. environment 显式枚举所有变量,统一 ${VAR:-default} 形式 —— compose.yml 是"变量清单 + 默认值"
#   2. dev / prod 各自一个自包含 env 文件(均在本目录),互不依赖:
#        本文件(docker-compose.yml) 配 .env.prod.dev      —— dev 全套值 + 机密,gitignore
#        docker-compose.prod.yml    配 .env.prod.prod     —— prod 全套值 + 机密,gitignore
#        模板见 .env.prod.dev.example / .env.prod.prod.example;首次 cp 出对应实文件后填机密
#   3. 启动(命令行):docker compose --env-file .env.prod.dev up -d
#      IDEA 一键:Docker Compose 运行配置里 Environment variables file=.env.prod.dev,点绿三角即部署
#      注意:传了 --env-file 后 compose 不再自动加载裸 .env.prod,口径以 .env.prod.dev 为准
#   4. 优先级(高 → 低):shell 环境变量 > --env-file(.env.prod.dev) > environment 默认值
#   5. healthcheck / command 中引用敏感字段(密码)也采用 ${VAR:-default} 插值,确保 env 覆盖后整体一致
#   6. 新增凭证:在 .env.prod.dev / .env.prod.prod 各自写值 + 在 environment 加 `KEY=${KEY}` 占位(让 compose.yml 始终是变量清单)
#
# IDE 远程调试(JDWP):
#   auth   → 127.0.0.1:5105   (容器内 *:5105)
#   system → 127.0.0.1:5106   (容器内 *:5106)
#   gateway→ 127.0.0.1:5107   (容器内 *:5107)
#   端口规划:5005/5006/5007 留给 ease-mind-servers (user/product/trade),
#           eagle-cloud 错开整段用 5105/5106/5107,后续新服务沿 51xx 递增
#   IntelliJ IDEA: Run → Edit Configurations → + → Remote JVM Debug → Host=localhost / Port=5105|5106|5107
#   调试参数通过 JAVA_TOOL_OPTIONS 注入(JVM 标准变量,与 JAVA_OPTS 自动合并),
#   关闭调试:在 .env.prod 里设 AUTH_DEBUG_OPTS="" / SYSTEM_DEBUG_OPTS="" / GATEWAY_DEBUG_OPTS=""
networks:
  eagle-network:
    name: eagle-network
    driver: bridge

# 数据卷（named volumes，由 docker 自动创建并持久化）
volumes:
  postgres-data:
  redis-data:
  consul-data:
  rabbitmq-data:
  # system-service 本地上传文件落盘目录(对应 Dockerfile 的 /data/eagle/storage)。
  # 命名卷首次创建继承镜像内该目录的 spring:spring owner,非 root 用户可写。
  system-storage:

services:
  # PostgreSQL 数据库 — compose 内唯一数据源；DB_USERNAME/DB_PASSWORD/DB_NAME 与 system 服务共用同一组 .env.prod 变量
  postgres:
    image: postgres:16
    container_name: eagle-postgres
    restart: always
    ports:
      - "5432:5432"
    networks:
      - eagle-network
    environment:
      - POSTGRES_DB=${DB_NAME:-eagle_system}
      - POSTGRES_USER=${DB_USERNAME:-eagle}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-eagle123456}
      # AUTH_DB_NAME 由 postgres-init/01-create-auth-db.sh 读取，用于创建附属库
      - AUTH_DB_NAME=${AUTH_DB_NAME:-eagle_auth}
      # PAYMENT_DB_NAME 由 postgres-init/02-create-payment-db.sh 读取，用于创建附属库
      - PAYMENT_DB_NAME=${PAYMENT_DB_NAME:-eagle_payment}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 多库初始化：首次启动时执行 ./postgres-init/*.sh 创建 eagle_auth 等附属库
      # 仅在 postgres-data 卷为空时触发；若需要重建：docker compose down -v
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # 开发本地最低配:三库(eagle_system/eagle_auth/eagle_payment)+ shared_buffers 默认 128m,512m 足够
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-eagle} -d ${DB_NAME:-eagle_system}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Redis 缓存
  redis:
    image: redis:8.6.1
    container_name: eagle-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - eagle-network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123456}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - redis-data:/data
    # maxmemory 256m + LRU 淘汰,避免开发期 AOF 累积把容器吃满
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123456} --maxmemory 200mb --maxmemory-policy allkeys-lru
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123456}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Consul 注册中心（单节点 dev-friendly server；取代 Nacos）
  consul:
    image: hashicorp/consul:1.20
    container_name: eagle-consul
    restart: always
    ports:
      - "8500:8500"       # HTTP API + Web UI
      - "8600:8600/udp"   # DNS
    networks:
      - eagle-network
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -data-dir=/consul/data
    mem_limit: 512m
    mem_reservation: 256m
    volumes:
      - consul-data:/consul/data
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8500/v1/status/leader" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # RabbitMQ（开发环境单机；management 插件自带可视化控制台 http://localhost:15672）
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: eagle-rabbitmq
    restart: always
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management 控制台
    networks:
      - eagle-network
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 认证服务（OAuth2 Authorization Server + 微信/短信登录）
  # 独立库 eagle_auth（由 postgres-init/01-create-auth-db.sh 首次启动时创建）
  auth:
    build:
      context: ./eagle-auth-service
      dockerfile: Dockerfile
    image: eagle-auth:1.0.0
    pull_policy: build           # 本地构建镜像，禁止 docker compose up 时去 registry 拉
    container_name: eagle-auth
    restart: always
    ports:
      - "9090:9090"
      # JDWP 调试端口,只绑 127.0.0.1,IDEA Remote JVM Debug 连 localhost:5105
      - "5105:5105"
    networks:
      - eagle-network
    # 开发本地最低配:auth 承载 OAuth2/JPA/Hibernate,堆 768m 可跑(压测请用 prod compose)
    mem_limit: 1024m
    mem_reservation: 512m
    # environment 显式枚举所有关键变量，统一 ${VAR:-default} 插值
    # 注意：DB_NAME 单独走 AUTH_DB_NAME 变量（默认 eagle_auth），与 system 的 DB_NAME 区分
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SERVER_PORT=${AUTH_SERVER_PORT:-9090}
      # Consul 注册中心
      - CONSUL_HOST=${CONSUL_HOST:-consul}
      - CONSUL_PORT=${CONSUL_PORT:-8500}
      - CONSUL_DISCOVERY_ENABLED=${CONSUL_DISCOVERY_ENABLED:-true}
      # 多机部署时改为宿主机/公网 IP；单机留空，客户端自动取容器 IP
      - CONSUL_INSTANCE_IP=${CONSUL_INSTANCE_IP:-}
      # PostgreSQL 数据源（auth 用独立的 eagle_auth 库）
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${AUTH_DB_NAME:-eagle_auth}
      - DB_USERNAME=${DB_USERNAME:-eagle}
      - DB_PASSWORD=${DB_PASSWORD:-eagle123456}
      - DB_POOL_MAX=${DB_POOL_MAX:-80}
      - DB_POOL_MIN=${DB_POOL_MIN:-20}
      # Redis
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123456}
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
      - REDIS_POOL_MAX_ACTIVE=${REDIS_POOL_MAX_ACTIVE:-96}
      - REDIS_POOL_MAX_IDLE=${REDIS_POOL_MAX_IDLE:-32}
      - REDIS_POOL_MIN_IDLE=${REDIS_POOL_MIN_IDLE:-8}
      - REDIS_POOL_MAX_WAIT=${REDIS_POOL_MAX_WAIT:-2000ms}
      # RabbitMQ 连接
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
      - RABBITMQ_EXCHANGE_PREFIX=${RABBITMQ_EXCHANGE_PREFIX:-}
      # 初始管理员（AdminProperties.password 无默认值，缺失即 fail-fast；AdminInitializer 启动时创建管理员账号）
      - EAGLE_ADMIN_USERNAME=${EAGLE_ADMIN_USERNAME:-admin}
      - EAGLE_ADMIN_PASSWORD=${EAGLE_ADMIN_PASSWORD}
      - EAGLE_ADMIN_NAME=${EAGLE_ADMIN_NAME:-系统管理员}
      - EAGLE_ADMIN_EMAIL=${EAGLE_ADMIN_EMAIL:-admin@eagle.com}
      # JWT keystore
      - EAGLE_JWT_KEYSTORE_LOCATION=${EAGLE_JWT_KEYSTORE_LOCATION:-classpath:jwt-keystore.p12}
      - EAGLE_JWT_KEYSTORE_PASSWORD=${EAGLE_JWT_KEYSTORE_PASSWORD:-eagle-jwt-dev-2026}
      # OAuth2 issuer: JWT iss claim 与资源服务器校验保持一致；集群部署必填稳定对外 URL
      - EAGLE_OAUTH_ISSUER=${EAGLE_OAUTH_ISSUER:-http://localhost:8080}
      # OAuth2 回调白名单: 逗号分隔，前端联调 / 多环境部署时在 .env.prod 覆盖
      - EAGLE_OAUTH_REDIRECT_URIS=${EAGLE_OAUTH_REDIRECT_URIS:-http://localhost:8080/auth/oauth2/callback}
      # OIDC RP-Initiated Logout 回跳白名单: 逗号分隔，前端整页跳 /connect/logout 时 post_logout_redirect_uri 必须命中
      - EAGLE_OAUTH_POST_LOGOUT_REDIRECT_URIS=${EAGLE_OAUTH_POST_LOGOUT_REDIRECT_URIS:-http://localhost:8000/auth/oauth2/logout/callback}
      # 第三方登录（按需启用，留空 = 禁用）
      - WECHAT_APP_APP_ID=${WECHAT_APP_APP_ID:-}
      - WECHAT_APP_APP_SECRET=${WECHAT_APP_APP_SECRET:-}
      - WECHAT_MINI_APP_ID=${WECHAT_MINI_APP_ID:-}
      - WECHAT_MINI_APP_SECRET=${WECHAT_MINI_APP_SECRET:-}
      - WECHAT_WEB_APP_ID=${WECHAT_WEB_APP_ID:-}
      - WECHAT_WEB_APP_SECRET=${WECHAT_WEB_APP_SECRET:-}
      - WECHAT_WEB_REDIRECT_URI=${WECHAT_WEB_REDIRECT_URI:-}
      - WECHAT_MP_APP_ID=${WECHAT_MP_APP_ID:-}
      - WECHAT_MP_APP_SECRET=${WECHAT_MP_APP_SECRET:-}
      - WECHAT_MP_REDIRECT_URI=${WECHAT_MP_REDIRECT_URI:-}
      # 淘宝登录（taobao_app grant）：enabled=true 才装配 TaobaoClient，用 access token 调 taobao.openuid.get 取 openUid
      - TAOBAO_APP_ENABLED=${TAOBAO_APP_ENABLED:-false}
      - TAOBAO_APP_KEY=${TAOBAO_APP_KEY:-}
      - TAOBAO_APP_SECRET=${TAOBAO_APP_SECRET:-}
      - TAOBAO_APP_SIGN_METHOD=${TAOBAO_APP_SIGN_METHOD:-md5}
      # Apple 登录（apple_app grant）：enabled=true 时必须同时提供 EAGLE_ENCRYPT_SECRET_KEY（refresh token 字段加密）
      - APPLE_AUTH_ENABLED=${APPLE_AUTH_ENABLED:-false}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-com.shengxinfast.app}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY:-}
      - EAGLE_ENCRYPT_SECRET_KEY=${EAGLE_ENCRYPT_SECRET_KEY:-}
      # App Store 审核固定验证码：SMS_MOCK_PHONES 填审核测试手机号（逗号分隔），白名单内不发真实短信，直接用 SMS_MOCK_CODE 登录；留空 = 关闭
      - SMS_MOCK_CODE=${SMS_MOCK_CODE:-123456}
      - SMS_MOCK_PHONES=${SMS_MOCK_PHONES:-}
      # 短信服务商切换（由 eagle-notification-starter 统一处理）
      - SMS_PROVIDER=${SMS_PROVIDER:-hnsls}
      - SMS_ACCESS_KEY_ID=${SMS_ACCESS_KEY_ID:-}
      - SMS_ACCESS_KEY_SECRET=${SMS_ACCESS_KEY_SECRET:-}
      - SMS_SIGN_NAME=${SMS_SIGN_NAME:-}
      - SMS_TEMPLATE_ID=${SMS_TEMPLATE_ID:-}
      # 腾讯云短信
      - TENCENT_SMS_SDK_APP_ID=${TENCENT_SMS_SDK_APP_ID:-}
      - TENCENT_SMS_REGION=${TENCENT_SMS_REGION:-ap-guangzhou}
      # 手拉手短信
      - HNSLS_SMS_USERNAME=${HNSLS_SMS_USERNAME:-}
      - HNSLS_SMS_PASSWORD=${HNSLS_SMS_PASSWORD:-}
      - HNSLS_SMS_CONTENT_TEMPLATE=${HNSLS_SMS_CONTENT_TEMPLATE:-您的验证码是{code}，5分钟内有效。}
      - HNSLS_SMS_SEND_URL=${HNSLS_SMS_SEND_URL:-https://xapi.hnsls.com.cn/eums/sms/utf8/send.do}
      - HNSLS_SMS_CHARSET=${HNSLS_SMS_CHARSET:-UTF-8}
      - JAVA_OPTS=${AUTH_JAVA_OPTS:--server -XX:+UseG1GC -Xms384m -Xmx640m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
      # JDWP 调试参数:JVM 标准变量,启动时自动与 JAVA_OPTS 合并,设空字符串即可关闭调试
      - JAVA_TOOL_OPTIONS=${AUTH_DEBUG_OPTS:--agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5105}
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 系统服务
  system:
    build:
      context: ./eagle-system-service
      dockerfile: Dockerfile
    image: eagle-system:1.0.0
    pull_policy: build           # 本地构建镜像，禁止 docker compose up 时去 registry 拉
    container_name: eagle-system
    restart: always
    ports:
      - "8082:8082"
      # JDWP 调试端口,只绑 127.0.0.1,IDEA Remote JVM Debug 连 localhost:5106
      - "5106:5106"
    networks:
      - eagle-network
    # 开发本地最低配:system 模块多(base+auth-event+config),堆 1g 保守起步,真不够再上调
    mem_limit: 1536m
    mem_reservation: 768m
    # environment 显式枚举所有关键变量，统一 ${VAR:-default} 插值
    # 默认值已包含容器网络约束（postgres:5432 / redis:6379 / consul:8500 / SERVER_PORT=8082），.env.prod 可整体覆盖
    # 注意：.env.prod 文件中的变量仅用于 compose.yml 的 ${VAR} 插值，必须在此 environment 段显式声明才会注入容器
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SERVER_PORT=${SERVER_PORT:-8082}
      # Consul 注册中心
      - CONSUL_HOST=${CONSUL_HOST:-consul}
      - CONSUL_PORT=${CONSUL_PORT:-8500}
      - CONSUL_DISCOVERY_ENABLED=${CONSUL_DISCOVERY_ENABLED:-true}
      # 多机部署时改为宿主机/公网 IP；单机留空，客户端自动取容器 IP
      - CONSUL_INSTANCE_IP=${CONSUL_INSTANCE_IP:-}
      # PostgreSQL 数据源（system-service 在 9550fdb 已切 PG;application.yml 占位符：
      # ${DB_HOST}/${DB_PORT}/${DB_NAME}/${DB_USERNAME}/${DB_PASSWORD}）
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-eagle_system}
      - DB_USERNAME=${DB_USERNAME:-eagle}
      - DB_PASSWORD=${DB_PASSWORD:-eagle123456}
      - DB_POOL_MAX=${DB_POOL_MAX:-80}
      - DB_POOL_MIN=${DB_POOL_MIN:-20}
      # Redis（application.yml 占位符：${REDIS_HOST}/${REDIS_PORT}/${REDIS_PASSWORD}/${REDIS_DATABASE}）
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123456}
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
      - REDIS_POOL_MAX_ACTIVE=${REDIS_POOL_MAX_ACTIVE:-96}
      - REDIS_POOL_MAX_IDLE=${REDIS_POOL_MAX_IDLE:-32}
      - REDIS_POOL_MIN_IDLE=${REDIS_POOL_MIN_IDLE:-8}
      - REDIS_POOL_MAX_WAIT=${REDIS_POOL_MAX_WAIT:-2000ms}
      # RabbitMQ 连接
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
      - RABBITMQ_EXCHANGE_PREFIX=${RABBITMQ_EXCHANGE_PREFIX:-}
      # 初始管理员 username —— system-service 端 AccountEventApplicationService 据此判定哪个
      # User 应被赋予 admin 角色,与 auth-service 共用同一 EAGLE_ADMIN_USERNAME 保持两侧一致。
      # PASSWORD/NAME/EMAIL 仅 auth-service 使用,system 侧不读,故此处不注入。
      - EAGLE_ADMIN_USERNAME=${EAGLE_ADMIN_USERNAME:-admin}
      # JWT keystore
      - EAGLE_JWT_KEYSTORE_LOCATION=${EAGLE_JWT_KEYSTORE_LOCATION:-classpath:jwt-keystore.p12}
      - EAGLE_JWT_KEYSTORE_PASSWORD=${EAGLE_JWT_KEYSTORE_PASSWORD:-eagle-jwt-dev-2026}
      # OAuth2 issuer: 集群部署必填,所有 system 实例共用同一个对外稳定 URL(LB / 网关)
      - EAGLE_OAUTH_ISSUER=${EAGLE_OAUTH_ISSUER:-http://localhost:8080}
      # OAuth2 回调白名单: 逗号分隔,与 application.yml 默认值保持一致;
      # 前端联调 / 多环境部署时在 .env.prod 覆盖,补上额外的回调地址
      - EAGLE_OAUTH_REDIRECT_URIS=${EAGLE_OAUTH_REDIRECT_URIS:-http://localhost:8080/auth/oauth2/callback}
      # OIDC RP-Initiated Logout 回跳白名单: 与 auth-service 块对仗;system 自身不消费,但保持配置面一致
      - EAGLE_OAUTH_POST_LOGOUT_REDIRECT_URIS=${EAGLE_OAUTH_POST_LOGOUT_REDIRECT_URIS:-http://localhost:8000/auth/oauth2/logout/callback}
      # OAuth2 资源服务器 JWKS endpoint: 直连 auth-service(service name=auth, 端口 9090),
      # 不走 OIDC discovery 以规避 auth 容器未就绪时的 503 + 重启风暴(memory 1588/1589)
      - EAGLE_OAUTH_JWK_SET_URI=${EAGLE_OAUTH_JWK_SET_URI:-http://auth:9090/oauth2/jwks}
      # 第三方登录（按需启用，留空 = 禁用）
      - WECHAT_MINI_APP_ID=${WECHAT_MINI_APP_ID:-}
      - WECHAT_MINI_APP_SECRET=${WECHAT_MINI_APP_SECRET:-}
      - WECHAT_WEB_APP_ID=${WECHAT_WEB_APP_ID:-}
      - WECHAT_WEB_APP_SECRET=${WECHAT_WEB_APP_SECRET:-}
      - WECHAT_WEB_REDIRECT_URI=${WECHAT_WEB_REDIRECT_URI:-}
      - WECHAT_MP_APP_ID=${WECHAT_MP_APP_ID:-}
      - WECHAT_MP_APP_SECRET=${WECHAT_MP_APP_SECRET:-}
      - WECHAT_MP_REDIRECT_URI=${WECHAT_MP_REDIRECT_URI:-}
      # 短信服务商切换（由 eagle-notification-starter 统一处理）
      - SMS_PROVIDER=${SMS_PROVIDER:-hnsls}
      - SMS_ACCESS_KEY_ID=${SMS_ACCESS_KEY_ID:-}
      - SMS_ACCESS_KEY_SECRET=${SMS_ACCESS_KEY_SECRET:-}
      - SMS_SIGN_NAME=${SMS_SIGN_NAME:-}
      - SMS_TEMPLATE_ID=${SMS_TEMPLATE_ID:-}
      # 手拉手短信特有配置
      - HNSLS_SMS_USERNAME=${HNSLS_SMS_USERNAME:-}
      - HNSLS_SMS_PASSWORD=${HNSLS_SMS_PASSWORD:-}
      - HNSLS_SMS_CONTENT_TEMPLATE=${HNSLS_SMS_CONTENT_TEMPLATE:-您的验证码是{code}，5分钟内有效。}
      - HNSLS_SMS_SEND_URL=${HNSLS_SMS_SEND_URL:-https://xapi.hnsls.com.cn/eums/sms/utf8/send.do}
      - HNSLS_SMS_CHARSET=${HNSLS_SMS_CHARSET:-UTF-8}
      - JAVA_OPTS=${SYSTEM_JAVA_OPTS:--server -XX:+UseG1GC -Xms512m -Xmx1024m -XX:MaxMetaspaceSize=320m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
      # JDWP 调试参数:JVM 标准变量,启动时自动与 JAVA_OPTS 合并,设空字符串即可关闭调试
      - JAVA_TOOL_OPTIONS=${SYSTEM_DEBUG_OPTS:--agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5106}
    volumes:
      - system-storage:/data/eagle/storage
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  # 网关服务（放在最后：依赖 auth + system 注册到 Consul 后才能完成路由 lb）
  gateway:
    build:
      context: ./eagle-gateway-service
      dockerfile: Dockerfile
    image: eagle-gateway:1.0.0
    pull_policy: build           # 本地构建镜像，禁止 docker compose up 时去 registry 拉
    container_name: eagle-gateway
    restart: always
    ports:
      - "8080:8080"
      # JDWP 调试端口,只绑 127.0.0.1,IDEA Remote JVM Debug 连 localhost:5107
      - "5107:5107"
    networks:
      - eagle-network
    # 开发本地最低配:gateway 是 WebFlux 反应式,堆需求小;512m 上限够路由 + 限流
    mem_limit: 512m
    mem_reservation: 256m
    # environment 显式枚举所有关键变量，统一 ${VAR:-default} 插值
    # 默认值已包含容器网络约束（consul:8500 / auth:9090 / system:8082），.env.prod 可整体覆盖
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      # Consul 注册中心
      - CONSUL_HOST=${CONSUL_HOST:-consul}
      - CONSUL_PORT=${CONSUL_PORT:-8500}
      - CONSUL_DISCOVERY_ENABLED=${CONSUL_DISCOVERY_ENABLED:-true}
      # 多机部署时改为宿主机/公网 IP；单机留空，客户端自动取容器 IP
      - CONSUL_INSTANCE_IP=${CONSUL_INSTANCE_IP:-}
      # AUTH_SERVER_URL: gateway 走 Consul lb://auth，此处仅为兼容历史显式直连
      - AUTH_SERVER_URL=${AUTH_SERVER_URL:-http://auth:9090}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - JAVA_OPTS=${GATEWAY_JAVA_OPTS:--server -XX:+UseG1GC -Xms192m -Xmx320m -XX:MaxMetaspaceSize=192m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
      # JDWP 调试参数:JVM 标准变量,启动时自动与 JAVA_OPTS 合并,设空字符串即可关闭调试
      - JAVA_TOOL_OPTIONS=${GATEWAY_DEBUG_OPTS:--agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5107}
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
