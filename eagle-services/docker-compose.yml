# -------只适用于开发环境----------
# 网络配置
networks:
  eagle-network:
    driver: bridge

# 数据卷（named volumes，由 docker 自动创建并持久化）
volumes:
  mysql-data:
  redis-data:
  nacos-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0.30
    container_name: eagle-mysql
    restart: always
    ports:
      - "3306:3306"
    networks:
      - eagle-network
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=eagle
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis 缓存
  redis:
    image: redis:8.6.1
    container_name: eagle-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - eagle-network
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass redis123456
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redis123456", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nacos 注册中心
  nacos:
    image: nacos/nacos-server:v3.2.1
    container_name: eagle-nacos
    restart: always
    ports:
      # Nacos v3 新版控制台容器内端口 8080；为避免与 gateway 主机 8080 冲突，主机映射为 8090
      - "8090:8080"
      - "8848:8848"
      - "9848:9848"
    networks:
      - eagle-network
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
      - TZ=Asia/Shanghai
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      # Nacos v3.x 把控制台拆成独立 Tomcat：
      #   - 容器内 8080：新版 Console（context path 是 /，无 /nacos 前缀）
      #   - 容器内 8848：Server OpenAPI（保留 /nacos 前缀）
      # 旧的 /nacos/v1/console/health/readiness 在 v3 已移除（启动日志：No mapping for GET ...）；
      # actuator 端点默认未暴露（启动日志：Exposing 0 endpoints beneath base path '/actuator'）。
      # healthcheck 在容器内执行，必须用容器内端口（不是 ports 映射出去的主机端口 8090）。
      # 直接探容器内 8080 的根路径——Tomcat 启动后稳定返回 200，且 standalone 模式下
      # Console 与 Server 同进程同启动，Console 就绪即代表 Nacos 可用。
      test: [ "CMD-SHELL", "curl -fsS -o /dev/null -m 3 http://127.0.0.1:8080/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Sentinel Dashboard（开发环境单机，控制台 8858；默认账号 sentinel/sentinel）
  # 客户端通过 SENTINEL_DASHBOARD=sentinel-dashboard:8858 上报心跳与拉取规则
  # 镜像来源：本地 Dockerfile 拉取 Alibaba 官方发布的 fat jar（不依赖第三方 docker hub 镜像）
  sentinel-dashboard:
    build:
      context: ./sentinel-dashboard
      args:
        SENTINEL_VERSION: 1.8.9
    image: eagle-sentinel-dashboard:1.8.9
    pull_policy: build           # 本地构建镜像，禁止 docker compose up 时去 registry 拉
    container_name: eagle-sentinel
    restart: always
    ports:
      - "8858:8858"
    networks:
      - eagle-network
    environment:
      # 启动参数：固定监听 8858 + dashboard 自监控地址 + project.name 区分集群
      # 1.8.6+ 默认开启鉴权（账号/密码 sentinel/sentinel），如需自定义加：
      # -Dsentinel.dashboard.auth.username=xxx -Dsentinel.dashboard.auth.password=xxx
      - JAVA_OPTS=-server -Xms256m -Xmx512m -Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard
      - TZ=Asia/Shanghai
    mem_limit: 768m
    mem_reservation: 256m
    healthcheck:
      # Sentinel Dashboard 是 Spring Boot 应用，根路径返回 200 即视为就绪
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8858/ > /dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # RocketMQ NameServer（开发环境单机，9876）
  # 仅做路由注册；Broker 启动后向其汇报，客户端通过它发现 Broker 地址
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: eagle-rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    networks:
      - eagle-network
    environment:
      # NameServer 资源消耗低，限制内存避免占用过多开发机资源
      - JAVA_OPT_EXT=-server -Xms512m -Xmx512m -Xmn256m
      - TZ=Asia/Shanghai
    command: sh mqnamesrv
    mem_limit: 768m
    mem_reservation: 384m
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  # RocketMQ Broker（开发环境单机 master，无 slave）
  # brokerIP1 必须指定为容器服务名（rocketmq-broker），否则其他容器拿到默认宿主 IP 后无法连上
  # autoCreateTopicEnable=true：开发环境允许首次发送时自动建 Topic（生产应关闭，由运维预创建）
  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: eagle-rocketmq-broker
    restart: always
    ports:
      - "10909:10909"   # VIP channel
      - "10911:10911"   # Broker 主端口（客户端读写）
      - "10912:10912"   # HA 同步端口（单机也开放，便于后续扩主从）
    networks:
      - eagle-network
    depends_on:
      - rocketmq-namesrv
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:9876
      # Broker 默认堆 8g 太大；开发机收紧到 1g
      - JAVA_OPT_EXT=-server -Xms1g -Xmx1g -Xmn512m
      - TZ=Asia/Shanghai
    # 内联生成 broker.conf：单机 master + 自动建 Topic/订阅组；brokerIP1 指向容器服务名
    command: >
      sh -c "printf 'brokerIP1=rocketmq-broker\nbrokerName=broker-a\nbrokerId=0\nbrokerClusterName=DefaultCluster\nautoCreateTopicEnable=true\nautoCreateSubscriptionGroup=true\n' > /home/rocketmq/broker.conf
      && sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf"
    mem_limit: 1536m
    mem_reservation: 768m
    volumes:
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store

  # 网关服务
  gateway:
    build:
      context: ./eagle-gateway-service
      dockerfile: Dockerfile
    image: eagle-gateway:1.0.0
    pull_policy: build           # 本地构建镜像，禁止 docker compose up 时去 registry 拉
    container_name: eagle-gateway
    restart: always
    ports:
      - "8080:8080"
    networks:
      - eagle-network
    # .env 用于敏感凭证 / 可调项（OAuth2 回调、第三方 secret 等），见 .env.example
    env_file:
      - .env
    # 开发环境内存上限：堆 512m + 元空间 192m + 直接内存 + 线程栈 → 容器留 768m 余量
    mem_limit: 768m
    mem_reservation: 384m
    # environment 优先级高于 env_file，写容器网络强约束（即使 .env 误填 localhost 也能兜底）
    # SPRING_PROFILES_ACTIVE 通过 .env 注入（默认 prod；dev/local 可选）
    # AUTH_SERVER_URL 强约束 system 容器端口为 8082，覆盖 .env 的 :80 默认
    # SENTINEL_DASHBOARD 强约束容器服务名，覆盖 .env 空值默认（application.yml 中 ${SENTINEL_DASHBOARD:} 为空时不连）
    # JAVA_OPTS 开发环境固定堆 256m–512m + G1GC + OOM heap dump
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - NACOS_SERVER_ADDR=nacos:8848
      - AUTH_SERVER_URL=http://system:8082
      - SENTINEL_DASHBOARD=sentinel-dashboard:8858
      - JAVA_OPTS=-server -XX:+UseG1GC -Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      nacos:
        condition: service_healthy
      system:
        condition: service_healthy
      sentinel-dashboard:
        condition: service_started

  # 系统服务
  system:
    build:
      context: ./eagle-system-service
      dockerfile: Dockerfile
    image: eagle-system:1.0.0
    pull_policy: build           # 本地构建镜像，禁止 docker compose up 时去 registry 拉
    container_name: eagle-system
    restart: always
    ports:
      - "8082:8082"
    networks:
      - eagle-network
    # .env 提供敏感凭证 / 可调项（admin 密码、JWT keystore 密码、微信 secret 等），见 .env.example
    env_file:
      - .env
    # 开发环境内存上限：system 跑 OAuth2/JPA/Hibernate/MapStruct，堆需 768m
    # 容器总量 1.5g = 堆 768m + 元空间 256m + 直接内存 + 线程栈 + 余量
    mem_limit: 1536m
    mem_reservation: 768m
    # environment 优先级高于 env_file，强约束 nacos 容器内主机名
    # SPRING_PROFILES_ACTIVE 通过 .env 注入（默认 prod；dev/local 可选）
    # SERVER_PORT 强约束容器内监听 8082，与 ports 主机映射 8082:8082 对齐（覆盖 application.yml 默认 80）
    # JAVA_OPTS 开发环境固定堆 384m–768m + G1GC + OOM heap dump
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - NACOS_SERVER_ADDR=nacos:8848
      - SERVER_PORT=8082
      - JAVA_OPTS=-server -XX:+UseG1GC -Xms384m -Xmx768m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started

