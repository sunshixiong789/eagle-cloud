# -------只适用于开发环境----------
version: '3.8'
# 网络配置
networks:
  eagle-network:
    driver: bridge

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0.30
    container_name: eagle-mysql
    restart: always
    ports:
      - "3306:3306"
    networks:
      - eagle-network
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=eagle
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis 缓存
  redis:
    image: redis:8.6.1
    container_name: eagle-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - eagle-network
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass redis123456
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redis123456", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nacos 注册中心
  nacos:
    image: nacos/nacos-server:v3.2.1
    container_name: eagle-nacos
    restart: always
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
    networks:
      - eagle-network
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
      - TZ=Asia/Shanghai
    volumes:
      - nacos-data:/home/nacos/data

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: eagle-rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    networks:
      - eagle-network
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPT_EXT=-server -Xms256m -Xmx256m -Xmn128m
    command: sh mqnamesrv

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: eagle-rocketmq-broker
    restart: always
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    networks:
      - eagle-network
    environment:
      - TZ=Asia/Shanghai
      - NAMESRV_ADDR=rocketmq-namesrv:9876
      - JAVA_OPT_EXT=-server -Xms512m -Xmx512m -Xmn256m
    volumes:
      - rocketmq-broker-store:/home/rocketmq/store
    command: sh mqbroker -n rocketmq-namesrv:9876 autoCreateTopicEnable=true
    depends_on:
      - rocketmq-namesrv

  # 网关服务
  gateway:
    build:
      context: ./eagle-gateway-server
      dockerfile: Dockerfile
    image: eagle-gateway:1.0.0
    container_name: eagle-gateway
    restart: always
    ports:
      - "8080:8080"
    networks:
      - eagle-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-server -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      authorization:
        condition: service_healthy
      system:
        condition: service_healthy

  # 系统服务
  system:
    build:
      context: ./eagle-system-server
      dockerfile: Dockerfile
    image: eagle-system:1.0.0
    container_name: eagle-system
    restart: always
    ports:
      - "8082:8082"
    networks:
      - eagle-network
    environment:
      - JAVA_OPTS=-server -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

