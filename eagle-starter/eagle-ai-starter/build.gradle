dependencies {
    api project(':eagle-starter:eagle-common-starter')

    // Spring AI 核心：Advisor API（BaseAdvisor/ChatClientRequest/ChatClientResponse 等）
    // 2.0.0-RC2 中 spring-ai-autoconfigure-model-chat-client 将此声明为 optional，需显式引入
    api 'org.springframework.ai:spring-ai-client-chat'
    // ChatClient.Builder 自动配置
    api 'org.springframework.ai:spring-ai-autoconfigure-model-chat-client'

    // Micrometer：Token 用量指标（TokenUsageAdvisor 依赖）
    api 'io.micrometer:micrometer-core'

    // Redis：可选，RedisChatMemoryRepository + AiRateLimitAdvisor + TokenBudgetAdvisor 依赖
    compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'

    // Jackson：Redis 序列化依赖
    compileOnly 'tools.jackson.core:jackson-databind'

    // Bean Validation：AiProperties @Validated 依赖
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'

    // Vector Store：可选，EagleAiEmbeddingAutoConfiguration 依赖
    compileOnly 'org.springframework.ai:spring-ai-vector-store'

    // Resilience4J：可选，EagleAiResilienceAutoConfiguration 依赖
    compileOnly 'io.github.resilience4j:resilience4j-circuitbreaker'
    compileOnly 'io.github.resilience4j:resilience4j-timelimiter'

    // 以下提供商由消费方按需选择，示例：
    //   implementation 'org.springframework.ai:spring-ai-starter-model-openai'   // OpenAI / Azure OpenAI
    //   implementation 'org.springframework.ai:spring-ai-starter-model-ollama'   // 本地 Ollama
    //   implementation 'org.springframework.ai:spring-ai-starter-model-anthropic' // Anthropic Claude
    compileOnly 'org.springframework.ai:spring-ai-starter-model-openai'
    compileOnly 'org.springframework.ai:spring-ai-starter-model-ollama'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'tools.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
}
