dependencies {
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'com.github.f4b6a3:uuid-creator'

    // Context Propagation — 自动桥接 ThreadLocal/MDC 与 Reactor Context
    // 通过 api 暴露给消费方 starter（tenant / idempotency 等）按需注册自己的 ThreadLocalAccessor
    api 'io.micrometer:context-propagation'

    compileOnly 'org.springframework.security:spring-security-core'
    compileOnly 'org.springframework:spring-webmvc'
    compileOnly 'org.springframework:spring-webflux'
    compileOnly 'org.springframework.data:spring-data-commons'
    compileOnly 'com.fasterxml.jackson.core:jackson-databind'
    compileOnly 'org.apache.tomcat.embed:tomcat-embed-core'
    compileOnly 'io.micrometer:micrometer-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-core'
    testImplementation 'org.springframework:spring-webmvc'
    testImplementation 'org.springframework:spring-webflux'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.apache.tomcat.embed:tomcat-embed-core'
    testImplementation 'io.micrometer:micrometer-core'
    testImplementation 'org.mockito:mockito-core'
}
