dependencies {
    api project(':eagle-starter:eagle-common-starter')
    compileOnly 'com.alipay.sdk:alipay-sdk-java'
    compileOnly 'com.github.wechatpay-apiv3:wechatpay-java'
    api 'org.springframework.boot:spring-boot-starter-web'

    // AlipayPaymentGateway 用 ObjectMapper 解析支付回调
    compileOnly 'tools.jackson.core:jackson-databind'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.alipay.sdk:alipay-sdk-java'
}
