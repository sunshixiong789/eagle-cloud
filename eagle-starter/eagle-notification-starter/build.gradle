dependencies {
    api project(':eagle-starter:eagle-common-starter')

    // 阿里云/腾讯云 SDK 仅在选用对应 provider 时由消费方显式引入；
    // starter 内部通过 @ConditionalOnClass 探测装配，保持"按需引入"。
    compileOnly 'com.aliyun:dysmsapi20170525'
    compileOnly 'com.tencentcloudapi:tencentcloud-sdk-java-sms'
    // Hnsls provider 走 HTTP，直接传递 spring-web；其他 starter 通常也已带 web。
    api 'org.springframework:spring-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-mail'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
