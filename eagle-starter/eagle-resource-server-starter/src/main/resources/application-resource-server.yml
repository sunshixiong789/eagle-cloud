# Eagle 资源服务器配置参考 只是作为参考的
# 将以下配置添加到业务服务的 application.yml 中

# Spring Boot 原生 JWT 资源服务器配置（必填）
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT 签发者 URI，需与授权服务器地址一致
          # Spring Boot 会自动从 {issuer-uri}/.well-known/openid-configuration 拉取公钥
          issuer-uri: http://localhost:8080
          # 或者直接指定 JWK Set URI（二选一）
          # jwk-set-uri: http://localhost:8080/oauth2/jwks