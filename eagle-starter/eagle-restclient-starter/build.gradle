dependencies {
    api project(':eagle-starter:eagle-common-starter')
    api 'org.springframework.boot:spring-boot-restclient'
    api 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    // 仅引入 spring-web，避免顺带把 Tomcat / Spring MVC 拖给 WebFlux 服务
    api 'org.springframework:spring-web'

    // EagleResponseErrorHandler 用 ObjectMapper 解析下游错误响应
    compileOnly 'tools.jackson.core:jackson-databind'

    // PropagatingHeadersClientHttpRequestInterceptor 仅在 servlet 环境装配；
    // 类编译需要 HttpServletRequest 符号，运行时由 servlet web 服务自身提供
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    // 可选：租户 ID 透传（eagle-tenant-starter 引入时生效）
    compileOnly project(':eagle-starter:eagle-tenant-starter')
    // 可选：Seata 分布式事务 XID 透传（seata-spring-boot-starter 引入时生效）
    compileOnly 'org.apache.seata:seata-spring-boot-starter'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'tools.jackson.core:jackson-databind'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
}
