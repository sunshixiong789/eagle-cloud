dependencies {
    api project(':eagle-starter:eagle-common-starter')

    // Snowflake / NanoId 由本 starter 自实现（原 hutool-all 已移除：仅用到 2 个类却引入巨型 jar，
    // 且其反射式工具类对 native image 不友好、无法被死代码消除）
    // TSID（time-sorted unique identifier）— 推荐用作数据库主键，64 位、按时间排序
    api 'com.github.f4b6a3:tsid-creator'
    // uuid-creator 已由 eagle-common-starter 传递（提供 UUID v7）

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
