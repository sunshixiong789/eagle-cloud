dependencies {
    api project(':eagle-starter:eagle-common-starter')

    // ShardingSphere JDBC core：含 YamlShardingSphereDataSourceFactory，不依赖 Spring Boot 自动配置
    // 排除 shardingsphere-test-util：5.5.0 POM bug，该 test artifact 被错误声明为编译依赖，公共仓库不存在
    api('org.apache.shardingsphere:shardingsphere-jdbc') {
        exclude group: 'org.apache.shardingsphere', module: 'shardingsphere-test-util'
    }

    // 读写分离需要 spring-jdbc DataSource 接口，由消费方 spring-boot-starter 传递，这里仅 compileOnly
    compileOnly 'org.springframework:spring-jdbc'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
}
