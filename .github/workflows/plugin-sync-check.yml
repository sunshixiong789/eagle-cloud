name: Plugin Sync Check

# 防止开发者改了 .claude/rules/ 或 eagle-starter/*/USAGE.md 但忘记跑 sync.sh
# 校验流程：跑一次 sync.sh，然后 git diff 应当为空（plugin 内容已与源一致）

on:
  pull_request:
    paths:
      - '.claude/rules/**'
      - '.claude/commands/**'
      - 'eagle-starter/**/USAGE.md'
      - 'claude-plugin/**'
  push:
    branches:
      - main
    paths:
      - '.claude/rules/**'
      - '.claude/commands/**'
      - 'eagle-starter/**/USAGE.md'
      - 'claude-plugin/**'

jobs:
  sync-check:
    name: Verify claude-plugin in sync with source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sync.sh
        run: |
          chmod +x ./claude-plugin/sync.sh
          ./claude-plugin/sync.sh

      - name: Verify plugin/ has no uncommitted changes
        run: |
          if ! git diff --quiet claude-plugin/; then
            echo "❌ claude-plugin/ is OUT OF SYNC with source files."
            echo ""
            echo "Diff:"
            git diff claude-plugin/
            echo ""
            echo "Fix: run './claude-plugin/sync.sh' locally and commit the result."
            exit 1
          fi
          echo "✅ claude-plugin/ is in sync with source"

  metadata-validation:
    name: Validate plugin metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate plugin.json
        run: |
          # 必备字段：name / version / description
          jq -e '.name and .version and .description' claude-plugin/plugin.json
          echo "✅ plugin.json is valid"

      - name: Validate marketplace.json
        run: |
          jq -e '.name and .plugins[0].name and .plugins[0].version' claude-plugin/marketplace.json
          echo "✅ marketplace.json is valid"

      - name: Validate version sync
        run: |
          PLUGIN_VER=$(jq -r '.version' claude-plugin/plugin.json)
          MARKET_VER=$(jq -r '.plugins[0].version' claude-plugin/marketplace.json)
          if [ "$PLUGIN_VER" != "$MARKET_VER" ]; then
            echo "❌ Version mismatch: plugin.json=$PLUGIN_VER but marketplace.json=$MARKET_VER"
            exit 1
          fi
          echo "✅ Versions match: $PLUGIN_VER"

      - name: Validate all SKILL.md have frontmatter
        run: |
          MISSING=0
          for f in claude-plugin/skills/*/SKILL.md; do
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "❌ Missing frontmatter: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "✅ All SKILL.md have frontmatter"
          fi
          exit $MISSING

      - name: Validate skills count matches USAGE.md count
        run: |
          USAGE_COUNT=$(find eagle-starter -maxdepth 3 -name 'USAGE.md' | wc -l | tr -d ' ')
          SKILL_COUNT=$(find claude-plugin/skills -name 'SKILL.md' | wc -l | tr -d ' ')
          if [ "$USAGE_COUNT" != "$SKILL_COUNT" ]; then
            echo "❌ Mismatch: $USAGE_COUNT USAGE.md but $SKILL_COUNT SKILL.md"
            echo "Did you add a new starter without updating sync.sh add_skill calls?"
            exit 1
          fi
          echo "✅ Counts match: $USAGE_COUNT starters / $SKILL_COUNT skills"
