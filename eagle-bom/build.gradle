plugins {
    id 'java-platform'
    id 'maven-publish'
}

// group / version 由根 allprojects 块统一管理（com.eagle:${version}，见 /build.gradle）

// 允许通过 api platform(...) 导入其他 BOM
javaPlatform {
    allowDependencies()
}

ext {
    // Spring 系
    springBootVersion = '4.1.0'
    springCloudVersion = '2025.1.2'
    springModulithVersion = '2.1.0'
    archunitVersion = '1.4.1'
    // 数据库 / 连接池
    mysqlConnectorVersion = '9.7.0'
    postgresqlVersion = '42.7.11'
    druidVersion = '1.2.28'

    // Redis
    // 4.6.0 起 starter 才改用 redisson-spring-data-41；4.5.0 及以前带的是 -40，
    // 其 RedissonConnection 按 Spring Data Redis 4.0 编译，在 4.1 上覆盖不到
    // set(byte[], byte[], SetCondition, Expiration)（4.1 改了参数类型与顺序），
    // 会落到接口 default 实现自递归 → 任何带 TTL 的 set 都 StackOverflowError。
    redissonVersion = '4.7.0'

    // 工具类
    uuidCreatorVersion = '6.1.1'
    tsidCreatorVersion = '5.2.6'
    caffeineVersion = '3.2.4'

    // API 文档
    springdocVersion = '3.0.3'

    // 对象存储
    minioVersion = '8.5.17'

    // 任务调度
    xxlJobVersion = '3.4.0'

    // 分布式事务（compileOnly 可选集成，见 eagle-restclient-starter/eagle-webclient-starter 的 SeataXid 透传）
    seataVersion = '2.6.0'

    // 分库分表
    shardingSphereVersion = '5.5.3'

    // 容错/熔断
    resilience4jVersion = '2.4.0'

    // 支付 SDK（消费方：ease-mind-servers/trade-service）
    // alipay-sdk-java 已移除：trade-service 自实现了支付宝网关协议（无 GraalVM native-image
    // reachability metadata 是移除动机）。微信支付渠道未启用（暂不涉及），wechatpay-java 一并移除。

    // Reactor / Micrometer Context Propagation
    contextPropagationVersion = '1.2.1'

    // Office 文档
    poiVersion = '5.5.1'
}

dependencies {
    // 导入官方 BOM（platform 形式）
    api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    api platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
    api platform("org.springframework.modulith:spring-modulith-bom:${springModulithVersion}")

    // 项目自管的版本约束（消费方无需写版本即可使用）
    // 用 add('api', ...) 显式调用 DependencyConstraintHandler.add，避免 IDEA 对动态 DSL 误报
    constraints {
        // 架构约束测试
        add('api', "com.tngtech.archunit:archunit-junit5:${archunitVersion}")

        // 数据库驱动
        add('api', "com.mysql:mysql-connector-j:${mysqlConnectorVersion}")
        add('api', "org.postgresql:postgresql:${postgresqlVersion}")

        // 连接池
        add('api', "com.alibaba:druid-spring-boot-3-starter:${druidVersion}")

        // Redis
        add('api', "org.redisson:redisson-spring-boot-starter:${redissonVersion}")

        // 工具类
        add('api', "com.github.f4b6a3:uuid-creator:${uuidCreatorVersion}")
        add('api', "com.github.f4b6a3:tsid-creator:${tsidCreatorVersion}")
        add('api', "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}")

        // API 文档
        add('api', "org.springdoc:springdoc-openapi-starter-common:${springdocVersion}")
        add('api', "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}")
        add('api', "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocVersion}")

        // Reactor / Micrometer Context Propagation（WebFlux 自动透传 MDC/ThreadLocal）
        add('api', "io.micrometer:context-propagation:${contextPropagationVersion}")

        // Office 文档
        add('api', "org.apache.poi:poi-ooxml:${poiVersion}")

        // 对象存储
        add('api', "io.minio:minio:${minioVersion}")

        // 分布式定时任务
        add('api', "com.xuxueli:xxl-job-core:${xxlJobVersion}")

        // 分布式事务
        add('api', "org.apache.seata:seata-spring-boot-starter:${seataVersion}")

        // 分库分表
        add('api', "org.apache.shardingsphere:shardingsphere-jdbc:${shardingSphereVersion}")

        // 容错/熔断
        add('api', "io.github.resilience4j:resilience4j-spring-boot4:${resilience4jVersion}")
        add('api', "io.github.resilience4j:resilience4j-micrometer:${resilience4jVersion}")
        add('api', "io.github.resilience4j:resilience4j-circuitbreaker:${resilience4jVersion}")
        add('api', "io.github.resilience4j:resilience4j-timelimiter:${resilience4jVersion}")

        // 内部 Starter 模块（消费方引用时无需写版本）
        add('api', "com.eagle:eagle-common-starter:${project.version}")
        add('api', "com.eagle:eagle-data-jpa-starter:${project.version}")
        add('api', "com.eagle:eagle-data-r2dbc-starter:${project.version}")
        add('api', "com.eagle:eagle-restclient-starter:${project.version}")
        add('api', "com.eagle:eagle-webclient-starter:${project.version}")
        add('api', "com.eagle:eagle-openapi-starter:${project.version}")
        add('api', "com.eagle:eagle-redis-starter:${project.version}")
        add('api', "com.eagle:eagle-resource-server-starter:${project.version}")
        add('api', "com.eagle:eagle-tracing-starter:${project.version}")
        add('api', "com.eagle:eagle-amqp-starter:${project.version}")
        add('api', "com.eagle:eagle-oss-minio-starter:${project.version}")
        add('api', "com.eagle:eagle-scheduler-starter:${project.version}")
        add('api', "com.eagle:eagle-sharding-starter:${project.version}")
        add('api', "com.eagle:eagle-resilience-starter:${project.version}")
        add('api', "com.eagle:eagle-encrypt-starter:${project.version}")
        add('api', "com.eagle:eagle-audit-log-starter:${project.version}")
        add('api', "com.eagle:eagle-idempotency-starter:${project.version}")
        add('api', "com.eagle:eagle-id-generator-starter:${project.version}")
        add('api', "com.eagle:eagle-websocket-starter:${project.version}")
    }
}

publishing {
    publications {
        // 显式声明 closure 入参类型，避免 IDEA Groovy DSL 推不出 register 的泛型 <U extends Publication>
        register('bom', MavenPublication) { MavenPublication pub ->
            pub.from components.javaPlatform
        }
    }
    // Nexus 仓库配置在根 build.gradle 的 configure(subprojects) 中统一注册
}
