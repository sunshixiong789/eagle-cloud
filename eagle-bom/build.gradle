plugins {
    id 'java-platform'
    id 'maven-publish'
}

// group / version 由根 allprojects 块统一管理（com.eagle:1.0.0-SNAPSHOT）

// 允许通过 api platform(...) 导入其他 BOM
javaPlatform {
    allowDependencies()
}

ext {
    // Spring 系
    springBootVersion = '4.0.3'
    springCloudVersion = '2025.1.1'
    springCloudAlibabaVersion = '2025.1.0.0'
    springModulithVersion = '2.0.5'

    // 数据库 / 连接池
    mysqlConnectorVersion = '9.7.0'
    postgresqlVersion = '42.7.11'
    druidVersion = '1.2.28'

    // Redis
    redissonVersion = '4.3.1'

    // 工具类
    hutoolVersion = '5.8.43'
    guavaVersion = '33.6.0-jre'
    commonsLang3Version = '3.20.0'
    commonsCollections4Version = '4.5.0'
    commonsIoVersion = '2.21.0'
    uuidCreatorVersion = '6.1.1'
    tsidCreatorVersion = '5.2.6'
    caffeineVersion = '3.2.3'

    // 第三方 SDK
    wxJavaVersion = '4.8.2-20260420.104332'
    aliyunSmsVersion = '4.5.1'

    // API 文档
    springdocVersion = '3.0.3'

    // 消息中间件
    rocketMqVersion = '2.3.5'

    // 对象存储
    minioVersion = '8.5.17'

    // 任务调度
    xxlJobVersion = '3.4.0'

    // 分布式事务
    seataVersion = '2.6.0'

    // ORM
    mybatisPlusVersion = '3.5.16'

    // 支付 SDK
    alipayVersion = '4.40.771.ALL'
    wechatpayVersion = '0.2.17'

    // 序列化
    fastjson2Version = '2.0.61'

    // Office 文档
    poiVersion = '5.5.1'

    // MapStruct
    mapstructVersion = '1.6.3'
    lombokMapstructVersion = '0.2.0'
}

dependencies {
    // 导入官方 BOM（platform 形式）
    api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    api platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
    api platform("com.alibaba.cloud:spring-cloud-alibaba-dependencies:${springCloudAlibabaVersion}")
    api platform("org.springframework.modulith:spring-modulith-bom:${springModulithVersion}")

    // 项目自管的版本约束（消费方无需写版本即可使用）
    // 用 add('api', ...) 显式调用 DependencyConstraintHandler.add，避免 IDEA 对动态 DSL 误报
    constraints {
        // 数据库驱动
        add('api', "com.mysql:mysql-connector-j:${mysqlConnectorVersion}")
        add('api', "org.postgresql:postgresql:${postgresqlVersion}")

        // 连接池
        add('api', "com.alibaba:druid-spring-boot-3-starter:${druidVersion}")

        // Redis
        add('api', "org.redisson:redisson-spring-boot-starter:${redissonVersion}")

        // 工具类
        add('api', "cn.hutool:hutool-all:${hutoolVersion}")
        add('api', "com.google.guava:guava:${guavaVersion}")
        add('api', "org.apache.commons:commons-lang3:${commonsLang3Version}")
        add('api', "org.apache.commons:commons-collections4:${commonsCollections4Version}")
        add('api', "commons-io:commons-io:${commonsIoVersion}")
        add('api', "com.github.f4b6a3:uuid-creator:${uuidCreatorVersion}")
        add('api', "com.github.f4b6a3:tsid-creator:${tsidCreatorVersion}")
        add('api', "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}")

        // 微信/第三方 SDK
        add('api', "com.github.binarywang:weixin-java-miniapp:${wxJavaVersion}")
        add('api', "com.aliyun:dysmsapi20170525:${aliyunSmsVersion}")

        // API 文档
        add('api', "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}")
        add('api', "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocVersion}")

        // 序列化
        add('api', "com.alibaba.fastjson2:fastjson2:${fastjson2Version}")

        // Office 文档
        add('api', "org.apache.poi:poi-ooxml:${poiVersion}")

        // MapStruct
        add('api', "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructVersion}")
        add('api', "org.mapstruct:mapstruct:${mapstructVersion}")
        add('api', "org.mapstruct:mapstruct-processor:${mapstructVersion}")

        // RocketMQ
        add('api', "org.apache.rocketmq:rocketmq-spring-boot-starter:${rocketMqVersion}")
        add('api', "org.apache.rocketmq:rocketmq-v5-client-spring-boot-starter:${rocketMqVersion}")

        // 对象存储
        add('api', "io.minio:minio:${minioVersion}")

        // 分布式定时任务
        add('api', "com.xuxueli:xxl-job-core:${xxlJobVersion}")

        // 分布式事务
        add('api', "org.apache.seata:seata-spring-boot-starter:${seataVersion}")

        // MyBatis-Plus
        add('api', "com.baomidou:mybatis-plus-spring-boot4-starter:${mybatisPlusVersion}")

        // 支付 SDK
        add('api', "com.alipay.sdk:alipay-sdk-java:${alipayVersion}")
        add('api', "com.github.wechatpay-apiv3:wechatpay-java:${wechatpayVersion}")
    }
}

publishing {
    publications {
        // 显式声明 closure 入参类型，避免 IDEA Groovy DSL 推不出 register 的泛型 <U extends Publication>
        register('bom', MavenPublication) { MavenPublication pub ->
            pub.from components.javaPlatform
        }
    }
    // Nexus 仓库配置在根 build.gradle 的 configure(subprojects) 中统一注册
}
